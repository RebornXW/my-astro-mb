<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>光影推箱</title>
  <style>
    :root {
      --ink: #2C303A;
      --ink-soft: #6C7280;
      --ink-muted: #989EA8;
      --glass: rgba(255, 253, 249, 0.82);
      --glass-strong: rgba(255, 253, 249, 0.96);
      --glass-border: rgba(255, 255, 255, 0.9);
      --card-border: rgba(156, 146, 132, 0.24);
      --gold: #E5A435;
      --gold-soft: rgba(229, 164, 53, 0.16);
      --jade: #47A17B;
      --ice: #5BAEDB;
      --danger: #D95B52;
      --shadow-sm: 0 6px 20px rgba(44, 48, 58, 0.08);
      --shadow-md: 0 18px 46px rgba(44, 48, 58, 0.14);
    }

    body.theme-night {
      --ink: #F2EFE9;
      --ink-soft: #A0AAC0;
      --ink-muted: #6C7892;
      --glass: rgba(24, 30, 44, 0.82);
      --glass-strong: rgba(26, 33, 48, 0.96);
      --glass-border: rgba(120, 144, 188, 0.28);
      --card-border: rgba(120, 144, 188, 0.22);
      --shadow-sm: 0 6px 20px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 22px 54px rgba(0, 0, 0, 0.52);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: linear-gradient(155deg, #E6EBF1 0%, #F4EFE6 52%, #EAE3D7 100%);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      touch-action: none;
      transition: background 0.35s ease, color 0.3s ease;
    }

    #viewportShell {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    body.mobile-preview #viewportShell {
      background: #1B1E26;
      padding: 16px;
    }

    #appStage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: inherit;
      transition: width 0.28s ease, height 0.28s ease, border-radius 0.28s ease;
    }

    body.mobile-preview #appStage {
      width: min(392px, calc(100vw - 32px));
      height: min(820px, calc(100vh - 32px));
      border-radius: 36px;
      border: 6px solid #2C313E;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 桌面端手机竖屏预览开关 */
    .preview-toggle {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 80;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    body.is-mobile .preview-toggle {
      display: none;
    }

    .ui-ico {
      width: 17px;
      height: 17px;
      display: block;
      flex-shrink: 0;
    }

    .ui-ico.sm {
      width: 14px;
      height: 14px;
    }

    .preview-toggle:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    /* =====================================================================
       封面界面
       ===================================================================== */
    .cover-screen {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(42px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    body:not(.in-cover) .cover-screen {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }

    .cover-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .cover-emblem {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 6px;
      padding-left: 6px;
      color: var(--ink);
    }

    .cover-stats {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 5px 14px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
    }

    .cover-stat-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .cover-stats b {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .cover-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 248px;
      pointer-events: auto;
    }

    .btn-primary {
      width: 100%;
      border: none;
      background: var(--ink);
      color: #FFFDF9;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 13px 24px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(44, 48, 58, 0.22);
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    body.theme-night .btn-primary {
      background: #F0B744;
      color: #161B26;
      box-shadow: 0 10px 26px rgba(240, 183, 68, 0.28);
    }

    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.96); }

    .cover-sub-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .btn-ghost {
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .btn-ghost:hover { transform: translateY(-1px); }
    .btn-ghost:active { transform: scale(0.96); }

    /* =====================================================================
       局内 HUD
       ===================================================================== */
    .hud-top {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-sm);
      max-width: calc(100% - 20px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    body.in-cover .hud-top,
    body.in-cover .hud-bottom {
      opacity: 0;
      pointer-events: none;
    }

    .hud-icon-btn {
      border: none;
      background: transparent;
      color: var(--ink);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.14s ease, opacity 0.14s ease, transform 0.12s ease;
    }

    .hud-icon-btn:hover { background: rgba(128, 134, 148, 0.14); }
    .hud-icon-btn:active { transform: scale(0.9); }

    .level-code-btn {
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 2px 5px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 14px;
      background: rgba(128, 134, 148, 0.24);
      flex-shrink: 0;
    }

    .step-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      padding: 0 2px;
      text-align: center;
    }

    .step-badge .opt-sub {
      color: var(--ink-muted);
      font-weight: 600;
      font-size: 11px;
    }

    /* 浮动消息与提示浮窗 */
    .hint-toast {
      position: absolute;
      top: max(68px, calc(env(safe-area-inset-top) + 54px));
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 35;
      background: var(--ink);
      color: #FFFDF9;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    body.theme-night .hint-toast {
      background: #F0B744;
      color: #161B26;
    }

    .hint-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hint-popover {
      position: absolute;
      left: 16px;
      bottom: max(76px, calc(env(safe-area-inset-bottom) + 68px));
      width: min(280px, calc(100% - 32px));
      z-index: 32;
      background: var(--glass-strong);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .hint-popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .hint-pop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 800;
    }

    .hint-pop-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hint-pop-text {
      font-size: 12.5px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    .hint-pop-actions {
      display: flex;
      gap: 8px;
    }

    .mini-pill-btn {
      flex: 1;
      border: 1px solid var(--card-border);
      background: var(--gold-soft);
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .mini-pill-btn.secondary {
      background: transparent;
    }

    /* 底部精简控制栏 */
    .hud-bottom {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .tool-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .round-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--ink);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease, opacity 0.15s ease, box-shadow 0.2s ease;
    }

    .round-btn:active { transform: scale(0.91); }
    .round-btn:disabled { opacity: 0.34; cursor: not-allowed; transform: none; }

    @keyframes deadlockPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 91, 82, 0.55), var(--shadow-sm); border-color: rgba(217, 91, 82, 0.75); }
      50% { box-shadow: 0 0 0 8px rgba(217, 91, 82, 0), var(--shadow-sm); border-color: rgba(217, 91, 82, 0.95); }
    }

    .round-btn.deadlock-alert {
      color: var(--danger);
      animation: deadlockPulse 1.4s ease-in-out infinite;
    }

    .hint-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--gold);
      color: #261C0B;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    .dpad-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: auto;
    }

    .dpad {
      display: none;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
    }

    .dpad.open {
      display: grid;
    }

    .dpad-btn {
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease;
    }

    .dpad-btn:active { transform: scale(0.9); }
    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }

    /* =====================================================================
       弹窗体系
       ===================================================================== */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(24, 28, 38, 0.34);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 360px;
      max-height: 82%;
      overflow-y: auto;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-md);
      transform: translateY(12px) scale(0.97);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .overlay.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-head h3 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    .close-btn {
      border: none;
      background: transparent;
      color: var(--ink-soft);
      font-size: 16px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover { background: rgba(128, 134, 148, 0.14); color: var(--ink); }

    /* 过关星级结算 */
    .clear-body {
      max-width: 310px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px 22px;
    }

    .clear-code {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--ink-soft);
    }

    .stars-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
    }

    @keyframes starPopIn {
      0% { transform: scale(0.25) rotate(-18deg); opacity: 0; }
      65% { transform: scale(1.22) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes platBurst {
      0% { transform: scale(0.15) rotate(-35deg); opacity: 0; filter: drop-shadow(0 0 0 rgba(154, 212, 255, 0)); }
      58% { transform: scale(1.32) rotate(8deg); opacity: 1; filter: drop-shadow(0 0 18px rgba(154, 212, 255, 1)); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 10px rgba(154, 212, 255, 0.85)); }
    }

    .star-svg {
      width: 38px;
      height: 38px;
      opacity: 0;
      transform: scale(0.3);
    }

    .star-svg.empty-slot {
      opacity: 1;
      transform: scale(1);
    }

    .star-svg.popped {
      animation: starPopIn 0.42s cubic-bezier(0.22, 1.35, 0.36, 1) forwards;
    }

    .star-svg.platinum {
      width: 42px;
      height: 42px;
    }

    .star-svg.platinum.popped {
      animation: platBurst 0.56s cubic-bezier(0.22, 1.4, 0.36, 1) forwards;
    }

    .clear-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .metric-box {
      background: rgba(140, 144, 156, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .metric-box span { font-size: 11px; color: var(--ink-soft); }
    .metric-box b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }

    .clear-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .clear-actions .round-btn { flex-shrink: 0; }
    .clear-actions .btn-primary { flex: 1; padding: 11px 16px; }

    /* 选关列表 */
    .chap-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chap-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chap-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chap-ico {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chap-title { font-size: 13px; font-weight: 800; }
    .chap-tags { font-size: 10.5px; color: var(--ink-soft); }

    .lvl-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .lvl-card {
      border: 1.5px solid var(--card-border);
      background: rgba(140, 144, 156, 0.05);
      border-radius: 13px;
      padding: 10px 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      transition: all 0.14s ease;
    }

    .lvl-card:hover { border-color: var(--ink-soft); }
    .lvl-card.current { border-color: var(--gold); background: var(--gold-soft); }

    .lvl-code { font-size: 13.5px; font-weight: 800; color: var(--ink); }
    .lvl-stars { display: flex; gap: 2px; height: 12px; align-items: center; }

    .del-custom-btn {
      position: absolute;
      top: 3px;
      right: 4px;
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: rgba(217, 91, 82, 0.16);
      color: var(--danger);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .import-details {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
      font-size: 12px;
    }

    .import-details summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      list-style: none;
    }

    .import-details summary::-webkit-details-marker { display: none; }

    .import-box {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .import-box textarea {
      width: 100%;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px;
      font-size: 11.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(140, 144, 156, 0.06);
      color: var(--ink);
      outline: none;
      resize: vertical;
    }

    /* 外观换肤 */
    .skin-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: rgba(140, 144, 156, 0.14);
      padding: 3px;
      border-radius: 11px;
      margin-bottom: 12px;
    }

    .skin-tab-btn {
      border: none;
      background: transparent;
      color: var(--ink-soft);

      /* =====================================================================
         2. 空灵 Web Audio 合成音效器
         ===================================================================== */
      class ZenAudio {
        constructor() { this.ctx = null; this.muted = false; }
        ensure() {
          if (this.muted) return null;
          try {
            if (!this.ctx) {
              const Ctx = window.AudioContext || window.webkitAudioContext;
              if (Ctx) this.ctx = new Ctx();
            }
            if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
            return this.ctx;
          } catch (e) { return null; }
        }
        tone(f1, f2, dur, type = "sine", vol = 0.08, delay = 0) {
          const ctx = this.ensure();
          if (!ctx) return;
          try {
            const t = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(f1, t);
            osc.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.014);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(t); osc.stop(t + dur + 0.02);
          } catch (e) {}
        }
        step() {
          const j = 0.95 + Math.random() * 0.1;
          this.tone(340 * j, 210 * j, 0.055, "sine", 0.045);
        }
        push() {
          const j = 0.95 + Math.random() * 0.1;
          this.tone(175 * j, 92 * j, 0.095, "triangle", 0.11);
        }
        melt() { this.tone(980, 1480, 0.16, "sine", 0.055); this.tone(1320, 1760, 0.14, "sine", 0.035, 0.04); }
        freeze() { this.tone(1240, 720, 0.15, "triangle", 0.05); }
        suppressPop() { this.tone(740, 1180, 0.11, "sine", 0.065); }
        blocked() { this.tone(120, 88, 0.065, "sine", 0.05); }
        undo() { this.tone(440, 320, 0.075, "sine", 0.06); }
        lockNote(count) {
          const chords = [[523.25, 659.25], [659.25, 783.99], [783.99, 1046.5, 1318.5]];
          const notes = chords[Math.min(chords.length - 1, Math.max(0, count - 1))];
          notes.forEach((f, i) => this.tone(f, f * 1.005, 0.28, "sine", 0.07, i * 0.055));
        }
        starPop(idx, isPlat = false) {
          if (isPlat) {
            this.tone(1046.5, 1318.5, 0.42, "sine", 0.08);
            this.tone(1567.98, 1567.98, 0.48, "triangle", 0.045, 0.06);
            return;
          }
          const scale = [587.33, 739.99, 880.0];
          const f = scale[Math.min(scale.length - 1, idx)];
          this.tone(f, f * 1.015, 0.26, "sine", 0.075);
        }
        win() {
          [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
            this.tone(f, f, 0.55, "sine", 0.065, i * 0.085);
          });
        }
      }
