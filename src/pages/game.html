      /* =====================================================================
         8. 微信同构触控实例 + 动态光路纯步行自动寻路
         ===================================================================== */
      function findDynamicWalkPath(staticMap, initDyn, targetR, targetC) {
        if (!initDyn || !initDyn.player) return null;
        const sr = initDyn.player.r, sc = initDyn.player.c;
        if (sr === targetR && sc === targetC) return [];
        const initLit = GameEngine.computeLighting(staticMap, initDyn, false).lit;
        const visited = new Set([`${sr},${sc}`]);
        const queue = [{ dyn: initDyn, lit: initLit, parent: -1, mv: null }];
        let head = 0;

        while (head < queue.length) {
          const cur = queue[head];
          for (let d = 0; d < GameEngine.DIRS4.length; d++) {
            const mv = GameEngine.DIRS4[d];
            const nr = cur.dyn.player.r + mv.dr, nc = cur.dyn.player.c + mv.dc;
            const key = `${nr},${nc}`;
            if (visited.has(key)) continue;
            if (GameEngine.solidEntityAt(cur.dyn, cur.lit, nr, nc)) continue;
            const res = GameEngine.stepState(staticMap, cur.dyn, cur.lit, mv.dr, mv.dc, mv.dir);
            if (!res || res.pushed) continue;
            visited.add(key);
            const idx = queue.length;
            queue.push({ dyn: res.dyn, lit: res.lit, parent: head, mv });
            if (nr === targetR && nc === targetC) {
              const path = [];
              let p = idx;
              while (p > 0) { path.push(queue[p].mv); p = queue[p].parent; }
              path.reverse();
              return path;
            }
          }
          head++;
        }
        return null;
      }

      const touchCtrl = TouchInputController.create({
        canAccept: () => !game.inCover && !game.won,
        onDirection: (dr, dc, dir) => { move(dr, dc, dir); },
        onTap: (x, y) => {
          if (!game.staticMap || !game.dyn.player) return;
          const c = Math.floor((x - game.bx) / game.ts);
          const r = Math.floor((y - game.by) / game.ts);
          if (r < 0 || r >= game.staticMap.rows || c < 0 || c >= game.staticMap.cols) return;

          const dr = r - game.dyn.player.r, dc = c - game.dyn.player.c;
          if (Math.abs(dr) + Math.abs(dc) === 1 && GameEngine.solidEntityAt(game.dyn, game.light.lit, r, c)) {
            const dir = dr === -1 ? "up" : dr === 1 ? "down" : dc === -1 ? "left" : "right";
            move(dr, dc, dir);
            return;
          }

          const path = findDynamicWalkPath(game.staticMap, game.dyn, r, c);
          if (path && path.length > 0) {
            audio.ensure();
            game.walkQueue = path;
            game.walkTarget = { r, c };
            game.walkTimer = 112;
          }
        }
      });

      /* =====================================================================
         9. 主渲染循环（60fps）
         ===================================================================== */
      let elapsed = 0, lastTs = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(50, now - lastTs);
        lastTs = now;
        elapsed += dt * 0.001;
        const lerp = Math.min(1, dt * 0.017);

        if (game.inCover && game.staticMap) {
          game.demoTimer += dt;
          const interval = game.demoIdx === COVER_DEMO_MOVES.length ? 1500 : 420;
          if (game.demoTimer >= interval) {
            game.demoTimer = 0;
            if (game.demoIdx >= COVER_DEMO_MOVES.length) {
              resetCoverDemo();
            } else {
              const [dr, dc, dir] = COVER_DEMO_MOVES[game.demoIdx++];
              const res = GameEngine.stepState(game.staticMap, game.dyn, game.light.lit, dr, dc, dir);
              if (res) {
                game.dyn = res.dyn;
                game.light = GameEngine.computeLighting(game.staticMap, game.dyn, true);
                game.pVis.hop = res.pushed ? 0 : 1;
              }
            }
          }
        } else if (game.walkQueue.length > 0 && !game.won) {
          game.walkTimer += dt;
          if (game.walkTimer >= 112) {
            game.walkTimer = 0;
            const nextMv = game.walkQueue.shift();
            const ok = move(nextMv.dr, nextMv.dc, nextMv.dir, true);
            if (!ok || game.walkQueue.length === 0) game.walkTarget = null;
          }
        }

        ctx.clearRect(0, 0, game.viewW, game.viewH);
        if (!game.staticMap || !game.dyn || !game.light) return;

        const { rows, cols, walls, suns, iceWalls, treeWalls, goals } = game.staticMap;
        const { lit, beams, hitMirrors, blockers } = game.light;
        const ts = game.ts, bx = game.bx, by = game.by;

        if (game.boardIntro < 1) game.boardIntro = Math.min(1, game.boardIntro + dt * 0.0056);
        const introEase = 1 - Math.pow(1 - game.boardIntro, 3);

        ctx.save();
        if (game.boardIntro < 1) {
          const cx = bx + (cols * ts) / 2, cy = by + (rows * ts) / 2;
          const sc = 0.96 + 0.04 * introEase;
          ctx.globalAlpha = introEase;
          ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
        }

        Assets2D.drawIslandBase(ctx, bx, by, cols * ts, rows * ts, ts);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = bx + c * ts, y = by + r * ts;
            const targetLit = lit[r][c] ? 1 : 0;
            game.floorLitAnim[r][c] += (targetLit - game.floorLitAnim[r][c]) * lerp;
            const f = game.floorLitAnim[r][c];
            const baseHex = (r + c) % 2 === 0 ? Assets2D.CFG.floorA : Assets2D.CFG.floorB;
            ctx.fillStyle = walls[r][c]
              ? Assets2D.CFG.wallBase
              : (f > 0.5 ? Assets2D.lerpHex(baseHex, Assets2D.CFG.floorLit, (f - 0.5) * 1.15) : Assets2D.lerpHex(Assets2D.CFG.floorShadow, baseHex, f * 2));
            ctx.fillRect(x, y, ts, ts);
            if (!walls[r][c]) {
              ctx.strokeStyle = Assets2D.CFG.floorGrid;
              ctx.lineWidth = 1;
              ctx.strokeRect(x + 0.5, y + 0.5, ts - 1, ts - 1);
            }
          }
        }

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (walls[r][c] || suns.some(s => s.r === r && s.c === c)) {
              Assets2D.castShadowRect(ctx, bx + c * ts, by + r * ts, ts, ts, 2, ts * Assets2D.CFG.shadowLen, Assets2D.CFG.isDark ? 0.3 : 0.15);
            }
          }
        }

        goals.forEach((g, idx) => {
          const e = GameEngine.solidEntityAt(game.dyn, lit, g.r, g.c);
          const locked = Boolean(e && GameEngine.TARGET_BOXES.has(e.kind));
          game.goalLockAnim[idx] += ((locked ? 1 : 0) - game.goalLockAnim[idx]) * Math.min(1, dt * 0.012);
          game.goalLockBounce[idx] = Math.max(0, (game.goalLockBounce[idx] || 0) - dt * 0.0055);
          Assets2D.drawGoal(ctx, bx + g.c * ts, by + g.r * ts, ts, game.goalLockAnim[idx], elapsed);
        });

        if (game.walkTarget) Assets2D.drawWalkTarget(ctx, bx + game.walkTarget.c * ts, by + game.walkTarget.r * ts, ts, elapsed);

        iceWalls.forEach((w, idx) => {
          const sup = GameEngine.isTerrainSuppressed(game.dyn, lit, w.r, w.c);
          const solid = !lit[w.r][w.c] && !sup;
          game.icePhase[idx] += ((solid ? 1 : 0) - game.icePhase[idx]) * Math.min(1, dt * 0.015);
          if (game.icePhase[idx] < 0.97) {
            Assets2D.drawWaterPuddle(ctx, bx + w.c * ts, by + w.r * ts, ts, false, elapsed, idx, 1 - game.icePhase[idx]);
          }
          if (!lit[w.r][w.c] && sup) Assets2D.drawSuppressFrame(ctx, bx + w.c * ts, by + w.r * ts, ts, "C", elapsed);
        });

        treeWalls.forEach((w, idx) => {
          const sup = GameEngine.isTerrainSuppressed(game.dyn, lit, w.r, w.c);
          const solid = lit[w.r][w.c] && !sup;
          game.amberPhase[idx] += ((solid ? 1 : 0) - game.amberPhase[idx]) * Math.min(1, dt * 0.015);
          if (game.amberPhase[idx] < 0.97) Assets2D.drawAmberWall(ctx, bx + w.c * ts, by + w.r * ts, ts, game.amberPhase[idx]);
          if (lit[w.r][w.c] && sup) Assets2D.drawSuppressFrame(ctx, bx + w.c * ts, by + w.r * ts, ts, "F", elapsed);
        });

        game.dyn.entities.forEach(e => {
          let vis = game.eVis.get(e.id);
          if (!vis) {
            vis = { vr: e.r, vc: e.c, hover: 0, phase: GameEngine.isEntitySolid(game.dyn, lit, e) ? 1 : 0 };
            game.eVis.set(e.id, vis);
          }
          vis.vr += (e.r - vis.vr) * lerp;
          vis.vc += (e.c - vis.vc) * lerp;
          const solid = GameEngine.isEntitySolid(game.dyn, lit, e);
          vis.phase += ((solid ? 1 : 0) - vis.phase) * Math.min(1, dt * 0.015);
          const isAdj = !game.inCover && solid && (Math.abs(game.dyn.player.r - e.r) + Math.abs(game.dyn.player.c - e.c) === 1);
          vis.hover += ((isAdj ? 1 : 0) - vis.hover) * Math.min(1, dt * 0.012);

          if (!solid && vis.phase < 0.97) {
            const x = bx + vis.vc * ts, y = by + vis.vr * ts;
            if (e.kind === "C") Assets2D.drawWaterPuddle(ctx, x, y, ts, true, elapsed, e.id, 1 - vis.phase);
            else if (e.kind === "F") Assets2D.drawAmberBox(ctx, x, y, ts, vis.phase, false, elapsed);
          }
        });

        Assets2D.drawBeams(ctx, bx, by, ts, beams);
        Assets2D.drawOcclusionShadows(ctx, bx, by, ts, blockers);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (walls[r][c]) Assets2D.drawWall(ctx, bx + c * ts, by + r * ts, ts, r, c, walls, rows, cols);
          }
        }
        suns.forEach(s => Assets2D.drawSunTower(ctx, bx + s.c * ts, by + s.r * ts, ts, elapsed));

        iceWalls.forEach((w, idx) => {
          const ph = game.icePhase[idx] || 0;
          if (ph > 0.03) Assets2D.drawIceWall(ctx, bx + w.c * ts, by + w.r * ts, ts, ph);
          if (ph > 0.25 && game.dyn.entities.some(e => e.r === w.r && e.c === w.c && e.kind === "F")) {
            Assets2D.drawSealedCrown(ctx, bx + w.c * ts, by + w.r * ts, ts, "F", ph);
          }
        });
        treeWalls.forEach((w, idx) => {
          const ph = game.amberPhase[idx] || 0;
          if (ph > 0.03) Assets2D.drawAmberWall(ctx, bx + w.c * ts, by + w.r * ts, ts, ph);
          if (ph > 0.25 && game.dyn.entities.some(e => e.r === w.r && e.c === w.c && e.kind === "C")) {
            Assets2D.drawSealedCrown(ctx, bx + w.c * ts, by + w.r * ts, ts, "C", ph);
          }
        });

        game.dyn.entities.forEach(e => {
          const vis = game.eVis.get(e.id);
          const solid = GameEngine.isEntitySolid(game.dyn, lit, e);
          if (!solid && vis.phase <= 0.03) return;
          const x = bx + vis.vc * ts, y = by + vis.vr * ts;
          const goalIdx = goals.findIndex(g => g.r === e.r && g.c === e.c);
          const onGoal = goalIdx >= 0;
          const bounceVal = onGoal ? (game.goalLockBounce[goalIdx] || 0) : 0;
          const lockScale = 1 - Math.sin(bounceVal * Math.PI) * 0.075;

          const underBox = solid
            ? game.dyn.entities.find(o => o.id !== e.id && o.r === e.r && o.c === e.c && (o.kind === "C" || o.kind === "F"))
            : null;
          const isCFPair = Boolean(underBox && ((e.kind === "C" && underBox.kind === "F") || (e.kind === "F" && underBox.kind === "C")));

          if (underBox && !isCFPair) {
            const isUnderSup = (underBox.kind === "C" && !lit[e.r][e.c]) || (underBox.kind === "F" && lit[e.r][e.c]);
            Assets2D.drawSquareMat(ctx, x, y, ts, underBox.kind, 0.85, isUnderSup);
          }

          if (solid && vis.hover > 0.02) {
            const isCircle = e.kind === "L" || e.kind === "\\" || e.kind === "/" || Boolean(GameEngine.SPOT_DIRS[e.kind]);
            const haloRgb = (e.kind === "C" || e.kind === "\\" || e.kind === "/") ? "128, 212, 250" : "244, 188, 68";
            Assets2D.drawHoverHalo(ctx, x, y, ts, isCircle, haloRgb, vis.hover);
          }

          const woodScale = (underBox && !isCFPair) ? lockScale * 0.88 : lockScale;
          if (e.kind === "B") Assets2D.drawWoodBox(ctx, x, y, ts, onGoal, elapsed, woodScale);
          else if (e.kind === "C") Assets2D.drawIceBox(ctx, x, y, ts, onGoal && solid, elapsed, vis.phase, lockScale);
          else if (e.kind === "F" && vis.phase > 0.03) Assets2D.drawAmberBox(ctx, x, y, ts, vis.phase, onGoal && solid, elapsed, lockScale);
          else if (e.kind === "L") Assets2D.drawLantern(ctx, x, y, ts, elapsed);
          else if (GameEngine.SPOT_DIRS[e.kind]) Assets2D.drawSpotlight(ctx, x, y, ts, e.kind, elapsed);
          else if (e.kind === "\\" || e.kind === "/") Assets2D.drawMirror(ctx, x, y, ts, e.kind, hitMirrors.has(e.id));

          if (isCFPair) Assets2D.drawCFJadeCore(ctx, x, y, ts, underBox.kind);
        });

        for (let i = game.ripples.length - 1; i >= 0; i--) {
          const rp = game.ripples[i];
          rp.life -= dt;
          if (rp.life <= 0) { game.ripples.splice(i, 1); continue; }
          Assets2D.drawGoalRipple(ctx, bx + rp.c * ts, by + rp.r * ts, ts, 1 - rp.life / rp.maxLife, rp.isVictory);
        }

        game.pVis.vr += (game.dyn.player.r - game.pVis.vr) * lerp;
        game.pVis.vc += (game.dyn.player.c - game.pVis.vc) * lerp;
        game.pVis.hop = Math.max(0, game.pVis.hop - dt * 0.0068);
        game.pVis.pushSquash = Math.max(0, game.pVis.pushSquash - dt * 0.0072);
        game.pVis.bumpT = Math.max(0, game.pVis.bumpT - dt * 0.006);
        const bumpMag = Math.sin(game.pVis.bumpT * Math.PI) * ts * 0.11;
        Assets2D.drawHero(
          ctx, bx + game.pVis.vc * ts, by + game.pVis.vr * ts, ts,
          game.dyn.player.dir, game.pVis.hop, progress.heroId,
          game.pVis.bumpDc * bumpMag, game.pVis.bumpDr * bumpMag,
          elapsed, game.pVis.pushSquash, game.pVis.pushDr, game.pVis.pushDc
        );

        Assets2D.drawLitRims(ctx, bx, by, ts, blockers);

        for (let i = game.particles.length - 1; i >= 0; i--) {
          const p = game.particles[i];
          p.life -= dt;
          if (p.life <= 0) { game.particles.splice(i, 1); continue; }
          p.r += p.vr * dt; p.c += p.vc * dt;
          const alpha = p.life / p.maxLife;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(bx + p.c * ts, by + p.r * ts, p.size * (0.5 + 0.5 * alpha), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (game.hintArrow && now < game.hintArrow.expireAt) {
          Assets2D.drawGuideArrow(ctx, bx + game.dyn.player.c * ts, by + game.dyn.player.r * ts, ts, game.hintArrow.dr, game.hintArrow.dc, elapsed);
        }

        ctx.restore();

        if (!game.inCover && !game.won && touchCtrl.state.active) {
          Assets2D.drawTouchFeedback(ctx, touchCtrl.state);
        }
      }

      /* =====================================================================
         10. HUD、选关弹窗、外观弹窗与自定义导入
         ===================================================================== */
      function updateHUD() {
        const lvl = LEVELS[game.levelIdx];
        document.getElementById("hudLevelCode").textContent = lvl.code;
        const stepEl = document.getElementById("stepBadge");
        if (progress.records[lvl.id]) {
          const opt = GameEngine.getOptimalSteps(lvl);
          stepEl.innerHTML = opt ? `${game.steps} <span class="opt-sub">/ 最优 ${opt}</span>` : `${game.steps} 步`;
        } else {
          stepEl.textContent = `${game.steps} 步`;
        }
        document.getElementById("hintBadge").textContent = progress.hintsLeft;
        const undoBtn = document.getElementById("btnUndo");
        undoBtn.disabled = game.history.length === 0 || game.won;
        undoBtn.classList.toggle("deadlock-alert", game.deadlock && !undoBtn.disabled);
      }

      function renderChaptersModal() {
        const root = document.getElementById("chapList");
        root.innerHTML = "";
        const chapNums = [...new Set(LEVELS.map(l => l.chapter))].sort((a, b) => a - b);

        chapNums.forEach(cNum => {
          const meta = CHAPTER_META[cNum] || { title: "自定义关卡", icon: UI_SVGS.custom, iconBg: "#EFECE6", tags: "编辑器导入 · 本地持久化" };
          const lvls = LEVELS.filter(l => l.chapter === cNum);
          const block = document.createElement("div");
          block.className = "chap-block";
          block.innerHTML = `
            <div class="chap-head">
              <div class="chap-ico" style="background:${meta.iconBg};">${meta.icon}</div>
              <div>
                <div class="chap-title">${meta.title}</div>
                <div class="chap-tags">${meta.tags}</div>
              </div>
            </div>
            <div class="lvl-grid"></div>
          `;
          const grid = block.querySelector(".lvl-grid");
          lvls.forEach(l => {
            const idx = LEVELS.indexOf(l);
            const rec = progress.records[l.id];
            const card = document.createElement("div");
            card.className = "lvl-card" + (!game.inCover && idx === game.levelIdx ? " current" : "");
            let stars = "";
            if (rec) {
              for (let s = 1; s <= 3; s++) {
                stars += `<svg width="11" height="11" viewBox="0 0 24 24" fill="${s <= rec.gold ? "#E5A435" : "rgba(156,146,132,0.25)"}"><polygon points="12,2 15.1,8.5 22,9.5 17,14.4 18.2,21.4 12,18 5.8,21.4 7,14.4 2,9.5 8.9,8.5"/></svg>`;
              }
              if (rec.platinum) {
                stars += `<svg width="11" height="11" viewBox="0 0 24 24" fill="#7CC4FA"><polygon points="12,2 15,9 22,12 15,15 12,22 9,15 2,12 9,9"/></svg>`;
              }
            }
            card.innerHTML = `<span class="lvl-code">${l.code}</span><div class="lvl-stars">${stars}</div>`;
            if (cNum === 3) {
              const delBtn = document.createElement("button");
              delBtn.className = "del-custom-btn";
              delBtn.textContent = "×";
              delBtn.title = "删除自定义关卡";
              delBtn.addEventListener("click", ev => {
                ev.stopPropagation();
                const li = LEVELS.findIndex(x => x.id === l.id);
                if (li >= 0) LEVELS.splice(li, 1);
                progress.customLevels = (progress.customLevels || []).filter(x => x.id !== l.id);
                delete progress.records[l.id];
                saveProgress();
                updateCoverStats();
                renderChaptersModal();
              });
              card.appendChild(delBtn);
            }
            card.addEventListener("click", () => exitCover(idx));
            grid.appendChild(card);
          });
          root.appendChild(block);
        });
      }

      function importLevelFromJson(raw) {
        try {
          const parsed = JSON.parse(raw.trim());
          const rows = parsed.map || parsed.grid;
          if (!Array.isArray(rows) || rows.length < 4) throw new Error("缺少有效 map 数组");
          const check = GameEngine.parseMap(rows);
          if (!check.dynState.player || !check.staticMap.goals.length) throw new Error("地图需包含主角 P 与终点 X");
          const customCount = LEVELS.filter(l => l.chapter === 3).length + 1;
          const customLvl = {
            id: Date.now(),
            code: parsed.code || `C-${customCount}`,
            chapter: 3,
            hint: parsed.hint || "观察光路与占格压制关系。",
            optimalSteps: typeof parsed.optimalSteps === "number" ? parsed.optimalSteps : undefined,
            map: rows
          };
          LEVELS.push(customLvl);
          progress.customLevels = progress.customLevels || [];
          progress.customLevels.push(customLvl);
          saveProgress();
          exitCover(LEVELS.length - 1);
          showToast(`已载入并保存 ${customLvl.code}`);
        } catch (err) {
          showToast("导入失败：" + err.message, 2600);
        }
      }

      function renderThemesModal() {
        const { gold, plat } = getStarTotals();
        const envGrid = document.getElementById("envSkinGrid");
        envGrid.innerHTML = "";
        THEMES.forEach(th => {
          const unlocked = progress.tryAll || (gold >= th.reqGold && plat >= th.reqPlat);
          const card = document.createElement("div");
          card.className = "skin-card" + (progress.themeId === th.id ? " active" : "") + (!unlocked ? " locked" : "");
          card.innerHTML = `
            <div class="theme-swatch" style="background:${th.swatch};"></div>
            <div class="skin-name">${th.name}</div>
            <div class="skin-req">${unlocked ? (progress.themeId === th.id ? "使用中" : "点击启用") : UI_SVGS.lock + " " + th.reqText}</div>
          `;
          card.addEventListener("click", () => {
            if (!unlocked) { showToast(`需 ${th.reqText} 解锁，或勾选下方试穿`); return; }
            progress.themeId = th.id;
            saveProgress();
            Assets2D.applyTheme(th.id);
            renderThemesModal();
          });
          envGrid.appendChild(card);
        });

        const heroGrid = document.getElementById("heroSkinGrid");
        heroGrid.innerHTML = "";
        HERO_SKINS.forEach(hs => {
          const unlocked = progress.tryAll || (gold >= hs.reqGold && plat >= hs.reqPlat);
          const card = document.createElement("div");
          card.className = "skin-card" + (progress.heroId === hs.id ? " active" : "") + (!unlocked ? " locked" : "");
          card.innerHTML = `
            <canvas class="hero-preview-cvs" width="112" height="112"></canvas>
            <div class="skin-name">${hs.name}</div>
            <div class="skin-req">${unlocked ? (progress.heroId === hs.id ? "使用中" : "点击启用") : UI_SVGS.lock + " " + hs.reqText}</div>
          `;
          const pCtx = card.querySelector("canvas").getContext("2d");
          pCtx.clearRect(0, 0, 112, 112);
          Assets2D.drawHero(pCtx, 12, 12, 88, "right", 0, hs.id);
          card.addEventListener("click", () => {
            if (!unlocked) { showToast(`需 ${hs.reqText} 解锁，或勾选下方试穿`); return; }
            progress.heroId = hs.id;
            saveProgress();
            renderThemesModal();
          });
          heroGrid.appendChild(card);
        });
        document.getElementById("chkTryAll").checked = Boolean(progress.tryAll);
      }

      function detectMobile() {
        const isMob = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger/i.test(navigator.userAgent) ||
          (window.matchMedia && window.matchMedia("(pointer: coarse)").matches && window.innerWidth <= 820);
        document.body.classList.toggle("is-mobile", isMob);
        if (isMob) document.body.classList.remove("mobile-preview");
      }

      document.getElementById("btnMobileToggle").addEventListener("click", () => {
        const on = document.body.classList.toggle("mobile-preview");
        document.getElementById("mobileToggleText").textContent = on ? "全屏模式" : "手机竖屏";
        setTimeout(resizeCanvas, 300);
      });

      document.getElementById("btnCoverChapters").addEventListener("click", () => { renderChaptersModal(); document.getElementById("chaptersOverlay").classList.add("open"); });

      // 长按连续悔棋

      btnUndo.addEventListener("pointerdown", e => {
        e.preventDefault();
        undo();
        stopUndoHold();
        undoHoldDelay = setTimeout(() => {
          undoHoldInterval = setInterval(() => { if (!undo()) stopUndoHold(); }, 125);

        pop.classList.toggle("open");
      });
      document.getElementById("btnCloseHint").addEventListener("click", () => document.getElementById("hintPopover").classList.remove("open"));
      document.getElementById("btnBfsStep").addEventListener("click", () => {
        if (progress.hintsLeft <= 0) { showToast("指引次数不足，点击右侧 +3 补给"); return; }
        const mv = GameEngine.findNextBestMove(game.staticMap, game.dyn);
        if (!mv) {
          game.deadlock = true; updateHUD();
          document.getElementById("hintPopover").classList.remove("open");
          showToast("当前已走入死角，建议先点悔棋退回");
          return;
        }

        game.hintArrow = { dr: mv.dr, dc: mv.dc, expireAt: performance.now() + 3400 };
        document.getElementById("hintPopover").classList.remove("open");
        showToast(`建议方向：${mv.sym}`);

        const lvl = LEVELS[game.levelIdx];

        const ta = document.createElement("textarea");
        ta.value = `我在《光影推箱》第 ${lvl.code} 关用 ${game.steps} 步通关${opt && game.steps <= opt ? "（达成理论最优！）" : ""}，来挑战看看！`;
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();

        document.body.removeChild(ta);

      // 方向键支持长按连走
      let dpadDelay = null, dpadInterval = null;
      function stopDpadHold() { clearTimeout(dpadDelay); clearInterval(dpadInterval); }
      document.querySelectorAll(".dpad-btn").forEach(btn => {
        const dir = btn.dataset.dir;
        const mapDir = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
        const [dr, dc] = mapDir[dir];
        btn.addEventListener("pointerdown", e => {
          e.preventDefault();
          move(dr, dc, dir);
          stopDpadHold();
          dpadDelay = setTimeout(() => {
            dpadInterval = setInterval(() => { move(dr, dc, dir); }, 140);
          }, 300);
        });
        ["pointerup", "pointercancel", "pointerleave"].forEach(ev => btn.addEventListener(ev, stopDpadHold));
      });

      // 画布触控与鼠标指针接入 TouchInputController
      canvas.addEventListener("pointerdown", e => {
        const rect = canvas.getBoundingClientRect();
        canvas.setPointerCapture(e.pointerId);
        touchCtrl.onStart(e.clientX - rect.left, e.clientY - rect.top, e.pointerId);
      });
      canvas.addEventListener("pointermove", e => {
        const rect = canvas.getBoundingClientRect();
        touchCtrl.onMove(e.clientX - rect.left, e.clientY - rect.top, e.pointerId);
      });
      canvas.addEventListener("pointerup", e => {
        const rect = canvas.getBoundingClientRect();
        touchCtrl.onEnd(e.clientX - rect.left, e.clientY - rect.top, e.pointerId);
      });
      canvas.addEventListener("pointercancel", () => touchCtrl.cancel());

      window.addEventListener("keydown", e => {
        if (document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
        if (document.getElementById("clearOverlay").classList.contains("open")) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.getElementById("btnNextLevel").click(); }
          return;
        }
        if (game.inCover) return;
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") { e.preventDefault(); move(-1, 0, "up"); }
        else if (k === "arrowdown" || k === "s") { e.preventDefault(); move(1, 0, "down"); }
        else if (k === "arrowleft" || k === "a") { e.preventDefault(); move(0, -1, "left"); }
        else if (k === "arrowright" || k === "d") { e.preventDefault(); move(0, 1, "right"); }
        else if (k === "z") { e.preventDefault(); undo(); }
        else if (k === "r") { e.preventDefault(); restartLevelWithUndo(); }
      });

      window.addEventListener("resize", () => { detectMobile(); resizeCanvas(); });

      window.QingxueAPI = {
        engine: GameEngine,
        assets: Assets2D,
        touchController: touchCtrl,
        importLevel: importLevelFromJson
      };

      window.onload = function () {
        detectMobile();
        loadProgress();
        Assets2D.applyTheme(progress.themeId);
        enterCover();
        requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
</html>
