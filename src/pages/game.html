      /* =====================================================================
         3. MODULE 1: GameEngine（纯逻辑 + 占格压制 + 暖珀统一挡光 + BFS）
         ===================================================================== */
      const GameEngine = (function () {
        const SPOT_DIRS = { "^": [-1, 0], "v": [1, 0], "<": [0, -1], ">": [0, 1] };
        const TARGET_BOXES = new Set(["B", "C", "F"]);
        const DYNAMIC_KINDS = new Set(["B", "C", "F", "L", "\\", "/", "^", "v", "<", ">"]);
        const DIRS4 = [
          { dr: -1, dc: 0, dir: "up", sym: "↑" },
          { dr: 1, dc: 0, dir: "down", sym: "↓" },
          { dr: 0, dc: -1, dir: "left", sym: "←" },
          { dr: 0, dc: 1, dir: "right", sym: "→" }
        ];
        const optimalCache = new Map();

        function parseMap(gridRows) {
          const rows = gridRows.length;
          const cols = gridRows[0].length;
          const walls = [], suns = [], iceWalls = [], treeWalls = [], goals = [], entities = [];
          let player = null, eid = 1;
          for (let r = 0; r < rows; r++) {
            const wRow = [];
            for (let c = 0; c < cols; c++) {
              const ch = gridRows[r][c] || ".";
              wRow.push(ch === "#");
              if (ch === "S") suns.push({ r, c });
              else if (ch === "I") iceWalls.push({ r, c });
              else if (ch === "V") treeWalls.push({ r, c });
              else if (ch === "X") goals.push({ r, c });
              else if (ch === "P") player = { r, c, dir: "right" };
              else if (DYNAMIC_KINDS.has(ch)) entities.push({ id: eid++, kind: ch, r, c });
            }
            walls.push(wRow);
          }
          return { staticMap: { rows, cols, walls, suns, iceWalls, treeWalls, goals }, dynState: { player, entities } };
        }

        function cloneDyn(dyn) {
          return {
            player: dyn.player ? { r: dyn.player.r, c: dyn.player.c, dir: dyn.player.dir } : null,
            entities: dyn.entities.map(e => ({ id: e.id, kind: e.kind, r: e.r, c: e.c }))
          };
        }

        function isEntitySuppressed(dyn, ent) {
          if (dyn.player && dyn.player.r === ent.r && dyn.player.c === ent.c) return true;
          return dyn.entities.some(o => {
            if (o.id === ent.id || o.r !== ent.r || o.c !== ent.c) return false;
            const alwaysSolid = o.kind === "B" || o.kind === "L" || o.kind === "\\" || o.kind === "/" || Boolean(SPOT_DIRS[o.kind]);
            return alwaysSolid || (o.kind === ent.kind && o.id < ent.id);
          });
        }

        function isEntitySolid(dyn, lit, ent) {
          if (ent.kind === "B" || ent.kind === "L" || ent.kind === "\\" || ent.kind === "/" || SPOT_DIRS[ent.kind]) return true;
          if (isEntitySuppressed(dyn, ent)) return false;
          if (ent.kind === "C") return !lit[ent.r][ent.c];
          if (ent.kind === "F") return lit[ent.r][ent.c];
          return false;
        }

        function isTerrainSuppressed(dyn, lit, r, c) {
          if (dyn.player && dyn.player.r === r && dyn.player.c === c) return true;
          return dyn.entities.some(e => e.r === r && e.c === c && ((e.kind !== "C" && e.kind !== "F") || isEntitySolid(dyn, lit, e)));
        }

        function solidEntityAt(dyn, lit, r, c) {
          return dyn.entities.find(e => e.r === r && e.c === c && isEntitySolid(dyn, lit, e)) || null;
        }

        function computeLighting(staticMap, dyn, includeVisuals = false) {
          const { rows, cols, walls, suns, treeWalls } = staticMap;
          const lit = Array.from({ length: rows }, () => Array(cols).fill(false));
          const beams = includeVisuals ? [] : null;
          const hitMirrors = includeVisuals ? new Set() : null;
          const blockers = includeVisuals ? [] : null;

          function trace(sr, sc, dr, dc, depth) {
            if (depth > 14) return;
            let r = sr + dr, c = sc + dc, er = sr, ec = sc, moved = false;
            while (r >= 0 && r < rows && c >= 0 && c < cols) {
              if (walls[r][c] || suns.some(s => s.r === r && s.c === c)) break;
              lit[r][c] = true;
              er = r; ec = c; moved = true;

              if (dyn.player && dyn.player.r === r && dyn.player.c === c) {
                if (includeVisuals) blockers.push({ r, c, dr, dc, kind: "P" });
                break;
              }

              let blocked = false, blockKind = null, mirror = null;
              for (let i = 0; i < dyn.entities.length; i++) {
                const e = dyn.entities[i];
                if (e.r !== r || e.c !== c) continue;
                if (e.kind === "B" || e.kind === "L" || SPOT_DIRS[e.kind]) {
                  blocked = true; blockKind = e.kind; break;
                }
                if (e.kind === "F" && !isEntitySuppressed(dyn, e)) {
                  blocked = true; blockKind = "F"; break;
                }
                if (e.kind === "\\" || e.kind === "/") mirror = e;
              }
              if (blocked) {
                if (includeVisuals) blockers.push({ r, c, dr, dc, kind: blockKind });
                break;
              }
              if (mirror) {
                if (includeVisuals) {
                  hitMirrors.add(mirror.id);
                  beams.push({ r1: sr, c1: sc, r2: r, c2: c });
                }
                const ndr = mirror.kind === "\\" ? dc : -dc;
                const ndc = mirror.kind === "\\" ? dr : -dr;
                trace(r, c, ndr, ndc, depth + 1);
                return;
              }
              if (treeWalls.some(w => w.r === r && w.c === c)) {
                if (includeVisuals) blockers.push({ r, c, dr, dc, kind: "V" });
                break;
              }
              r += dr; c += dc;
            }
            if (includeVisuals && moved) beams.push({ r1: sr, c1: sc, r2: er, c2: ec });
          }

          for (let i = 0; i < suns.length; i++) {
            const s = suns[i];
            lit[s.r][s.c] = true;
            for (let d = 0; d < 4; d++) trace(s.r, s.c, DIRS4[d].dr, DIRS4[d].dc, 0);
          }
          for (let i = 0; i < dyn.entities.length; i++) {
            const e = dyn.entities[i];
            if (e.kind === "L") {
              lit[e.r][e.c] = true;
              for (let d = 0; d < 4; d++) trace(e.r, e.c, DIRS4[d].dr, DIRS4[d].dc, 0);
            } else if (SPOT_DIRS[e.kind]) {
              lit[e.r][e.c] = true;
              const [sdr, sdc] = SPOT_DIRS[e.kind];
              trace(e.r, e.c, sdr, sdc, 0);
            }
          }
          return { lit, beams, hitMirrors, blockers };
        }

        function isCellBlocked(staticMap, dyn, lit, r, c) {
          if (r < 0 || r >= staticMap.rows || c < 0 || c >= staticMap.cols) return true;
          if (staticMap.walls[r][c]) return true;
          if (staticMap.suns.some(s => s.r === r && s.c === c)) return true;
          if (staticMap.iceWalls.some(w => w.r === r && w.c === c) && !lit[r][c] && !isTerrainSuppressed(dyn, lit, r, c)) return true;
          if (staticMap.treeWalls.some(w => w.r === r && w.c === c) && lit[r][c] && !isTerrainSuppressed(dyn, lit, r, c)) return true;
          return false;
        }

        function stepState(staticMap, dyn, lit, dr, dc, dir) {
          if (!dyn.player) return null;
          const nr = dyn.player.r + dr, nc = dyn.player.c + dc;
          if (isCellBlocked(staticMap, dyn, lit, nr, nc)) return null;
          const ent = solidEntityAt(dyn, lit, nr, nc);
          if (ent) {
            const br = nr + dr, bc = nc + dc;
            if (isCellBlocked(staticMap, dyn, lit, br, bc) || solidEntityAt(dyn, lit, br, bc)) return null;
            if ((ent.kind === "C" || ent.kind === "F") && dyn.entities.some(o => o.r === br && o.c === bc && o.kind === ent.kind)) return null;
          }
          const nextDyn = cloneDyn(dyn);
          nextDyn.player.r = nr; nextDyn.player.c = nc; nextDyn.player.dir = dir;
          if (ent) {
            const target = nextDyn.entities.find(x => x.id === ent.id);
            target.r = nr + dr; target.c = nc + dc;
          }
          const nextLight = computeLighting(staticMap, nextDyn, false);
          return { dyn: nextDyn, lit: nextLight.lit, pushed: Boolean(ent) };
        }

        function isWon(staticMap, dyn, lit) {
          if (!staticMap.goals.length) return false;
          return staticMap.goals.every(g => {
            const e = solidEntityAt(dyn, lit, g.r, g.c);
            return Boolean(e && TARGET_BOXES.has(e.kind));
          });
        }

        function encodeState(dyn) {
          const parts = dyn.entities.map(e => `${e.kind}${e.r},${e.c}`);
          parts.sort();
          return `${dyn.player.r},${dyn.player.c}|${parts.join(";")}`;
        }

        function solveFromState(staticMap, initDyn, maxStates = 45000, maxMs = 400) {
          const t0 = performance.now();
          const initLit = computeLighting(staticMap, initDyn, false).lit;
          if (isWon(staticMap, initDyn, initLit)) return { solved: true, path: [] };
          const visited = new Set([encodeState(initDyn)]);
          const queue = [{ dyn: initDyn, lit: initLit, parent: -1, mvIdx: -1 }];
          let head = 0;
          while (head < queue.length && visited.size < maxStates) {
            if ((head & 63) === 0 && performance.now() - t0 > maxMs) return { solved: false, timedOut: true };
            const cur = queue[head];
            for (let d = 0; d < 4; d++) {
              const mv = DIRS4[d];
              const res = stepState(staticMap, cur.dyn, cur.lit, mv.dr, mv.dc, mv.dir);
              if (!res) continue;
              const k = encodeState(res.dyn);
              if (visited.has(k)) continue;
              visited.add(k);
              const idx = queue.length;
              queue.push({ dyn: res.dyn, lit: res.lit, parent: head, mvIdx: d });
              if (isWon(staticMap, res.dyn, res.lit)) {
                const path = [];
                let p = idx;
                while (p > 0) { path.push(DIRS4[queue[p].mvIdx]); p = queue[p].parent; }
                path.reverse();
                return { solved: true, path };
              }
            }
            head++;
          }
          return { solved: false, timedOut: visited.size >= maxStates };
        }

        function getOptimalSteps(levelObj) {
          if (typeof levelObj.optimalSteps === "number" && levelObj.optimalSteps > 0) return levelObj.optimalSteps;
          const key = levelObj.map.join("|");
          if (optimalCache.has(key)) return optimalCache.get(key);
          const { staticMap, dynState } = parseMap(levelObj.map);
          const res = solveFromState(staticMap, dynState, 60000, 500);
          const steps = res.solved ? res.path.length : null;
          optimalCache.set(key, steps);
          return steps;
        }

        function checkDeadlock(staticMap, dyn, maxMs = 6) {
          const res = solveFromState(staticMap, dyn, 7000, maxMs);
          return !res.solved && !res.timedOut;
        }

        function findNextBestMove(staticMap, dyn) {
          const res = solveFromState(staticMap, dyn, 35000, 260);
          return (res.solved && res.path.length > 0) ? res.path[0] : null;
        }

        function evaluateStars(steps, opt) {
          if (!opt) return { gold: 3, platinum: false };
          const platinum = steps <= opt;
          let gold = 1;
          if (steps <= Math.ceil(opt * 1.25) + 1) gold = 3;
          else if (steps <= Math.ceil(opt * 1.65) + 3) gold = 2;
          return { gold, platinum };
        }

        return {
          SPOT_DIRS, TARGET_BOXES, DIRS4,
          parseMap, cloneDyn, isEntitySuppressed, isEntitySolid, isTerrainSuppressed,
          solidEntityAt, computeLighting, stepState, isWon,
          solveFromState, getOptimalSteps, checkDeadlock, findNextBestMove, evaluateStars
        };
      })();

      /* =====================================================================
         4. MODULE 2: TouchInputController（微信小游戏同构触控控制器）
         ===================================================================== */
      const TouchInputController = (function () {
        function create(opts) {
          const SWIPE = opts.swipeThreshold || 28;
          const state = {
            active: false, pointerId: null,
            downX: 0, downY: 0, anchorX: 0, anchorY: 0, curX: 0, curY: 0,
            didSwipe: false
          };

          function onStart(x, y, id = 0) {
            if (opts.canAccept && !opts.canAccept()) return;
            state.active = true; state.pointerId = id;
            state.downX = x; state.downY = y;
            state.anchorX = x; state.anchorY = y;
            state.curX = x; state.curY = y;
            state.didSwipe = false;
          }

          function onMove(x, y, id = 0) {
            if (!state.active || (id !== null && state.pointerId !== id)) return;
            state.curX = x; state.curY = y;
            const dx = x - state.anchorX, dy = y - state.anchorY;
            if (Math.abs(dx) < SWIPE && Math.abs(dy) < SWIPE) return;
            state.didSwipe = true;
            if (Math.abs(dx) > Math.abs(dy)) {
              const dc = dx > 0 ? 1 : -1;
              opts.onDirection && opts.onDirection(0, dc, dc > 0 ? "right" : "left");
            } else {
              const dr = dy > 0 ? 1 : -1;
              opts.onDirection && opts.onDirection(dr, 0, dr > 0 ? "down" : "up");
            }
            state.anchorX = x; state.anchorY = y;
          }

          function onEnd(x, y, id = 0) {
            if (!state.active || (id !== null && state.pointerId !== id)) return;
            const totalDist = Math.hypot(x - state.downX, y - state.downY);
            const wasTap = !state.didSwipe && totalDist < 14;
            state.active = false; state.pointerId = null;
            if (wasTap && opts.onTap) opts.onTap(x, y);
          }

          function cancel() { state.active = false; state.pointerId = null; }
          return { state, onStart, onMove, onEnd, cancel };
        }
        return { create };
      })();

      /* =====================================================================
         5. MODULE 3: Assets2D（2D 建筑光影 + 方案 1 重叠视觉 + 因果拖尾）
         ===================================================================== */
      const Assets2D = (function () {
        const CFG = Object.assign({ wallSeam: 0.36, shadowLen: 0.17, beamGlow: 0.30, boxScale: 0.72 }, THEMES[0]);

        function applyTheme(themeId) {
          const th = THEMES.find(t => t.id === themeId) || THEMES[0];
          Object.assign(CFG, th);
          document.body.style.background = th.pageBg;
          document.body.classList.toggle("theme-night", Boolean(th.isDark));
        }

        function roundRect(ctx, x, y, w, h, r) {
          const rr = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + rr, y);
          ctx.arcTo(x + w, y, x + w, y + h, rr);
          ctx.arcTo(x + w, y + h, x, y + h, rr);
          ctx.arcTo(x, y + h, x, y, rr);
          ctx.arcTo(x, y, x + w, y, rr);
          ctx.closePath();
        }

        function lerpHex(hexA, hexB, t) {
          const r1 = (hexA >> 16) & 255, g1 = (hexA >> 8) & 255, b1 = hexA & 255;
          const r2 = (hexB >> 16) & 255, g2 = (hexB >> 8) & 255, b2 = hexB & 255;
          return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
        }

        function castShadowRect(ctx, x, y, w, h, r, len, alpha = 0.15) {
          if (len <= 0.5) return;
          ctx.save();
          ctx.fillStyle = `rgba(${CFG.shadowRgb}, ${alpha})`;
          for (let i = 1; i <= 4; i++) {
            const f = i / 4;
            ctx.globalAlpha = (1 - f * 0.55) * 0.42;
            roundRect(ctx, x + len * f, y + len * f, w, h, r);
            ctx.fill();
          }
          ctx.restore();
        }

        function castShadowCircle(ctx, cx, cy, rad, len, alpha = 0.16) {
          if (len <= 0.5) return;
          ctx.save();
          ctx.fillStyle = `rgba(${CFG.shadowRgb}, ${alpha})`;
          for (let i = 1; i <= 4; i++) {
            const f = i / 4;
            ctx.globalAlpha = (1 - f * 0.55) * 0.45;
            ctx.beginPath();
            ctx.arc(cx + len * f, cy + len * f, rad, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        function drawIslandBase(ctx, bx, by, bw, bh, ts) {
          const pad = Math.round(ts * 0.12), thick = Math.round(ts * 0.22), r = Math.round(ts * 0.16);
          ctx.save();
          ctx.shadowColor = CFG.islandShadow;
          ctx.shadowBlur = 28; ctx.shadowOffsetX = 10; ctx.shadowOffsetY = 18;
          roundRect(ctx, bx - pad, by - pad + thick, bw + pad * 2, bh + pad * 2, r);
          ctx.fillStyle = CFG.islandSide; ctx.fill();
          ctx.restore();

          roundRect(ctx, bx - pad, by - pad + thick * 0.55, bw + pad * 2, bh + pad * 2, r);
          ctx.fillStyle = CFG.islandMid; ctx.fill();

          roundRect(ctx, bx - pad, by - pad, bw + pad * 2, bh + pad * 2, r);
          ctx.fillStyle = CFG.islandTop; ctx.fill();
          ctx.strokeStyle = CFG.isDark ? "rgba(140, 165, 210, 0.2)" : "rgba(255, 255, 255, 0.72)";
          ctx.lineWidth = 1.4; ctx.stroke();
        }

        function drawLockGoldSeam(ctx, ox, oy, size, r, elapsed) {
          const pulse = 0.5 + 0.5 * Math.sin((elapsed || 0) * 2.6);
          ctx.save();
          ctx.shadowColor = "rgba(240, 178, 54, 0.82)";
          ctx.shadowBlur = 9;
          roundRect(ctx, ox - 0.8, oy - 0.8, size + 1.6, size + 1.6, r + 0.5);
          ctx.strokeStyle = `rgba(244, 186, 68, ${0.78 + pulse * 0.18})`;
          ctx.lineWidth = 2.3; ctx.stroke();
          ctx.shadowBlur = 0;
          roundRect(ctx, ox + 1.2, oy + 1.2, size - 2.4, size - 2.4, Math.max(2, r - 1));
          ctx.strokeStyle = "rgba(255, 248, 214, 0.65)"; ctx.lineWidth = 1; ctx.stroke();
          ctx.restore();
        }

        function drawWall(ctx, x, y, ts, r, c, walls, rows, cols) {
          ctx.fillStyle = (r + c) % 2 === 0 ? CFG.wallBase : CFG.wallAlt;
          ctx.fillRect(x - 0.4, y - 0.4, ts + 0.8, ts + 0.8);
          const topExp = r === 0 || !walls[r - 1][c];
          const leftExp = c === 0 || !walls[r][c - 1];
          const botExp = r === rows - 1 || !walls[r + 1][c];
          const rightExp = c === cols - 1 || !walls[r][c + 1];

          ctx.save();
          ctx.strokeStyle = CFG.seamColor;
          ctx.globalAlpha = CFG.wallSeam * 0.45;
          ctx.lineWidth = 1;
          if (!topExp) { ctx.beginPath(); ctx.moveTo(x + 2, y + 0.5); ctx.lineTo(x + ts - 2, y + 0.5); ctx.stroke(); }
          if (!leftExp) { ctx.beginPath(); ctx.moveTo(x + 0.5, y + 2); ctx.lineTo(x + 0.5, y + ts - 2); ctx.stroke(); }
          ctx.restore();

          const trim = Math.max(2, ts * 0.055);
          if (topExp) { ctx.fillStyle = CFG.wallHi; ctx.fillRect(x, y, ts, trim); }
          if (leftExp) { ctx.fillStyle = CFG.wallHi; ctx.globalAlpha = 0.72; ctx.fillRect(x, y, trim, ts); ctx.globalAlpha = 1; }
          if (botExp) { ctx.fillStyle = CFG.wallLow; ctx.fillRect(x, y + ts - trim * 1.3, ts, trim * 1.3); }
          if (rightExp) { ctx.fillStyle = CFG.wallRight; ctx.fillRect(x + ts - trim, y, trim, ts); }
        }

        function drawGoal(ctx, x, y, ts, lock, elapsed) {
          const cx = x + ts / 2, cy = y + ts / 2, slotSize = ts * CFG.boxScale;
          const ox = cx - slotSize / 2, oy = cy - slotSize / 2, r = ts * 0.13;
          const breathe = 0.5 + 0.5 * Math.sin(elapsed * 2.1);

          ctx.save();
          roundRect(ctx, ox + 0.8, oy + 0.8, slotSize, slotSize, r);
          ctx.strokeStyle = CFG.isDark ? "rgba(180, 200, 240, 0.14)" : "rgba(255, 253, 249, 0.82)";
          ctx.lineWidth = 1.4; ctx.stroke();

          const basinG = ctx.createLinearGradient(ox, oy, ox + slotSize, oy + slotSize);
          if (CFG.isDark) {
            basinG.addColorStop(0, "rgba(8, 12, 20, 0.72)"); basinG.addColorStop(1, "rgba(26, 34, 52, 0.45)");
          } else {
            basinG.addColorStop(0, "rgba(136, 130, 120, 0.44)");
            basinG.addColorStop(0.55, "rgba(176, 170, 160, 0.28)");
            basinG.addColorStop(1, "rgba(228, 223, 214, 0.40)");
          }
          roundRect(ctx, ox, oy, slotSize, slotSize, r);
          ctx.fillStyle = basinG; ctx.fill();

          ctx.save();
          roundRect(ctx, ox, oy, slotSize, slotSize, r);
          ctx.clip();
          const shDepth = Math.max(5, slotSize * 0.24);
          const topSh = ctx.createLinearGradient(ox, oy, ox, oy + shDepth);
          topSh.addColorStop(0, "rgba(42, 48, 62, 0.34)"); topSh.addColorStop(1, "rgba(42, 48, 62, 0)");
          ctx.fillStyle = topSh; ctx.fillRect(ox, oy, slotSize, shDepth);
          const leftSh = ctx.createLinearGradient(ox, oy, ox + shDepth, oy);
          leftSh.addColorStop(0, "rgba(42, 48, 62, 0.28)"); leftSh.addColorStop(1, "rgba(42, 48, 62, 0)");
          ctx.fillStyle = leftSh; ctx.fillRect(ox, oy, shDepth, slotSize);
          ctx.restore();

          if (lock < 0.9) {
            ctx.beginPath();
            ctx.arc(cx, cy, slotSize * (0.21 + breathe * 0.015), 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(182, 142, 68, ${(1 - lock) * (0.42 + breathe * 0.22)})`;
            ctx.lineWidth = 1.5; ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy, Math.max(2, slotSize * 0.05), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(182, 142, 68, ${(1 - lock) * (0.56 + breathe * 0.24)})`;
            ctx.fill();
          }
          ctx.restore();
        }

        function drawWaterPuddle(ctx, x, y, ts, isBox, elapsed, seed, ratio = 1) {
          if (ratio <= 0.03) return;
          const cx = x + ts / 2, cy = y + ts / 2;
          const maxR = ts * (isBox ? 0.35 : 0.43) * (0.35 + 0.65 * ratio);
          ctx.save();
          ctx.globalAlpha = ratio;
          const g = ctx.createRadialGradient(cx - maxR * 0.2, cy - maxR * 0.2, 2, cx, cy, maxR);
          g.addColorStop(0, "rgba(186, 234, 255, 0.85)");
          g.addColorStop(0.65, "rgba(122, 200, 236, 0.65)");
          g.addColorStop(1, "rgba(92, 174, 214, 0.38)");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(cx, cy, maxR, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "rgba(255, 255, 255, 0.6)"; ctx.lineWidth = 1.1; ctx.stroke();

          const rip = (elapsed * 0.5 + seed * 0.37) % 1;
          ctx.strokeStyle = `rgba(255, 255, 255, ${(1 - rip) * 0.72})`;
          ctx.lineWidth = 1.3;
          ctx.beginPath(); ctx.arc(cx, cy, maxR * (0.18 + rip * 0.72), 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }

        function drawIceWall(ctx, x, y, ts, solidRatio = 1) {
          if (solidRatio <= 0.03) return;
          const size = ts * 0.84 * (0.35 + 0.65 * solidRatio);
          const ox = x + (ts - size) / 2, oy = y + (ts - size) / 2;
          const cx = ox + size / 2, cy = oy + size / 2;
          castShadowRect(ctx, ox, oy, size, size, 2, ts * CFG.shadowLen * 0.85 * solidRatio, 0.16);
          ctx.save();
          ctx.globalAlpha = 0.94 * solidRatio;
          const tri = (x1, y1, x2, y2, fill) => {
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath();
            ctx.fillStyle = fill; ctx.fill();
          };
          const x0 = ox, y0 = oy, x1 = ox + size, y1 = oy + size;
          tri(x0, y0, x1, y0, "#D4F3FF"); tri(x0, y0, x0, y1, "#A6E2FC");
          tri(x1, y0, x1, y1, "#6CC3EE"); tri(x0, y1, x1, y1, "#4CA6D9");

          const crown = size * 0.52, crX = cx - crown / 2, crY = cy - crown / 2;
          const cg = ctx.createLinearGradient(crX, crY, crX + crown, crY + crown);
          cg.addColorStop(0, "rgba(246, 253, 255, 0.78)"); cg.addColorStop(1, "rgba(116, 200, 240, 0.78)");
          ctx.fillStyle = cg; ctx.fillRect(crX, crY, crown, crown);

          ctx.strokeStyle = "rgba(255, 255, 255, 0.72)"; ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(x0, y0); ctx.lineTo(crX, crY); ctx.moveTo(x1, y0); ctx.lineTo(crX + crown, crY);
          ctx.moveTo(x0, y1); ctx.lineTo(crX, crY + crown); ctx.moveTo(x1, y1); ctx.lineTo(crX + crown, crY + crown);
          ctx.stroke();
          ctx.strokeRect(crX + 0.5, crY + 0.5, crown - 1, crown - 1);
          ctx.strokeRect(x0 + 0.5, y0 + 0.5, size - 1, size - 1);
          ctx.restore();
        }

        function drawAmberWall(ctx, x, y, ts, solidRatio = 1) {
          const baseSize = ts * 0.84, baseOx = x + (ts - baseSize) / 2, baseOy = y + (ts - baseSize) / 2;
          if (solidRatio < 0.97) {
            ctx.save();
            ctx.globalAlpha = 1 - solidRatio;
            ctx.fillStyle = "rgba(218, 166, 66, 0.08)";
            ctx.fillRect(baseOx + 2, baseOy + 2, baseSize - 4, baseSize - 4);
            ctx.strokeStyle = "rgba(202, 148, 52, 0.45)";
            ctx.lineWidth = 1.3; ctx.setLineDash([4, 4]);
            ctx.strokeRect(baseOx + 2, baseOy + 2, baseSize - 4, baseSize - 4);
            ctx.setLineDash([]);
            ctx.restore();
          }
          if (solidRatio <= 0.03) return;
          const size = baseSize * (0.35 + 0.65 * solidRatio);
          const ox = x + (ts - size) / 2, oy = y + (ts - size) / 2;
          const cx = ox + size / 2, cy = oy + size / 2;
          castShadowRect(ctx, ox, oy, size, size, 2, ts * CFG.shadowLen * 0.85 * solidRatio, 0.16);
          ctx.save();
          ctx.globalAlpha = 0.95 * solidRatio;
          const tri = (x1, y1, x2, y2, fill) => {
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath();
            ctx.fillStyle = fill; ctx.fill();
          };
          const x0 = ox, y0 = oy, x1 = ox + size, y1 = oy + size;
          tri(x0, y0, x1, y0, "#FFF0B5"); tri(x0, y0, x0, y1, "#F7C95E");
          tri(x1, y0, x1, y1, "#DB982A"); tri(x0, y1, x1, y1, "#B87418");

          const crown = size * 0.52, crX = cx - crown / 2, crY = cy - crown / 2;
          const cg = ctx.createLinearGradient(crX, crY, crX + crown, crY + crown);
          cg.addColorStop(0, "rgba(255, 252, 236, 0.86)"); cg.addColorStop(1, "rgba(218, 152, 42, 0.84)");
          ctx.fillStyle = cg; ctx.fillRect(crX, crY, crown, crown);

          ctx.strokeStyle = "rgba(255, 250, 224, 0.78)"; ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(x0, y0); ctx.lineTo(crX, crY); ctx.moveTo(x1, y0); ctx.lineTo(crX + crown, crY);
          ctx.moveTo(x0, y1); ctx.lineTo(crX, crY + crown); ctx.moveTo(x1, y1); ctx.lineTo(crX + crown, crY + crown);
          ctx.stroke();
          ctx.strokeRect(crX + 0.5, crY + 0.5, crown - 1, crown - 1);
          ctx.strokeRect(x0 + 0.5, y0 + 0.5, size - 1, size - 1);
          ctx.restore();
        }

        function drawWoodBox(ctx, x, y, ts, onGoal, elapsed, scaleMult = 1) {
          const size = ts * CFG.boxScale * scaleMult, ox = x + (ts - size) / 2, oy = y + (ts - size) / 2, r = ts * 0.13 * scaleMult;
          if (!onGoal) castShadowRect(ctx, ox, oy, size, size, r, ts * CFG.shadowLen * 0.7, 0.17);
          ctx.save();
          const g = ctx.createLinearGradient(ox, oy, ox + size, oy + size);
          g.addColorStop(0, "#E3B686"); g.addColorStop(0.55, "#CF9A64"); g.addColorStop(1, "#B67E4A");
          roundRect(ctx, ox, oy, size, size, r);
          ctx.fillStyle = g; ctx.fill();

          ctx.save();
          roundRect(ctx, ox, oy, size, size, r);
          ctx.clip();
          const hiG = ctx.createLinearGradient(ox, oy, ox, oy + size * 0.36);
          hiG.addColorStop(0, "rgba(255, 250, 242, 0.34)"); hiG.addColorStop(1, "rgba(255, 250, 242, 0)");
          ctx.fillStyle = hiG; ctx.fillRect(ox, oy, size, size * 0.36);
          ctx.strokeStyle = onGoal ? "rgba(255, 232, 152, 0.58)" : "rgba(115, 68, 28, 0.15)";
          ctx.lineWidth = onGoal ? 1.35 : 1;
          ctx.beginPath();
          ctx.moveTo(ox, oy + size * 0.34); ctx.lineTo(ox + size, oy + size * 0.34);
          ctx.moveTo(ox, oy + size * 0.67); ctx.lineTo(ox + size, oy + size * 0.67);
          ctx.stroke();
          ctx.restore();

          roundRect(ctx, ox, oy, size, size, r);
          ctx.strokeStyle = "rgba(255, 244, 230, 0.45)"; ctx.lineWidth = 1.2; ctx.stroke();
          ctx.restore();

          if (onGoal) drawLockGoldSeam(ctx, ox, oy, size, r, elapsed);
        }

        function drawIceBox(ctx, x, y, ts, onGoal, elapsed, solidRatio = 1, scaleMult = 1) {
          if (solidRatio <= 0.03) return;
          const cx = x + ts / 2, cy = y + ts / 2, size = ts * CFG.boxScale * (0.3 + 0.7 * solidRatio) * scaleMult;
          const ox = cx - size / 2, oy = cy - size / 2, r = Math.max(3, ts * 0.13 * solidRatio);
          if (!onGoal) castShadowRect(ctx, ox, oy, size, size, r, ts * CFG.shadowLen * 0.7 * solidRatio, 0.16);
          ctx.save();
          ctx.globalAlpha = solidRatio;
          const g = ctx.createLinearGradient(ox, oy, ox + size, oy + size);
          g.addColorStop(0, "#C4EEFF"); g.addColorStop(0.52, "#6AC4F2"); g.addColorStop(1, "#3B9AD4");
          roundRect(ctx, ox, oy, size, size, r);
          ctx.fillStyle = g; ctx.fill();

          ctx.save();
          roundRect(ctx, ox, oy, size, size, r);
          ctx.clip();
          const frostG = ctx.createRadialGradient(cx - size * 0.06, cy - size * 0.06, 1, cx, cy, size * 0.46);
          frostG.addColorStop(0, onGoal ? "rgba(255, 248, 212, 0.76)" : "rgba(255, 255, 255, 0.78)");
          frostG.addColorStop(0.5, onGoal ? "rgba(255, 224, 128, 0.24)" : "rgba(218, 245, 255, 0.30)");
          frostG.addColorStop(1, "rgba(120, 205, 248, 0)");
          ctx.fillStyle = frostG; ctx.fillRect(ox, oy, size, size);
          ctx.restore();

          const flakeR = size * 0.24, branchR = flakeR * 0.56, tick = flakeR * 0.27;
          ctx.save();
          if (onGoal) { ctx.shadowColor = "rgba(230, 152, 24, 0.85)"; ctx.shadowBlur = 6; }
          ctx.strokeStyle = onGoal ? "#FFE58A" : "rgba(255, 255, 255, 0.94)";
          ctx.lineWidth = Math.max(onGoal ? 1.8 : 1.4, ts * (onGoal ? 0.032 : 0.025));
          ctx.lineCap = "round";
          for (let i = 0; i < 6; i++) {
            const a = (Math.PI * i) / 3 - Math.PI / 2, cos = Math.cos(a), sin = Math.sin(a);
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + cos * flakeR, cy + sin * flakeR);
            const bx = cx + cos * branchR, by = cy + sin * branchR;
            ctx.moveTo(bx + Math.cos(a - 0.8) * tick, by + Math.sin(a - 0.8) * tick);
            ctx.lineTo(bx, by);
            ctx.lineTo(bx + Math.cos(a + 0.8) * tick, by + Math.sin(a + 0.8) * tick);
            ctx.stroke();
          }
          ctx.restore();

          roundRect(ctx, ox, oy, size, size, r);
          ctx.strokeStyle = "rgba(240, 252, 255, 0.85)"; ctx.lineWidth = 1.35; ctx.stroke();
          ctx.restore();

          if (onGoal && solidRatio > 0.6) drawLockGoldSeam(ctx, ox, oy, size, r, elapsed);
        }

        function drawAmberBox(ctx, x, y, ts, solidRatio, onGoal, elapsed, scaleMult = 1) {
          const cx = x + ts / 2, cy = y + ts / 2;
          const baseSize = ts * CFG.boxScale, baseOx = cx - baseSize / 2, baseOy = cy - baseSize / 2, baseR = ts * 0.13;
          if (solidRatio < 0.97) {
            ctx.save();
            ctx.globalAlpha = 1 - solidRatio;
            roundRect(ctx, baseOx, baseOy, baseSize, baseSize, baseR);
            ctx.fillStyle = "rgba(218, 166, 66, 0.08)"; ctx.fill();
            ctx.strokeStyle = "rgba(202, 148, 52, 0.45)";
            ctx.lineWidth = 1.3; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(cx, cy, ts * 0.06, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(224, 168, 58, 0.52)"; ctx.fill();
            ctx.restore();
          }
          if (solidRatio <= 0.03) return;
          const size = baseSize * (0.3 + 0.7 * solidRatio) * scaleMult;
          const ox = cx - size / 2, oy = cy - size / 2, r = Math.max(3, baseR * solidRatio);
          if (!onGoal) castShadowRect(ctx, ox, oy, size, size, r, ts * CFG.shadowLen * 0.7 * solidRatio, 0.16);
          ctx.save();
          ctx.globalAlpha = solidRatio;
          const g = ctx.createLinearGradient(ox, oy, ox + size, oy + size);
          g.addColorStop(0, "#FFE99E"); g.addColorStop(0.52, "#F0B542"); g.addColorStop(1, "#CB851E");
          roundRect(ctx, ox, oy, size, size, r);
          ctx.fillStyle = g; ctx.fill();

          ctx.save();
          roundRect(ctx, ox, oy, size, size, r);
          ctx.clip();
          const orbG = ctx.createRadialGradient(cx - size * 0.06, cy - size * 0.06, 1, cx, cy, size * (onGoal ? 0.5 : 0.44));
          orbG.addColorStop(0, onGoal ? "rgba(255, 255, 250, 0.98)" : "rgba(255, 254, 245, 0.92)");
          orbG.addColorStop(0.45, onGoal ? "rgba(255, 246, 198, 0.62)" : "rgba(255, 244, 196, 0.42)");
          orbG.addColorStop(1, "rgba(255, 220, 120, 0)");
          ctx.fillStyle = orbG; ctx.fillRect(ox, oy, size, size);
          ctx.restore();

          roundRect(ctx, ox, oy, size, size, r);
          ctx.strokeStyle = "rgba(255, 250, 224, 0.72)"; ctx.lineWidth = 1.25; ctx.stroke();
          ctx.restore();

          if (onGoal && solidRatio > 0.6) drawLockGoldSeam(ctx, ox, oy, size, r, elapsed);
        }

        function drawSunTower(ctx, x, y, ts, elapsed) {
          const cx = x + ts / 2, cy = y + ts / 2, pulse = 1 + Math.sin(elapsed * 2.5) * 0.04;
          ctx.fillStyle = CFG.wallBase; ctx.fillRect(x, y, ts, ts);
          ctx.strokeStyle = CFG.wallLow; ctx.lineWidth = 1.4; ctx.strokeRect(x + 1, y + 1, ts - 2, ts - 2);

          const glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, ts * 0.65 * pulse);
          glow.addColorStop(0, "rgba(255, 232, 146, 0.88)");
          glow.addColorStop(0.55, "rgba(236, 178, 62, 0.25)");
          glow.addColorStop(1, "rgba(236, 178, 62, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath(); ctx.arc(cx, cy, ts * 0.65 * pulse, 0, Math.PI * 2); ctx.fill();

          ctx.save();
          ctx.translate(cx, cy); ctx.rotate(elapsed * 0.7);
          ctx.strokeStyle = "#DF9F32"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, ts * 0.31, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = "#E8A838";
          for (let i = 0; i < 8; i++) {
            const a = (Math.PI * 2 * i) / 8;
            ctx.beginPath(); ctx.arc(Math.cos(a) * ts * 0.37, Math.sin(a) * ts * 0.37, 2, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();

          const orbGrad = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, ts * 0.21);
          orbGrad.addColorStop(0, "#FFFFFF"); orbGrad.addColorStop(0.65, "#FFF2BA"); orbGrad.addColorStop(1, "#E8A838");
          ctx.fillStyle = orbGrad;
          ctx.beginPath(); ctx.arc(cx, cy, ts * 0.21 * pulse, 0, Math.PI * 2); ctx.fill();
        }

        function drawLantern(ctx, x, y, ts, elapsed) {
          const cx = x + ts / 2, cy = y + ts / 2, baseR = ts * 0.37, pulse = 1 + Math.sin(elapsed * 3) * 0.05;
          castShadowCircle(ctx, cx, cy, baseR, ts * CFG.shadowLen * 0.7, 0.16);
          const halo = ctx.createRadialGradient(cx, cy, 2, cx, cy, ts * 0.62 * pulse);
          halo.addColorStop(0, "rgba(255, 232, 140, 0.72)"); halo.addColorStop(1, "rgba(255, 210, 96, 0)");
          ctx.fillStyle = halo;
          ctx.beginPath(); ctx.arc(cx, cy, ts * 0.62 * pulse, 0, Math.PI * 2); ctx.fill();

          const stoneG = ctx.createLinearGradient(cx - baseR, cy - baseR, cx + baseR, cy + baseR);
          stoneG.addColorStop(0, "#FCFBF8"); stoneG.addColorStop(0.6, "#EAE4DA"); stoneG.addColorStop(1, "#D5CEC0");
          ctx.beginPath(); ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
          ctx.fillStyle = stoneG; ctx.fill();
          ctx.strokeStyle = "rgba(176, 168, 154, 0.7)"; ctx.lineWidth = 1.2; ctx.stroke();

          ctx.beginPath(); ctx.arc(cx, cy, baseR * 0.76, 0, Math.PI * 2);
          ctx.strokeStyle = "#DDA23C"; ctx.lineWidth = 1.8; ctx.stroke();

          const coreGrad = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, baseR * 0.5);
          coreGrad.addColorStop(0, "#FFFFFF"); coreGrad.addColorStop(0.65, "#FFF2B8"); coreGrad.addColorStop(1, "#E8A838");
          ctx.fillStyle = coreGrad;
          ctx.beginPath(); ctx.arc(cx, cy, baseR * 0.5 * pulse, 0, Math.PI * 2); ctx.fill();
        }

        function drawSpotlight(ctx, x, y, ts, kind, elapsed) {
          const cx = x + ts / 2, cy = y + ts / 2, baseR = ts * 0.37;
          const ang = { ">": 0, "v": Math.PI / 2, "<": Math.PI, "^": -Math.PI / 2 }[kind] || 0;
          const pulse = 1 + Math.sin((elapsed || 0) * 2.6) * 0.04;
          castShadowCircle(ctx, cx, cy, baseR, ts * CFG.shadowLen * 0.7, 0.17);

          ctx.save();
          ctx.translate(cx, cy); ctx.rotate(ang);
          const cone = ctx.createRadialGradient(baseR * 0.35, 0, 2, baseR * 0.75, 0, ts * 0.48 * pulse);
          cone.addColorStop(0, "rgba(255, 232, 138, 0.78)");
          cone.addColorStop(0.6, "rgba(255, 214, 102, 0.22)");
          cone.addColorStop(1, "rgba(255, 214, 102, 0)");
          ctx.fillStyle = cone;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, ts * 0.48 * pulse, -0.52, 0.52); ctx.closePath(); ctx.fill();

          const shellG = ctx.createLinearGradient(-baseR, -baseR, baseR * 0.4, baseR);
          shellG.addColorStop(0, "#FCFBF8"); shellG.addColorStop(0.55, "#EAE4DA"); shellG.addColorStop(1, "#CFC7B8");
          ctx.beginPath(); ctx.arc(0, 0, baseR, 0, Math.PI * 2);
          ctx.fillStyle = shellG; ctx.fill();
          ctx.strokeStyle = "rgba(176, 168, 154, 0.72)"; ctx.lineWidth = 1.2; ctx.stroke();

          ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, baseR * 0.94, -0.56, 0.56); ctx.closePath();
          const cavityG = ctx.createLinearGradient(0, -baseR * 0.45, baseR, baseR * 0.45);
          cavityG.addColorStop(0, "#FFF7D4"); cavityG.addColorStop(0.55, "#F2C052"); cavityG.addColorStop(1, "#DC9A2D");
          ctx.fillStyle = cavityG; ctx.fill();

          ctx.beginPath(); ctx.arc(0, 0, baseR * 0.75, 0.82, Math.PI * 2 - 0.82);
          ctx.strokeStyle = "rgba(214, 162, 68, 0.78)"; ctx.lineWidth = 1.8; ctx.lineCap = "round"; ctx.stroke();

          const orbX = baseR * 0.24, orbR = baseR * 0.36 * pulse;
          const orbG = ctx.createRadialGradient(orbX - 1.5, -1.5, 1, orbX, 0, orbR);
          orbG.addColorStop(0, "#FFFFFF"); orbG.addColorStop(0.62, "#FFF2B5"); orbG.addColorStop(1, "#E5A032");
          ctx.beginPath(); ctx.arc(orbX, 0, orbR, 0, Math.PI * 2); ctx.fillStyle = orbG; ctx.fill();
          ctx.restore();
        }

        function drawMirror(ctx, x, y, ts, kind, isHit) {
          const cx = x + ts / 2, cy = y + ts / 2, baseR = ts * 0.37;
          castShadowCircle(ctx, cx, cy, baseR, ts * CFG.shadowLen * 0.7, 0.16);
          const stoneG = ctx.createLinearGradient(cx - baseR, cy - baseR, cx + baseR, cy + baseR);
          stoneG.addColorStop(0, "#FCFBF8"); stoneG.addColorStop(0.6, "#EAE4DA"); stoneG.addColorStop(1, "#D5CEC0");
          ctx.beginPath(); ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
          ctx.fillStyle = stoneG; ctx.fill();
          ctx.strokeStyle = isHit ? "#E8A838" : "rgba(176, 168, 154, 0.7)";
          ctx.lineWidth = isHit ? 2 : 1.2; ctx.stroke();

          const len = baseR * 0.68;
          const x1 = kind === "\\" ? cx - len : cx + len, y1 = cy - len;
          const x2 = kind === "\\" ? cx + len : cx - len, y2 = cy + len;
          ctx.save();
          ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          ctx.strokeStyle = "#DDA23C"; ctx.lineWidth = Math.max(6.5, ts * 0.13); ctx.stroke();
          if (isHit) { ctx.shadowColor = "rgba(185, 242, 255, 0.95)"; ctx.shadowBlur = 10; }
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          ctx.strokeStyle = isHit ? "#FFFFFF" : "#A6E2FC"; ctx.lineWidth = Math.max(3.2, ts * 0.065); ctx.stroke();
          ctx.restore();
        }

        function drawBeams(ctx, bx, by, ts, beams) {
          if (!beams || !beams.length) return;
          ctx.save();
          if (CFG.isDark) ctx.globalCompositeOperation = "lighter";
          ctx.lineCap = "round";
          ctx.strokeStyle = `rgba(${CFG.beamOuterRgb}, ${CFG.isDark ? 0.38 : CFG.beamGlow})`;
          ctx.lineWidth = ts * (CFG.isDark ? 0.36 : 0.3);
          beams.forEach(b => {
            ctx.beginPath();
            ctx.moveTo(bx + (b.c1 + 0.5) * ts, by + (b.r1 + 0.5) * ts);
            ctx.lineTo(bx + (b.c2 + 0.5) * ts, by + (b.r2 + 0.5) * ts);
            ctx.stroke();
          });
          ctx.strokeStyle = `rgba(${CFG.beamCoreRgb}, ${CFG.isDark ? 0.85 : 0.72})`;
          ctx.lineWidth = ts * 0.075;
          beams.forEach(b => {
            ctx.beginPath();
            ctx.moveTo(bx + (b.c1 + 0.5) * ts, by + (b.r1 + 0.5) * ts);
            ctx.lineTo(bx + (b.c2 + 0.5) * ts, by + (b.r2 + 0.5) * ts);
            ctx.stroke();
          });
          ctx.restore();
        }

        function drawOcclusionShadows(ctx, bx, by, ts, blockers) {
          if (!blockers || !blockers.length) return;
          ctx.save();
          blockers.forEach(b => {
            const cx = bx + (b.c + 0.5) * ts, cy = by + (b.r + 0.5) * ts;
            const len = ts * 0.82;
            const width = ts * (b.kind === "V" ? 0.74 : b.kind === "P" ? 0.52 : 0.64);
            const g = ctx.createLinearGradient(cx, cy, cx + b.dc * len, cy + b.dr * len);
            g.addColorStop(0, `rgba(${CFG.shadowRgb}, ${CFG.isDark ? 0.38 : 0.22})`);
            g.addColorStop(1, `rgba(${CFG.shadowRgb}, 0)`);
            ctx.fillStyle = g;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(Math.atan2(b.dr, b.dc));
            ctx.fillRect(0, -width / 2, len, width);
            ctx.restore();
          });
          ctx.restore();
        }

        function drawLitRims(ctx, bx, by, ts, blockers) {
          if (!blockers || !blockers.length) return;
          ctx.save();
          ctx.strokeStyle = "rgba(255, 240, 178, 0.88)";
          ctx.lineWidth = Math.max(2, ts * 0.042);
          ctx.lineCap = "round";
          ctx.shadowColor = "rgba(255, 212, 102, 0.75)";
          ctx.shadowBlur = 7;
          blockers.forEach(b => {
            const cx = bx + (b.c + 0.5) * ts, cy = by + (b.r + 0.5) * ts;
            const ang = Math.atan2(-b.dr, -b.dc);
            if (b.kind === "P" || b.kind === "L" || GameEngine.SPOT_DIRS[b.kind]) {
              const rad = ts * (b.kind === "P" ? 0.29 : 0.38);
              ctx.beginPath(); ctx.arc(cx, cy, rad, ang - 0.85, ang + 0.85); ctx.stroke();
            } else {
              const half = ts * (b.kind === "V" ? 0.41 : CFG.boxScale * 0.5);
              const ex = cx - b.dc * half, ey = cy - b.dr * half;
              const span = half * 0.74;
              ctx.beginPath();
              if (b.dc !== 0) { ctx.moveTo(ex, ey - span); ctx.lineTo(ex, ey + span); }
              else { ctx.moveTo(ex - span, ey); ctx.lineTo(ex + span, ey); }
              ctx.stroke();
            }
          });
          ctx.restore();
        }

        function drawHero(ctx, x, y, ts, dir, hop, heroId = "traveler", bumpDx = 0, bumpDy = 0, elapsed = 0, pushSquash = 0, pushDr = 0, pushDc = 0) {
          const cx = x + ts / 2 + bumpDx, cy = y + ts / 2 + bumpDy;
          const breathe = 1 + Math.sin(elapsed * 2.25) * 0.022;
          const hopScale = 1 + Math.sin(hop * Math.PI) * 0.13;
          const hopLift = Math.sin(hop * Math.PI) * ts * 0.095;
          const sq = Math.sin(pushSquash * Math.PI) * 0.13;
          const sx = (pushDc !== 0 ? 1 - sq : 1 + sq * 0.65) * hopScale * breathe;
          const sy = (pushDr !== 0 ? 1 - sq : 1 + sq * 0.65) * hopScale * breathe;
          castShadowCircle(ctx, cx, cy, ts * 0.28, ts * CFG.shadowLen * 0.65 + hopLift * 0.5, 0.18);

          ctx.save();
          ctx.translate(cx, cy - hopLift);
          ctx.scale(sx, sy);

          if (heroId === "bamboo") {
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = "#5B8E74"; ctx.fill();
            const hatG = ctx.createRadialGradient(-2, -2, 1, 0, 0, ts * 0.34);
            hatG.addColorStop(0, "#EFE0B4"); hatG.addColorStop(0.7, "#D4B36A"); hatG.addColorStop(1, "#A8843E");
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.33, 0, Math.PI * 2);
            ctx.fillStyle = hatG; ctx.fill();
            ctx.strokeStyle = "#8C6B2E"; ctx.lineWidth = 1.2; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.08, 0, Math.PI * 2);
            ctx.fillStyle = "#FFF7DF"; ctx.fill();
          } else if (heroId === "snow") {
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.27, 0, Math.PI * 2);
            ctx.fillStyle = "#FFFFFF"; ctx.fill();
            ctx.strokeStyle = "#C8DDF0"; ctx.lineWidth = 1.4; ctx.stroke();
            const earOff = ts * 0.26;
            ctx.fillStyle = "#E8A23C";
            if (dir === "up" || dir === "down") {
              ctx.beginPath(); ctx.arc(-earOff, 0, ts * 0.08, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(earOff, 0, ts * 0.08, 0, Math.PI * 2); ctx.fill();
            } else {
              ctx.beginPath(); ctx.arc(0, -earOff, ts * 0.08, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(0, earOff, ts * 0.08, 0, Math.PI * 2); ctx.fill();
            }
          } else if (heroId === "star") {
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.28, 0, Math.PI * 2);
            ctx.fillStyle = "#2E3A58"; ctx.fill();
            ctx.strokeStyle = "#F0C050"; ctx.lineWidth = 1.6; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.19, 0, Math.PI * 2);
            ctx.fillStyle = "#1E273D"; ctx.fill();
          } else {
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.28, 0, Math.PI * 2);
            ctx.fillStyle = "#FCFBF8"; ctx.fill();
            ctx.strokeStyle = "#DED7CA"; ctx.lineWidth = 1.4; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.21, 0, Math.PI * 2);
            ctx.fillStyle = "#D96552"; ctx.fill();
            const headGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, ts * 0.17);
            headGrad.addColorStop(0, "#FFFFFF"); headGrad.addColorStop(1, "#EDE7DC");
            ctx.fillStyle = headGrad;
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.17, 0, Math.PI * 2); ctx.fill();
          }

          if (heroId !== "bamboo") {
            const gaze = { up: [0, -ts * 0.08], down: [0, ts * 0.08], left: [-ts * 0.08, 0], right: [ts * 0.08, 0] }[dir] || [ts * 0.08, 0];
            const perp = (dir === "up" || dir === "down") ? [[-ts * 0.055, 0], [ts * 0.055, 0]] : [[0, -ts * 0.055], [0, ts * 0.055]];
            ctx.fillStyle = heroId === "star" ? "#FFE48A" : "#262932";
            perp.forEach(([px, py]) => {
              ctx.beginPath(); ctx.arc(gaze[0] + px, gaze[1] + py, Math.max(1.8, ts * 0.032), 0, Math.PI * 2); ctx.fill();
            });
          }
          ctx.restore();
        }

        function drawHoverHalo(ctx, x, y, ts, isCircle, rgb, alpha) {
          ctx.save();
          ctx.strokeStyle = `rgba(${rgb}, ${alpha * 0.65})`;
          ctx.lineWidth = 2;
          if (isCircle) {
            ctx.beginPath(); ctx.arc(x + ts / 2, y + ts / 2, ts * 0.43, 0, Math.PI * 2); ctx.stroke();
          } else {
            const s = ts * CFG.boxScale + 8;
            roundRect(ctx, x + (ts - s) / 2, y + (ts - s) / 2, s, s, ts * 0.16);
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawSuppressFrame(ctx, x, y, ts, kind, elapsed) {
          const p = 4, l = ts * 0.14;
          const pulse = 0.65 + 0.35 * Math.sin(elapsed * 3.8);
          ctx.save();
          ctx.strokeStyle = kind === "C" ? `rgba(75, 168, 216, ${pulse})` : `rgba(217, 150, 38, ${pulse})`;
          ctx.lineWidth = 1.8;
          ctx.lineCap = "round";
          [
            [x + p, y + p, 1, 1], [x + ts - p, y + p, -1, 1],
            [x + p, y + ts - p, 1, -1], [x + ts - p, y + ts - p, -1, -1]
          ].forEach(([cx0, cy0, dx, dy]) => {
            ctx.beginPath();
            ctx.moveTo(cx0 + dx * l, cy0); ctx.lineTo(cx0, cy0); ctx.lineTo(cx0, cy0 + dy * l);
            ctx.stroke();
          });
          ctx.restore();
        }

        function drawGuideArrow(ctx, x, y, ts, dr, dc, elapsed) {
          const shift = Math.sin(elapsed * 4.8) * ts * 0.08;
          const alpha = 0.56 + 0.36 * (0.5 + 0.5 * Math.sin(elapsed * 4.8));
          const ang = Math.atan2(dr, dc), arm = ts * 0.13;
          ctx.save();
          ctx.translate(x + ts * 0.5 + dc * (ts * 0.46 + shift), y + ts * 0.5 + dr * (ts * 0.46 + shift));
          ctx.rotate(ang);
          ctx.strokeStyle = `rgba(229, 164, 53, ${alpha})`;
          ctx.lineWidth = Math.max(2.4, ts * 0.045);
          ctx.lineCap = "round"; ctx.lineJoin = "round";
          ctx.shadowColor = "rgba(229, 164, 53, 0.45)"; ctx.shadowBlur = 6;
          [-arm * 0.65, arm * 0.45].forEach((dx, idx) => {
            ctx.globalAlpha = idx === 0 ? alpha * 0.55 : alpha;
            ctx.beginPath();
            ctx.moveTo(dx - arm * 0.65, -arm * 0.78);
            ctx.lineTo(dx + arm * 0.35, 0);
            ctx.lineTo(dx - arm * 0.65, arm * 0.78);
            ctx.stroke();
          });
          ctx.restore();
        }

        function drawGoalRipple(ctx, x, y, ts, prog, isVictory = false) {
          const base = ts * CFG.boxScale, grow = ts * (isVictory ? 0.42 : 0.24) * prog;
          const size = base + grow * 2, ox = x + (ts - size) / 2, oy = y + (ts - size) / 2;
          const r = ts * 0.13 + grow * 0.35;
          ctx.save();
          ctx.globalAlpha = (1 - prog) * (isVictory ? 0.85 : 0.72);
          ctx.strokeStyle = isVictory ? "#FFE58A" : "#F2BC49";
          ctx.lineWidth = (isVictory ? 3 : 2.2) * (1 - prog * 0.5);
          ctx.shadowColor = "rgba(244, 186, 68, 0.7)"; ctx.shadowBlur = 10 * (1 - prog);
          roundRect(ctx, ox, oy, size, size, r);
          ctx.stroke();
          ctx.restore();
        }

        function drawWalkTarget(ctx, x, y, ts, elapsed) {
          const cx = x + ts / 2, cy = y + ts / 2, p = (elapsed * 1.4) % 1;
          ctx.save();
          ctx.beginPath(); ctx.arc(cx, cy, ts * (0.14 + p * 0.22), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(229, 164, 53, ${(1 - p) * 0.7})`;
          ctx.lineWidth = 1.8; ctx.stroke();
          ctx.restore();
        }

        function drawTouchFeedback(ctx, fb) {
          if (!fb || !fb.active) return;
          const totalDrag = Math.hypot(fb.curX - fb.downX, fb.curY - fb.downY);
          if (!fb.didSwipe && totalDrag < 10) return;
          const dx = fb.curX - fb.anchorX, dy = fb.curY - fb.anchorY;
          const dist = Math.hypot(dx, dy), maxR = 26;
          const clampedX = fb.anchorX + (dist > maxR ? (dx / dist) * maxR : dx);
          const clampedY = fb.anchorY + (dist > maxR ? (dy / dist) * maxR : dy);
          ctx.save();
          ctx.beginPath(); ctx.arc(fb.anchorX, fb.anchorY, 24, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(229, 164, 53, 0.42)"; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = "rgba(255, 243, 212, 0.22)"; ctx.fill();
          ctx.beginPath(); ctx.arc(clampedX, clampedY, 8, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(229, 164, 53, 0.78)"; ctx.fill();
          ctx.restore();
        }

        function drawSquareMat(ctx, x, y, ts, kind, ratio = 0.85, solidBorder = false) {
          const size = ts * ratio, ox = x + (ts - size) / 2, oy = y + (ts - size) / 2, r = ts * 0.15;
          ctx.save();
          roundRect(ctx, ox, oy, size, size, r);
          if (kind === "C") {
            ctx.fillStyle = "rgba(110, 194, 236, 0.34)"; ctx.fill();
            ctx.strokeStyle = solidBorder ? "#4BA8D8" : "rgba(104, 186, 228, 0.65)";
            ctx.lineWidth = solidBorder ? 1.8 : 1.3; ctx.stroke();
          } else {
            ctx.fillStyle = "rgba(232, 174, 58, 0.26)"; ctx.fill();
            ctx.strokeStyle = solidBorder ? "#D99626" : "rgba(212, 154, 48, 0.65)";
            ctx.lineWidth = solidBorder ? 1.8 : 1.3; ctx.stroke();
          }
          ctx.restore();
        }

        function drawCFJadeCore(ctx, x, y, ts, innerKind) {
          const cx = x + ts / 2, cy = y + ts / 2, inner = ts * 0.36, r = ts * 0.08;
          ctx.save();
          const g = ctx.createLinearGradient(cx - inner / 2, cy - inner / 2, cx + inner / 2, cy + inner / 2);
          if (innerKind === "F") { g.addColorStop(0, "#FFF0B3"); g.addColorStop(1, "#DC9522"); }
          else { g.addColorStop(0, "#D8F5FF"); g.addColorStop(1, "#4BA8DA"); }
          roundRect(ctx, cx - inner / 2, cy - inner / 2, inner, inner, r);
          ctx.fillStyle = g; ctx.fill();
          ctx.strokeStyle = innerKind === "F" ? "rgba(255, 252, 236, 0.92)" : "rgba(244, 252, 255, 0.94)";
          ctx.lineWidth = 1.3; ctx.stroke();
          ctx.restore();
        }

        function drawSealedCrown(ctx, x, y, ts, innerKind, solidRatio = 1) {
          if (solidRatio <= 0.25) return;
          const size = ts * 0.84 * (0.35 + 0.65 * solidRatio), crown = size * 0.52;
          const cx = x + ts / 2, cy = y + ts / 2, pad = 2;
          if (crown <= pad * 2 + 2) return;
          ctx.save();
          ctx.globalAlpha = Math.min(1, solidRatio);
          ctx.fillStyle = innerKind === "F" ? "rgba(244, 186, 68, 0.80)" : "rgba(104, 194, 238, 0.84)";
          ctx.fillRect(cx - crown / 2 + pad, cy - crown / 2 + pad, crown - pad * 2, crown - pad * 2);
          ctx.restore();
        }

        return {
          CFG, applyTheme, lerpHex, castShadowRect,
          drawIslandBase, drawWall, drawGoal, drawWaterPuddle, drawIceWall, drawAmberWall,
          drawWoodBox, drawIceBox, drawAmberBox, drawSunTower, drawLantern, drawSpotlight, drawMirror,
          drawBeams, drawOcclusionShadows, drawLitRims, drawHero,
          drawHoverHalo, drawSuppressFrame, drawGuideArrow, drawGoalRipple, drawWalkTarget, drawTouchFeedback,
          drawSquareMat, drawCFJadeCore, drawSealedCrown
        };
      })();

      /* =====================================================================
         6. 本地存档（含自定义关卡持久化）
         ===================================================================== */
      const STORAGE_KEY = "light_sokoban_v3_progress";
      const progress = {
        records: {},
        hintsLeft: 3,
        lastIdx: 0,
        themeId: "morning",
        heroId: "traveler",
        tryAll: false,
        customLevels: []
      };

      function loadProgress() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            if (p && typeof p === "object") {
              Object.assign(progress, p);
              if (Array.isArray(progress.customLevels)) {
                progress.customLevels.forEach(cl => {
                  if (cl && Array.isArray(cl.map) && !LEVELS.some(x => x.id === cl.id)) LEVELS.push(cl);
                });
              }
            }
          }
        } catch (e) {}
      }

      function saveProgress() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
      }

      function getStarTotals() {
        let gold = 0, plat = 0;
        Object.values(progress.records).forEach(r => {
          gold += r.gold || 0;
          if (r.platinum) plat++;
        });
        return { gold, plat };
      }

      /* =====================================================================
         7. 游戏主状态与核心循环
         ===================================================================== */
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const appStage = document.getElementById("appStage");

      const COVER_DEMO_MOVES = [
        [0, 1, "right"], [0, 1, "right"], [0, 1, "right"],
        [0, -1, "left"], [0, -1, "left"], [1, 0, "down"], [1, 0, "down"],
        [0, 1, "right"], [0, 1, "right"], [0, 1, "right"], [0, 1, "right"]
      ];

      const game = {
        inCover: true,
        levelIdx: 0,
        staticMap: null,
        dyn: null,
        light: null,
        history: [],
        steps: 0,
        won: false,
        deadlock: false,
        deadlockTimer: null,
        boardIntro: 1,
        pVis: { vr: 0, vc: 0, hop: 0, bumpDr: 0, bumpDc: 0, bumpT: 0, pushSquash: 0, pushDr: 0, pushDc: 0 },
        eVis: new Map(),
        icePhase: [],
        amberPhase: [],
        floorLitAnim: [],
        goalLockAnim: [],
        goalLockBounce: [],
        particles: [],
        ripples: [],
        clearStarTimers: [],
        hintArrow: null,
        walkQueue: [],
        walkTarget: null,
        walkTimer: 0,
        demoIdx: 0,
        demoTimer: 0,
        viewW: 800,
        viewH: 600,
        ts: 64,
        bx: 0,
        by: 0
      };

      let toastTimer = null;
      function showToast(msg, dur = 2000) {
        clearTimeout(toastTimer);
        const el = document.getElementById("hintToast");
        el.textContent = msg;
        el.classList.add("show");
        toastTimer = setTimeout(() => el.classList.remove("show"), dur);
      }

      function clearStarRevealTimers() {
        game.clearStarTimers.forEach(t => clearTimeout(t));
        game.clearStarTimers = [];
      }

      function cancelAutoWalk() {
        game.walkQueue = [];
        game.walkTarget = null;
        game.walkTimer = 0;
      }

      function spawnPhaseParticles(r, c, color) {
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI * 2 * i) / 6 + Math.random() * 0.5;
          const spd = 0.0014 + Math.random() * 0.0018;
          game.particles.push({
            r: r + 0.5, c: c + 0.5,
            vr: Math.sin(a) * spd, vc: Math.cos(a) * spd,
            color, size: 2.6 + Math.random() * 2, life: 420, maxLife: 420
          });
        }
      }

      function resizeCanvas() {
        const rect = appStage.getBoundingClientRect();
        const w = Math.max(260, rect.width), h = Math.max(320, rect.height);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        game.viewW = w; game.viewH = h;
        canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (!game.staticMap) return;
        const dpadOpen = document.getElementById("dpadBox").classList.contains("open");
        const padX = Math.max(22, w * 0.06);
        const padTop = game.inCover ? 148 : 74;
        const padBot = game.inCover ? 156 : (dpadOpen ? 172 : 90);
        const availW = Math.max(180, w - padX * 2);
        const availH = Math.max(160, h - padTop - padBot);
        const ts = Math.max(30, Math.min(78, Math.floor(Math.min(availW / game.staticMap.cols, availH / game.staticMap.rows))));
        game.ts = ts;
        game.bx = Math.round((w - game.staticMap.cols * ts) / 2);
        game.by = Math.round(padTop + (availH - game.staticMap.rows * ts) / 2);
      }

          audio.undo();
          loadLevel(game.levelIdx);
          return;
        }
        clearTimeout(game.deadlockTimer);
        cancelAutoWalk();
        audio.ensure();
        audio.undo();

        game.history.push({ dyn: GameEngine.cloneDyn(game.dyn), steps: game.steps });
        const parsed = GameEngine.parseMap(LEVELS[game.levelIdx].map);
        game.dyn = parsed.dynState;

        game.pVis = { vr: game.dyn.player.r, vc: game.dyn.player.c, hop: 0, bumpDr: 0, bumpDc: 0, bumpT: 0, pushSquash: 0, pushDr: 0, pushDc: 0 };
        game.eVis.clear();
        game.dyn.entities.forEach(e => game.eVis.set(e.id, {
          vr: e.r, vc: e.c, hover: 0,

      function countLockedGoals() {
        let cnt = 0;
        game.staticMap.goals.forEach(g => {
          const e = GameEngine.solidEntityAt(game.dyn, game.light.lit, g.r, g.c);
          if (e && GameEngine.TARGET_BOXES.has(e.kind)) cnt++;
        });
        return cnt;
      }

      function hasAnySuppression(staticMap, dyn, lit) {
        for (let i = 0; i < staticMap.iceWalls.length; i++) {
          const w = staticMap.iceWalls[i];
          if (!lit[w.r][w.c] && GameEngine.isTerrainSuppressed(dyn, lit, w.r, w.c)) return true;
        }
        for (let i = 0; i < staticMap.treeWalls.length; i++) {
          const w = staticMap.treeWalls[i];
          if (lit[w.r][w.c] && GameEngine.isTerrainSuppressed(dyn, lit, w.r, w.c)) return true;
        }
        for (let i = 0; i < dyn.entities.length; i++) {
          const e = dyn.entities[i];
          if (e.kind === "C" && !lit[e.r][e.c] && GameEngine.isEntitySuppressed(dyn, e)) return true;
          if (e.kind === "F" && lit[e.r][e.c] && GameEngine.isEntitySuppressed(dyn, e)) return true;
        }
        return false;
      }

      function scheduleDeadlockCheck() {
        clearTimeout(game.deadlockTimer);
        game.deadlock = false;
        const snapStatic = game.staticMap;
        const snapDyn = GameEngine.cloneDyn(game.dyn);
        const snapStep = game.steps;
        game.deadlockTimer = setTimeout(() => {
          if (game.inCover || game.won || game.steps !== snapStep) return;
          game.deadlock = GameEngine.checkDeadlock(snapStatic, snapDyn, 6);
          updateHUD();
        }, 85);
      }

      function move(dr, dc, dir, fromAutoWalk = false) {
        if (game.inCover || game.won) return false;
        if (!fromAutoWalk) cancelAutoWalk();
        audio.ensure();
        game.dyn.player.dir = dir;
        game.hintArrow = null;

        if (fromAutoWalk) {
          const nr = game.dyn.player.r + dr, nc = game.dyn.player.c + dc;
          if (GameEngine.solidEntityAt(game.dyn, game.light.lit, nr, nc)) {
            cancelAutoWalk();
            return false;
          }
        }

        const prevLockedFlags = game.staticMap.goals.map(g => {
          const e = GameEngine.solidEntityAt(game.dyn, game.light.lit, g.r, g.c);
          return Boolean(e && GameEngine.TARGET_BOXES.has(e.kind));
        });
        const prevLocked = prevLockedFlags.filter(Boolean).length;
        const hadSup = hasAnySuppression(game.staticMap, game.dyn, game.light.lit);
        const prevIceSolid = game.staticMap.iceWalls.map(w => !game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c));
        const prevAmberSolid = game.staticMap.treeWalls.map(w => game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c));
        const prevBoxPhase = new Map();
        game.dyn.entities.forEach(e => {
          if (e.kind === "C" || e.kind === "F") prevBoxPhase.set(e.id, GameEngine.isEntitySolid(game.dyn, game.light.lit, e));
        });

        const res = GameEngine.stepState(game.staticMap, game.dyn, game.light.lit, dr, dc, dir);
        if (!res) {
          audio.blocked();
          game.pVis.bumpDr = dr; game.pVis.bumpDc = dc; game.pVis.bumpT = 1;
          return false;
        }

        game.history.push({ dyn: GameEngine.cloneDyn(game.dyn), steps: game.steps });
        game.dyn = res.dyn;
        game.light = GameEngine.computeLighting(game.staticMap, game.dyn, true);
        if (res.pushed) {
          game.pVis.pushSquash = 1; game.pVis.pushDr = dr; game.pVis.pushDc = dc;
          audio.push();
        } else {
          game.pVis.hop = 1;
          audio.step();
        }
        game.steps++;

        let melted = false, frozen = false;
        game.staticMap.iceWalls.forEach((w, i) => {
          const nowS = !game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c);
          if (prevIceSolid[i] !== nowS) {
            spawnPhaseParticles(w.r, w.c, nowS ? "#D8F4FF" : "#78CCF2");
            if (prevIceSolid[i] && !nowS) melted = true; else frozen = true;
          }
        });
        game.staticMap.treeWalls.forEach((w, i) => {
          const nowS = game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c);
          if (prevAmberSolid[i] !== nowS) {
            spawnPhaseParticles(w.r, w.c, nowS ? "#FFE28A" : "#E5A435");
            if (nowS) frozen = true; else melted = true;
          }
        });
        game.dyn.entities.forEach(e => {
          if (e.kind !== "C" && e.kind !== "F") return;
          const nowS = GameEngine.isEntitySolid(game.dyn, game.light.lit, e);
          if (prevBoxPhase.has(e.id) && prevBoxPhase.get(e.id) !== nowS) {
            spawnPhaseParticles(e.r, e.c, e.kind === "C" ? "#8ED8F8" : "#F5C45A");
            if (nowS) frozen = true; else melted = true;
          }
        });

        const nowSup = hasAnySuppression(game.staticMap, game.dyn, game.light.lit);
        if (hadSup && !nowSup) audio.suppressPop();
        else if (melted) audio.melt();
        else if (frozen) audio.freeze();

        game.staticMap.goals.forEach((g, idx) => {
          const e = GameEngine.solidEntityAt(game.dyn, game.light.lit, g.r, g.c);
          const nowLocked = Boolean(e && GameEngine.TARGET_BOXES.has(e.kind));
          if (nowLocked && !prevLockedFlags[idx]) {
            game.goalLockBounce[idx] = 1;
            game.ripples.push({ r: g.r, c: g.c, life: 420, maxLife: 420, isVictory: false });
          }
        });

        if (GameEngine.isWon(game.staticMap, game.dyn, game.light.lit)) {
          game.won = true;
          game.deadlock = false;
          cancelAutoWalk();
          clearTimeout(game.deadlockTimer);
          updateHUD();
          onLevelCleared();
          return true;
        }

        const nowLocked = countLockedGoals();
        if (nowLocked > prevLocked) audio.lockNote(nowLocked);

        if (res.pushed) scheduleDeadlockCheck();
        else { clearTimeout(game.deadlockTimer); game.deadlock = false; }
        updateHUD();
        return true;
      }

      function undo() {
        if (game.inCover || !game.history.length || game.won) return false;
        cancelAutoWalk();
        clearTimeout(game.deadlockTimer);
        audio.ensure();
        const prev = game.history.pop();
        game.dyn = prev.dyn;
        game.steps = prev.steps;
        game.light = GameEngine.computeLighting(game.staticMap, game.dyn, true);
        game.deadlock = false;
        game.hintArrow = null;
        audio.undo();
        updateHUD();
        scheduleDeadlockCheck();
        return true;
      }

        };
