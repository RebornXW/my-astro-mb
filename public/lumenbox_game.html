<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>光影推箱 · LumenBox</title>
  <style>
    :root {
      --stage-bg: linear-gradient(155deg, #E6EBF1 0%, #F4EFE6 52%, #EAE3D7 100%);
      --ink: #2C303A;
      --ink-soft: #6C7280;
      --ink-muted: #989EA8;
      --glass: rgba(255, 253, 249, 0.82);
      --glass-strong: rgba(255, 253, 249, 0.96);
      --glass-border: rgba(255, 255, 255, 0.9);
      --card-border: rgba(156, 146, 132, 0.24);
      --gold: #E5A435;
      --gold-soft: rgba(229, 164, 53, 0.16);
      --jade: #47A17B;
      --ice: #5BAEDB;
      --plat: #6CB8F6;
      --plat-soft: rgba(108, 184, 246, 0.16);
      --danger: #D95B52;
      --shadow-sm: 0 6px 20px rgba(44, 48, 58, 0.08);
      --shadow-md: 0 18px 46px rgba(44, 48, 58, 0.14);
    }

    body.theme-night {
      --ink: #F2EFE9;
      --ink-soft: #A0AAC0;
      --ink-muted: #6C7892;
      --glass: rgba(24, 30, 44, 0.82);
      --glass-strong: rgba(26, 33, 48, 0.96);
      --glass-border: rgba(120, 144, 188, 0.28);
      --card-border: rgba(120, 144, 188, 0.22);
      --shadow-sm: 0 6px 20px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 22px 54px rgba(0, 0, 0, 0.52);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: linear-gradient(155deg, #E6EBF1 0%, #F4EFE6 52%, #EAE3D7 100%);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      touch-action: none;
      transition: background 0.35s ease, color 0.3s ease;
    }

    #viewportShell {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    body.mobile-preview #viewportShell {
      background: #1B1E26;
      padding: 16px;
    }

    #appStage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--stage-bg);
      transition: width 0.28s ease, height 0.28s ease, border-radius 0.28s ease, background 0.35s ease;
    }

    body.mobile-preview #appStage {
      width: min(392px, calc(100vw - 32px));
      height: min(820px, calc(100vh - 32px));
      border-radius: 36px;
      border: 6px solid #2C313E;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .preview-toggle {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 80;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    body.is-mobile .preview-toggle { display: none; }
    .ui-ico { width: 17px; height: 17px; display: block; flex-shrink: 0; }
    .ui-ico.sm { width: 14px; height: 14px; }
    .preview-toggle:hover { transform: translateY(-1px); filter: brightness(1.04); }

    /* =====================================================================
       封面界面
       ===================================================================== */
    .cover-screen {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(40px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
      pointer-events: none;
      visibility: visible;
      transition: opacity 0.32s ease, transform 0.32s ease, visibility 0.32s ease;
    }

    body:not(.in-cover) .cover-screen {
      opacity: 0;
      transform: scale(1.02);
      visibility: hidden;
      pointer-events: none;
    }

    body:not(.in-cover) .cover-screen * {
      pointer-events: none !important;
    }

    .cover-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .cover-emblem {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(145deg, #FFFDF8 0%, #F4EFE4 56%, #E5EFF6 100%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 26px rgba(56, 68, 86, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body.theme-night .cover-emblem {
      background: linear-gradient(145deg, #27344C 0%, #1B2436 100%);
      border-color: rgba(146, 178, 224, 0.34);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .cover-title {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 6px;
      padding-left: 6px;
      color: var(--ink);
    }

    .cover-en {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3.4px;
      padding-left: 3.4px;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: -4px;
    }

    .cover-stats {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 5px 14px;
      margin-top: 2px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
    }

    .cover-stat-item { display: inline-flex; align-items: center; gap: 4px; }
    .cover-stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

    .cover-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 248px;
      pointer-events: auto;
    }

    .btn-primary {
      width: 100%;
      border: none;
      background: var(--ink);
      color: #FFFDF9;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 13px 24px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(44, 48, 58, 0.22);
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    body.theme-night .btn-primary {
      background: #F0B744;
      color: #161B26;
      box-shadow: 0 10px 26px rgba(240, 183, 68, 0.28);
    }

    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.96); }

    .cover-sub-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .btn-ghost {
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .btn-ghost:hover { transform: translateY(-1px); }
    .btn-ghost:active { transform: scale(0.96); }

    /* =====================================================================
       局内 HUD
       ===================================================================== */
    .hud-top {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-sm);
      max-width: calc(100% - 20px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    body.in-cover .hud-top,
    body.in-cover .hud-bottom {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    body.in-cover .hud-top *,
    body.in-cover .hud-bottom * {
      pointer-events: none !important;
    }

    .hud-icon-btn {
      border: none;
      background: transparent;
      color: var(--ink);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.14s ease, opacity 0.14s ease, transform 0.12s ease;
    }

    .hud-icon-btn:hover { background: rgba(128, 134, 148, 0.14); }
    .hud-icon-btn:active { transform: scale(0.9); }

    .level-code-btn {
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 2px 5px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 14px;
      background: rgba(128, 134, 148, 0.24);
      flex-shrink: 0;
    }

    .step-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      padding: 0 2px;
      text-align: center;
    }

    .step-badge .opt-sub {
      color: var(--ink-muted);
      font-weight: 600;
      font-size: 11px;
    }

    .hint-toast {
      position: absolute;
      top: max(68px, calc(env(safe-area-inset-top) + 54px));
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 65;
      background: var(--ink);
      color: #FFFDF9;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    body.theme-night .hint-toast {
      background: #F0B744;
      color: #161B26;
    }

    .hint-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hint-popover {
      position: absolute;
      left: 16px;
      bottom: max(76px, calc(env(safe-area-inset-bottom) + 68px));
      width: min(280px, calc(100% - 32px));
      z-index: 32;
      background: var(--glass-strong);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }

    .hint-popover.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .hint-pop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 800;
    }

    .hint-pop-title { display: inline-flex; align-items: center; gap: 6px; }
    .hint-pop-text { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
    .hint-pop-actions { display: flex; gap: 8px; }

    .mini-pill-btn {
      flex: 1;
      border: 1px solid var(--card-border);
      background: var(--gold-soft);
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .mini-pill-btn.secondary { background: transparent; }

    .hud-bottom {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .tool-group { display: flex; gap: 10px; pointer-events: auto; }

    .round-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--ink);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease, opacity 0.15s ease, box-shadow 0.2s ease;
    }

    .round-btn:active { transform: scale(0.91); }
    .round-btn:disabled { opacity: 0.34; cursor: not-allowed; transform: none; }
    .round-btn.active { border-color: rgba(229, 164, 53, 0.72); background: var(--gold-soft); }

    @keyframes deadlockPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 91, 82, 0.55), var(--shadow-sm); border-color: rgba(217, 91, 82, 0.75); }
      50% { box-shadow: 0 0 0 8px rgba(217, 91, 82, 0), var(--shadow-sm); border-color: rgba(217, 91, 82, 0.95); }
    }

    .round-btn.deadlock-alert {
      color: var(--danger);
      animation: deadlockPulse 1.4s ease-in-out infinite;
    }

    .hint-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--gold);
      color: #261C0B;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    .dpad-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: auto;
    }

    .dpad {
      display: none;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
    }

    .dpad.open { display: grid; }

    .dpad-btn {
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease;
    }

    .dpad-btn:active { transform: scale(0.9); }
    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }

    /* =====================================================================
       弹窗体系
       ===================================================================== */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(24, 28, 38, 0.34);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 360px;
      max-height: 82%;
      overflow-y: auto;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-md);
      transform: translateY(12px) scale(0.97);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .overlay.open .modal-card { transform: translateY(0) scale(1); }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-head h3 { font-size: 16px; font-weight: 800; letter-spacing: 0.6px; }

    .close-btn {
      border: none;
      background: transparent;
      color: var(--ink-soft);
      font-size: 16px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover { background: rgba(128, 134, 148, 0.14); color: var(--ink); }

    /* =====================================================================
       方案 C 选关画册 · 日晷星阵 & 建筑玉砖阵
       ===================================================================== */
    .chapters-modal-card {
      max-width: 392px;
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chap-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chap-brand-mini {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    .chap-total-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(140, 144, 156, 0.11);
      border: 1px solid var(--card-border);
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }

    .chap-total-pill b { color: var(--ink); }

    .chap-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 2px 0;
    }

    .chap-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(140, 144, 156, 0.30);
      border: none;
      cursor: pointer;
      transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .chap-dot.active { width: 20px; background: linear-gradient(90deg, #E2A236 0%, #F4C35C 100%); }
    body.theme-night .chap-dot.active { background: linear-gradient(90deg, #F0B744 0%, #FFE08A 100%); }
    .chap-dot.perfected { background: rgba(78, 178, 238, 0.72); }
    .chap-dot.perfected.active { background: linear-gradient(90deg, #48A8E6 0%, #86DAFF 100%); }

    .sim-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 11px;
      border-radius: 12px;
      background: rgba(82, 176, 236, 0.14);
      border: 1px solid rgba(82, 176, 236, 0.38);
      font-size: 11px;
      font-weight: 700;
      color: #216C98;
    }

    body.theme-night .sim-banner {
      background: rgba(82, 176, 236, 0.2);
      color: #9EDBFF;
    }

    .sim-banner.show { display: flex; }

    .sim-banner-btn {
      border: none;
      background: rgba(255, 255, 255, 0.76);
      color: var(--ink);
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
    }

    body.theme-night .sim-banner-btn {
      background: rgba(24, 32, 48, 0.85);
      color: #F2EFE9;
    }

    @keyframes albumLightDrift {
      0%, 100% { transform: translate(-8%, -6%) scale(1); opacity: 0.56; }
      50% { transform: translate(10%, 8%) scale(1.14); opacity: 0.86; }
    }

    @keyframes dialOrbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes dialCoreBreathe {
      0%, 100% { transform: scale(0.95); opacity: 0.86; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes currentBrickGlow {
      0%, 100% { box-shadow: 0 0 0 1.5px rgba(232, 166, 56, 0.28), 0 6px 16px rgba(232, 166, 56, 0.14); }
      50% { box-shadow: 0 0 0 3.5px rgba(232, 166, 56, 0.18), 0 8px 20px rgba(232, 166, 56, 0.24); }
    }

    .chap-album-card {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 13px 15px 12px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 12px 30px rgba(44, 52, 68, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .chap-album-card::before {
      content: "";
      position: absolute;
      inset: -35% -25%;
      background: radial-gradient(circle at 28% 24%, var(--album-aura, rgba(255, 232, 168, 0.55)) 0%, rgba(255, 255, 255, 0) 56%);
      pointer-events: none;
      animation: albumLightDrift 9.5s ease-in-out infinite;
    }

    .chap-album-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 44%, rgba(255, 255, 255, 0.14) 100%);
      pointer-events: none;
    }

    .chap-album-card > * { position: relative; z-index: 1; }

    .chap-album-card.perfected {

      border-color: rgba(132, 162, 210, 0.22);
    }

    .chap-reward-mini.unlocked {
      background: linear-gradient(135deg, rgba(235, 249, 255, 0.88) 0%, rgba(255, 246, 220, 0.88) 100%);
      border-color: rgba(84, 178, 238, 0.52);
      color: #1F6896;
    }

    body.theme-night .chap-reward-mini.unlocked {
      background: linear-gradient(135deg, rgba(30, 56, 84, 0.85) 0%, rgba(48, 44, 30, 0.82) 100%);
      border-color: rgba(112, 202, 252, 0.52);
      color: #A4DEFF;
    }

    .reward-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;

    .brick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .brick-grid.cols-4 { grid-template-columns: repeat(4, 1fr); gap: 8px; }

    .brick-card {
      aspect-ratio: 1 / 0.92;
      border-radius: 15px;
      background: rgba(140, 144, 156, 0.05);
      border: 1.5px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      position: relative;
      transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);

    .brick-card:hover { transform: translateY(-2px); border-color: rgba(212, 166, 84, 0.6); }

    .brick-card.cleared {
      background: linear-gradient(150deg, #FFFDF8 0%, #FDF3D9 100%);
      border-color: rgba(232, 168, 56, 0.56);
      box-shadow: 0 4px 12px rgba(226, 164, 52, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    body.theme-night .brick-card.cleared {
      background: linear-gradient(150deg, rgba(58, 50, 34, 0.92) 0%, rgba(34, 36, 48, 0.96) 100%);
      border-color: rgba(244, 190, 74, 0.52);
    }

    .brick-card.plat {
      background: linear-gradient(145deg, #F3FBFF 0%, #E3F3FF 58%, #FFF7E2 100%);
      border-color: rgba(78, 178, 240, 0.72);
      box-shadow: 0 5px 14px rgba(72, 168, 232, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.96);
    }

    body.theme-night .brick-card.plat {
      background: linear-gradient(145deg, rgba(28, 58, 86, 0.92) 0%, rgba(36, 44, 62, 0.96) 100%);
      border-color: rgba(114, 204, 255, 0.68);
      box-shadow: 0 5px 16px rgba(64, 164, 232, 0.22);
    }

    .brick-card.current {
      background: linear-gradient(150deg, #FFFDF7 0%, #FAF0D8 100%);
      border-color: #E3A336;
      animation: currentBrickGlow 2.8s ease-in-out infinite;
    }

    .brick-card.current .brick-num { color: #9C6412; }

    body.theme-night .brick-card.current {
      background: linear-gradient(150deg, rgba(64, 54, 34, 0.94) 0%, rgba(34, 40, 56, 0.96) 100%);
      border-color: #F4BE4E;
    }

    body.theme-night .brick-card.current .brick-num { color: #FFE296; }

    .brick-card.locked {
      opacity: 0.44;
      cursor: not-allowed;
    }

    .brick-card.locked:hover { transform: none; border-color: var(--card-border); }

    .brick-card.reserved {
      border-style: dashed;
      background: rgba(140, 144, 156, 0.03);
      opacity: 0.56;
    }

    .brick-card.reserved .brick-num {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .brick-card.reserved:hover {
      transform: none;
      border-color: var(--card-border);
    }

    .brick-grid.paint-mode .brick-card {
      cursor: pointer !important;
      opacity: 1 !important;
    }

    .brick-grid.paint-mode .brick-card:hover {
      transform: translateY(-2px);
      border-color: #5CB8EC;
    }

    .reserved-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      border: 1.2px solid var(--ink-muted);
      opacity: 0.65;
    }

    .brick-grid.filter-gaps .brick-card.plat,
    .brick-grid.filter-gaps .brick-card.locked,
    .brick-grid.filter-gaps .brick-card.reserved {
      opacity: 0.26;
      transform: scale(0.95);
    }

    @keyframes gapPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(72, 174, 238, 0.48); }
      50% { box-shadow: 0 0 0 5px rgba(72, 174, 238, 0); }
    }

    .brick-grid.filter-gaps .brick-card.cleared {
      border-color: #46A8E8;
      animation: gapPulse 1.6s ease-in-out infinite;
    }

    .brick-num {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }

    .brick-mark {
      height: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
    }

    .current-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #E8A634;
      box-shadow: 0 0 0 4px rgba(232, 166, 52, 0.24);
    }

    .chap-footer-tools {
      padding-top: 8px;
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .foot-pill {
      border: 1px solid var(--card-border);
      background: rgba(140, 144, 156, 0.06);
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.14s ease;
    }

    .foot-pill:hover { color: var(--ink); border-color: var(--ink-soft); }
    .foot-pill.active { background: var(--gold-soft); border-color: var(--gold); color: var(--ink); }

    /* 满星测试台弹窗 */
    .test-modal-card {
      max-width: 368px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .test-section {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .test-section-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--ink-muted);
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .test-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .test-btn {
      border: 1px solid var(--card-border);
      background: rgba(140, 144, 156, 0.06);

      font-size: 11.5px;
      font-weight: 700;
      padding: 9px 10px;
      border-radius: 12px;

    .test-btn.gold {

    }

    .test-btn.danger {

    }

    .test-toggle-row {

      justify-content: space-between;

      border: 1px solid var(--card-border);

    .test-toggle-sub {
      display: block;
      font-size: 10px;

      color: var(--ink-soft);

    }

    /* 过关双层成就结算 */
    .clear-body {
      max-width: 318px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      padding: 24px 22px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .clear-body.platinum-clear {
      border-color: rgba(132, 206, 255, 0.85);
      box-shadow: 0 22px 58px rgba(84, 162, 236, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .clear-body.platinum-clear::before {
      content: "";
      position: absolute;
      inset: -40% -20% auto;
      height: 150px;
      background: radial-gradient(ellipse at center, rgba(136, 210, 255, 0.24) 0%, rgba(246, 198, 92, 0.14) 48%, rgba(146, 212, 255, 0) 75%);
      pointer-events: none;
    }

    .chap-complete-badge {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--gold-soft);
      border: 1px solid rgba(229, 164, 53, 0.38);
      color: var(--gold);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    .chap-complete-badge.show { display: inline-flex; }

    .clear-code {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--ink-soft);
    }

    .stars-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 58px;
      position: relative;
    }

    .plat-star-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes platHaloSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes platGlowBreathe {
      0%, 100% { transform: scale(0.94); opacity: 0.42; }
      50% { transform: scale(1.06); opacity: 0.72; }
    }

    .plat-halo {
      position: absolute;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(138, 212, 255, 0.32) 0%, rgba(138, 212, 255, 0) 70%);
      border: 1px dashed rgba(116, 194, 246, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }

    .plat-star-wrap.popped .plat-halo {
      opacity: 1;
      animation: platHaloSpin 18s linear infinite;
    }

    @keyframes starPopIn {
      0% { transform: scale(0.25) rotate(-18deg); opacity: 0; }
      65% { transform: scale(1.22) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes platBurst {
      0% { transform: scale(0.2) rotate(-24deg); opacity: 0; filter: drop-shadow(0 0 0 rgba(124, 198, 250, 0)); }
      62% { transform: scale(1.18) rotate(4deg); opacity: 1; filter: drop-shadow(0 0 14px rgba(124, 198, 250, 0.78)); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 8px rgba(124, 198, 250, 0.48)); }
    }

    .star-svg { width: 46px; height: 46px; opacity: 0; transform: scale(0.3); }
    .star-svg.popped { animation: starPopIn 0.44s cubic-bezier(0.22, 1.35, 0.36, 1) forwards; }
    .star-svg.platinum { width: 48px; height: 48px; }
    .star-svg.platinum.popped { animation: platBurst 0.54s cubic-bezier(0.22, 1.35, 0.36, 1) forwards; }

    .clear-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;

    .metric-box {
      background: rgba(140, 144, 156, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;

    .metric-box span { font-size: 11px; color: var(--ink-soft); }
    .metric-box b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }

    .opt-hint-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      background: rgba(140, 144, 156, 0.08);
      border: 1px dashed var(--card-border);
    }

    .opt-hint-pill.achieved {
      color: #2B7BC2;
      background: linear-gradient(135deg, rgba(132, 204, 255, 0.22) 0%, rgba(164, 186, 255, 0.18) 100%);
      border: 1px solid rgba(118, 192, 252, 0.52);
    }

    body.theme-night .opt-hint-pill.achieved { color: #A8DCFF; }

    .plat-reward-tip {
      display: none;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-top: -4px;
    }

    .plat-reward-tip.show { display: block; }

    .clear-actions {

      align-items: center;
      gap: 10px;
      width: 100%;
      margin-top: 2px;
    }

    .clear-actions .round-btn { flex-shrink: 0; }
    .clear-actions .btn-primary { flex: 1; padding: 11px 16px; }

    /* 外观换肤 */

            active: false, pointerId: null,
            downX: 0, downY: 0, anchorX: 0, anchorY: 0, curX: 0, curY: 0,
            didSwipe: false

          function onStart(x, y, id = 0) {
            if (opts.canAccept && !opts.canAccept()) return;
            state.active = true; state.pointerId = id;
            state.downX = x; state.downY = y;
            state.anchorX = x; state.anchorY = y;
            state.curX = x; state.curY = y;
            state.didSwipe = false;
          }

          function onMove(x, y, id = 0) {
            if (!state.active || (id !== null && state.pointerId !== id)) return;
            state.curX = x; state.curY = y;
            const dx = x - state.anchorX, dy = y - state.anchorY;
            if (Math.abs(dx) < SWIPE && Math.abs(dy) < SWIPE) return;
            state.didSwipe = true;
            if (Math.abs(dx) > Math.abs(dy)) {
              const dc = dx > 0 ? 1 : -1;
              opts.onDirection && opts.onDirection(0, dc, dc > 0 ? "right" : "left");
            } else {
              const dr = dy > 0 ? 1 : -1;
              opts.onDirection && opts.onDirection(dr, 0, dr > 0 ? "down" : "up");
            }
            state.anchorX = x; state.anchorY = y;
          }

          function onEnd(x, y, id = 0) {
            if (!state.active || (id !== null && state.pointerId !== id)) return;
            const totalDist = Math.hypot(x - state.downX, y - state.downY);
            const wasTap = !state.didSwipe && totalDist < 14;
            state.active = false; state.pointerId = null;
            if (wasTap && opts.onTap) opts.onTap(x, y);
          }

          function cancel() { state.active = false; state.pointerId = null; }
          return { state, onStart, onMove, onEnd, cancel };
        }
