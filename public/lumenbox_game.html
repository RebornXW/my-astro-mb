          ctx.restore();
        }

        // 暖珀墙虚化/压制态（平滑相变 ratio 0..1）：影下满格锐角锚角虚框 · 光下占格压制显满格锐角暖金弹性呼吸框
        function drawAmberWallDormant(ctx, x, y, ts, isSuppressed, elapsed, ratio = 1) {
          if (ratio <= 0.03) return;
          const cx = x + ts / 2, cy = y + ts / 2;
          const breathe = 0.5 + 0.5 * Math.sin(elapsed * 3.4);

          ctx.save();
          ctx.globalAlpha = ratio;
          if (isSuppressed) {
            const size = ts * 0.88 + breathe * 1.4;
            const ox = cx - size / 2, oy = cy - size / 2;
            ctx.fillStyle = CFG.isDark
              ? `rgba(245, 190, 72, ${0.14 + 0.11 * breathe})`
              : `rgba(224, 152, 28, ${0.12 + 0.10 * breathe})`;
            ctx.fillRect(ox + 1.2, oy + 1.2, size - 2.4, size - 2.4);

            ctx.shadowColor = CFG.isDark ? "rgba(255, 206, 86, 0.72)" : "rgba(218, 138, 18, 0.45)";
            ctx.shadowBlur = 2 + 5 * breathe;
            ctx.strokeStyle = CFG.isDark
              ? `rgba(252, 208, 96, ${0.68 + 0.32 * breathe})`
              : `rgba(206, 128, 16, ${0.66 + 0.34 * breathe})`;
            ctx.lineWidth = 1.9;
            ctx.strokeRect(ox + 1.2, oy + 1.2, size - 2.4, size - 2.4);

            ctx.shadowBlur = 0;
            ctx.strokeStyle = `rgba(255, 250, 224, ${0.44 + 0.34 * breathe})`;
            ctx.lineWidth = 0.9;
            ctx.strokeRect(ox + 3, oy + 3, size - 6, size - 6);
          } else {
            const size = ts * 0.88;
            const ox = cx - size / 2, oy = cy - size / 2;
            drawAnchoredDashedSharpRect(
              ctx, ox + 1.2, oy + 1.2, size - 2.4,
              CFG.isDark ? "rgba(246, 196, 82, 0.82)" : "rgba(198, 132, 22, 0.80)",
              CFG.isDark ? "rgba(236, 182, 68, 0.48)" : "rgba(196, 138, 36, 0.48)",
              CFG.isDark ? "rgba(232, 178, 68, 0.08)" : "rgba(218, 166, 66, 0.07)"
            );
          }
          ctx.restore();
        }

        // 虚化/压制可变箱（C/F）底层表达：严格 0.72 占格，100% 冷暖对称 + 弹性呼吸 + 平滑相变
        function drawDormantBoxPad(ctx, x, y, ts, kind, isSuppressed, elapsed, seed = 6, hideCenterDot = false, ratio = 1) {
          if (ratio <= 0.03) return;
          const cx = x + ts / 2, cy = y + ts / 2;
          const breathe = 0.5 + 0.5 * Math.sin(elapsed * 3.4);
          const baseSize = ts * CFG.boxScale;
          const r = ts * 0.135;

          ctx.save();
          ctx.globalAlpha = ratio;
          if (kind === "C") {
            if (isSuppressed) {
              const boxSize = baseSize + breathe * 1.4;
              const ox = cx - boxSize / 2, oy = cy - boxSize / 2;
              roundRect(ctx, ox, oy, boxSize, boxSize, r);
              ctx.fillStyle = CFG.isDark
                ? `rgba(116, 212, 255, ${0.22 + 0.14 * breathe})`
                : `rgba(92, 192, 244, ${0.20 + 0.13 * breathe})`;
              ctx.fill();

              ctx.shadowColor = CFG.isDark ? "rgba(136, 228, 255, 0.76)" : "rgba(42, 152, 218, 0.48)";
              ctx.shadowBlur = 2 + 5.5 * breathe;
              ctx.strokeStyle = CFG.isDark
                ? `rgba(176, 238, 255, ${0.70 + 0.30 * breathe})`
                : `rgba(38, 146, 212, ${0.70 + 0.30 * breathe})`;
              ctx.lineWidth = 1.9;
              ctx.stroke();

              ctx.shadowBlur = 0;
              roundRect(ctx, ox + 1.6, oy + 1.6, boxSize - 3.2, boxSize - 3.2, Math.max(3, r - 1.2));
              ctx.strokeStyle = `rgba(246, 253, 255, ${0.48 + 0.36 * breathe})`;
              ctx.lineWidth = 0.9;
              ctx.stroke();
            } else {
              const maxR = ts * 0.375 * (0.35 + 0.65 * ratio);
              const g = ctx.createRadialGradient(cx - maxR * 0.18, cy - maxR * 0.18, 1.5, cx, cy, maxR);
              g.addColorStop(0, "rgba(212, 244, 255, 0.90)");
              g.addColorStop(0.65, "rgba(130, 210, 246, 0.72)");
              g.addColorStop(1, "rgba(88, 182, 228, 0.48)");
              ctx.fillStyle = g;
              ctx.beginPath(); ctx.arc(cx, cy, maxR, 0, Math.PI * 2); ctx.fill();

              ctx.strokeStyle = CFG.isDark ? "rgba(218, 246, 255, 0.86)" : "rgba(255, 255, 255, 0.94)";
              ctx.lineWidth = 1.45;
              ctx.beginPath(); ctx.arc(cx, cy, maxR - 0.5, 0, Math.PI * 2); ctx.stroke();

              const rip = (elapsed * 0.55 + seed * 0.37) % 1;
              ctx.strokeStyle = `rgba(255, 255, 255, ${(1 - rip) * 0.72})`;
              ctx.lineWidth = 1.15;
              ctx.beginPath(); ctx.arc(cx, cy, maxR * (0.22 + rip * 0.68), 0, Math.PI * 2); ctx.stroke();
            }
            ctx.restore();
            return;
          }

          if (isSuppressed) {
            const boxSize = baseSize + breathe * 1.4;
            const ox = cx - boxSize / 2, oy = cy - boxSize / 2;
            roundRect(ctx, ox, oy, boxSize, boxSize, r);
            ctx.fillStyle = CFG.isDark
              ? `rgba(246, 188, 62, ${0.22 + 0.14 * breathe})`
              : `rgba(232, 162, 34, ${0.19 + 0.13 * breathe})`;
            ctx.fill();

            ctx.shadowColor = CFG.isDark ? "rgba(255, 208, 92, 0.76)" : "rgba(218, 138, 18, 0.48)";
            ctx.shadowBlur = 2 + 5.5 * breathe;
            ctx.strokeStyle = CFG.isDark
              ? `rgba(255, 214, 102, ${0.70 + 0.30 * breathe})`
              : `rgba(204, 126, 14, ${0.70 + 0.30 * breathe})`;
            ctx.lineWidth = 1.9;
            ctx.stroke();

            ctx.shadowBlur = 0;
            roundRect(ctx, ox + 1.6, oy + 1.6, boxSize - 3.2, boxSize - 3.2, Math.max(3, r - 1.2));
            ctx.strokeStyle = `rgba(255, 248, 216, ${0.46 + 0.34 * breathe})`;
            ctx.lineWidth = 0.9;
            ctx.stroke();
          } else {
            const ox = cx - baseSize / 2, oy = cy - baseSize / 2;
            drawAnchoredDashedRoundRect(
              ctx, ox, oy, baseSize, r,
              CFG.isDark ? "rgba(252, 206, 92, 0.90)" : "rgba(204, 132, 18, 0.88)",
              CFG.isDark ? "rgba(242, 190, 78, 0.56)" : "rgba(198, 138, 32, 0.54)",
              CFG.isDark ? "rgba(242, 184, 58, 0.15)" : "rgba(228, 168, 46, 0.13)"
            );
            if (!hideCenterDot) {
              ctx.beginPath(); ctx.arc(cx, cy, ts * 0.055, 0, Math.PI * 2);
              ctx.fillStyle = CFG.isDark ? "rgba(248, 202, 88, 0.62)" : "rgba(216, 154, 38, 0.56)";
              ctx.fill();
            }
          }
          ctx.restore();
        }

        function drawSnowflakeMotif(ctx, cx, cy, r, color, lineW, openCenterRatio = 0) {
          ctx.save();
          ctx.strokeStyle = color;
          ctx.lineWidth = lineW;
          ctx.lineCap = "round";
          const startR = r * openCenterRatio;
          const branchR = r * 0.62;
          const tick = r * 0.28;
          for (let i = 0; i < 6; i++) {
            const a = (Math.PI * i) / 3 - Math.PI / 2;
            const cos = Math.cos(a), sin = Math.sin(a);
            ctx.beginPath();
            ctx.moveTo(cx + cos * startR, cy + sin * startR);
            ctx.lineTo(cx + cos * r, cy + sin * r);
            const bx = cx + cos * branchR, by = cy + sin * branchR;
            ctx.moveTo(bx + Math.cos(a - 0.78) * tick, by + Math.sin(a - 0.78) * tick);
            ctx.lineTo(bx, by);
            ctx.lineTo(bx + Math.cos(a + 0.78) * tick, by + Math.sin(a + 0.78) * tick);
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawIceWall(ctx, x, y, ts, solidRatio = 1, sealedAmberAlpha = 0) {
          if (solidRatio <= 0.03) return;
          const size = ts * 0.84 * (0.35 + 0.65 * solidRatio);
          const ox = x + (ts - size) / 2, oy = y + (ts - size) / 2;
          const cx = ox + size / 2, cy = oy + size / 2;
          castShadowRect(ctx, ox, oy, size, size, 2, ts * CFG.shadowLen * 0.85 * solidRatio, 0.16);
          ctx.save();
          ctx.globalAlpha = 0.95 * solidRatio;
          const tri = (x1, y1, x2, y2, fill) => {
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath();
            ctx.fillStyle = fill; ctx.fill();
          };
          const x0 = ox, y0 = oy, x1 = ox + size, y1 = oy + size;
          tri(x0, y0, x1, y0, "#D4F3FF"); tri(x0, y0, x0, y1, "#A6E2FC");
          tri(x1, y0, x1, y1, "#6CC3EE"); tri(x0, y1, x1, y1, "#4CA6D9");

          const crown = size * 0.54, crX = cx - crown / 2, crY = cy - crown / 2;
          ctx.fillStyle = "rgba(136, 212, 246, 0.65)";
          ctx.fillRect(crX, crY, crown, crown);

          if (sealedAmberAlpha > 0.03) {
            ctx.save();
            ctx.globalAlpha = Math.min(1, sealedAmberAlpha) * solidRatio;
            // I+F 寒冰墙玻璃顶窗内封小号 M1 暖珀方晶
            const fSz = crown * 0.64, fR = Math.max(2.5, fSz * 0.24);
            const fx = cx - fSz / 2, fy = cy - fSz / 2;
            const fg = ctx.createRadialGradient(cx - fSz * 0.16, cy - fSz * 0.18, 1, cx, cy, fSz * 0.78);
            fg.addColorStop(0, "#FFF2B8");
            fg.addColorStop(0.52, "#F0B03A");
            fg.addColorStop(1, "#BA6B0E");
            roundRect(ctx, fx, fy, fSz, fSz, fR);
            ctx.fillStyle = fg;
            ctx.fill();
            ctx.strokeStyle = "rgba(255, 250, 224, 0.88)";
            ctx.lineWidth = 1.05;
            ctx.stroke();
            ctx.restore();
          }

          const glassG = ctx.createLinearGradient(crX, crY, crX + crown, crY + crown);
          glassG.addColorStop(0, "rgba(255, 255, 255, 0.52)");
          glassG.addColorStop(0.48, "rgba(218, 246, 255, 0.16)");
          glassG.addColorStop(1, "rgba(124, 202, 242, 0.28)");
          ctx.fillStyle = glassG;
          ctx.fillRect(crX, crY, crown, crown);

          ctx.strokeStyle = "rgba(255, 255, 255, 0.78)"; ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(x0, y0); ctx.lineTo(crX, crY); ctx.moveTo(x1, y0); ctx.lineTo(crX + crown, crY);
          ctx.moveTo(x0, y1); ctx.lineTo(crX, crY + crown); ctx.moveTo(x1, y1); ctx.lineTo(crX + crown, crY + crown);
          ctx.stroke();
          ctx.strokeRect(crX + 0.5, crY + 0.5, crown - 1, crown - 1);
          ctx.strokeRect(x0 + 0.5, y0 + 0.5, size - 1, size - 1);
          ctx.restore();
        }

        function drawAmberWall(ctx, x, y, ts, solidRatio = 1, sealedIceAlpha = 0) {
          if (solidRatio <= 0.03) return;
          const baseSize = ts * 0.84;
          const size = baseSize * (0.35 + 0.65 * solidRatio);
          const ox = x + (ts - size) / 2, oy = y + (ts - size) / 2;
          const cx = ox + size / 2, cy = oy + size / 2;
          castShadowRect(ctx, ox, oy, size, size, 2, ts * CFG.shadowLen * 0.85 * solidRatio, 0.16);
          ctx.save();
          ctx.globalAlpha = 0.96 * solidRatio;
          const tri = (x1, y1, x2, y2, fill) => {
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath();
            ctx.fillStyle = fill; ctx.fill();
          };
          const x0 = ox, y0 = oy, x1 = ox + size, y1 = oy + size;
          tri(x0, y0, x1, y0, "#FFF0B5"); tri(x0, y0, x0, y1, "#F7C95E");
          tri(x1, y0, x1, y1, "#DB982A"); tri(x0, y1, x1, y1, "#B87418");

          const crown = size * 0.54, crX = cx - crown / 2, crY = cy - crown / 2;
          ctx.fillStyle = "rgba(222, 152, 34, 0.68)";
          ctx.fillRect(crX, crY, crown, crown);

          if (sealedIceAlpha > 0.03) {
            ctx.save();
            ctx.globalAlpha = Math.min(1, sealedIceAlpha) * solidRatio;
            const halo = ctx.createRadialGradient(cx, cy, 1, cx, cy, crown * 0.44);
            halo.addColorStop(0, "rgba(182, 236, 255, 0.65)");
            halo.addColorStop(1, "rgba(92, 186, 236, 0)");
            ctx.fillStyle = halo;
            ctx.beginPath(); ctx.arc(cx, cy, crown * 0.44, 0, Math.PI * 2); ctx.fill();
            drawSnowflakeMotif(ctx, cx, cy, crown * 0.36, "#E6F9FF", Math.max(1.3, ts * 0.025), 0);
            ctx.restore();
          }

          const glassG = ctx.createLinearGradient(crX, crY, crX + crown, crY + crown);
          glassG.addColorStop(0, "rgba(255, 253, 240, 0.48)");
          glassG.addColorStop(0.5, "rgba(255, 224, 134, 0.14)");
          glassG.addColorStop(1, "rgba(196, 128, 22, 0.25)");
          ctx.fillStyle = glassG;
          ctx.fillRect(crX, crY, crown, crown);

          ctx.strokeStyle = "rgba(255, 250, 224, 0.80)"; ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(x0, y0); ctx.lineTo(crX, crY); ctx.moveTo(x1, y0); ctx.lineTo(crX + crown, crY);
          ctx.moveTo(x0, y1); ctx.lineTo(crX, crY + crown); ctx.moveTo(x1, y1); ctx.lineTo(crX + crown, crY + crown);
          ctx.stroke();
          ctx.strokeRect(crX + 0.5, crY + 0.5, crown - 1, crown - 1);
          ctx.strokeRect(x0 + 0.5, y0 + 0.5, size - 1, size - 1);
          ctx.restore();
        }

        function drawR1Shell(ctx, ox, oy, size, r, isAmber) {
          const cx = ox + size / 2, cy = oy + size / 2;
          const baseG = ctx.createRadialGradient(cx - size * 0.18, cy - size * 0.20, size * 0.06, cx, cy, size * 0.78);
          if (isAmber) {
            baseG.addColorStop(0, "#FFF0B0");
            baseG.addColorStop(0.45, "#F2B23E");
            baseG.addColorStop(0.84, "#C77412");
            baseG.addColorStop(1, "#9E5308");
          } else {
            baseG.addColorStop(0, "#D6F4FF");
            baseG.addColorStop(0.45, "#74CBF4");
            baseG.addColorStop(0.84, "#3B99D2");
            baseG.addColorStop(1, "#2A7EB5");
          }
          roundRect(ctx, ox, oy, size, size, r);
          ctx.fillStyle = baseG;
          ctx.fill();

          ctx.save();
          roundRect(ctx, ox, oy, size, size, r);
          ctx.clip();

          const caustic = ctx.createRadialGradient(cx + size * 0.12, oy + size * 0.92, 1, cx + size * 0.08, oy + size * 0.88, size * 0.56);
          if (isAmber) {
            caustic.addColorStop(0, "rgba(255, 244, 186, 0.78)");
            caustic.addColorStop(0.55, "rgba(255, 210, 102, 0.24)");
            caustic.addColorStop(1, "rgba(255, 210, 102, 0)");
          } else {
            caustic.addColorStop(0, "rgba(218, 250, 255, 0.72)");
            caustic.addColorStop(0.55, "rgba(156, 232, 255, 0.22)");
            caustic.addColorStop(1, "rgba(156, 232, 255, 0)");
          }
          ctx.fillStyle = caustic;
          ctx.fillRect(ox, oy, size, size);

          const dome = ctx.createLinearGradient(ox, oy, ox, oy + size * 0.46);
          dome.addColorStop(0, isAmber ? "rgba(255, 253, 236, 0.56)" : "rgba(255, 255, 255, 0.62)");
          dome.addColorStop(0.65, isAmber ? "rgba(255, 246, 204, 0.12)" : "rgba(255, 255, 255, 0.12)");
          dome.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = dome;
          ctx.beginPath();
          ctx.moveTo(ox, oy); ctx.lineTo(ox + size, oy); ctx.lineTo(ox + size, oy + size * 0.30);
          ctx.quadraticCurveTo(cx, oy + size * 0.48, ox, oy + size * 0.30);
          ctx.closePath();
          ctx.fill();

          roundRect(ctx, ox + 1.5, oy + 1.5, size - 3, size - 3, Math.max(3, r - 1));
          ctx.strokeStyle = isAmber ? "rgba(255, 244, 198, 0.46)" : "rgba(232, 250, 255, 0.52)";
          ctx.lineWidth = Math.max(2.6, size * 0.075);
          ctx.stroke();
          ctx.restore();
        }

        function drawWoodBox(ctx, x, y, ts, onGoal, elapsed, scaleMult = 1, skipShadow = false, underKind = null, underSuppressed = false) {
          const size = ts * CFG.boxScale * scaleMult, ox = x + (ts - size) / 2, oy = y + (ts - size) / 2, r = ts * 0.14 * scaleMult;
          const cx = ox + size / 2, cy = oy + size / 2;
          if (!onGoal && !skipShadow) castShadowRect(ctx, ox, oy, size, size, r, ts * CFG.shadowLen * 0.7, 0.17);
          ctx.save();

          // 精修哑光浅凹实木匣（去糖果高光、去 45° 墙体硬切线，突出温润手作木质）
          const outerG = ctx.createLinearGradient(ox, oy, ox + size, oy + size);
          outerG.addColorStop(0, "#E6BE91");
          outerG.addColorStop(0.52, "#CC945C");
          outerG.addColorStop(1, "#A66E3A");
          roundRect(ctx, ox, oy, size, size, r);
          ctx.fillStyle = outerG; ctx.fill();

          // 顶左微暖沿口受光，强化木匣厚度
          ctx.save();
          roundRect(ctx, ox, oy, size, size, r);
          ctx.clip();
          const rimHi = ctx.createLinearGradient(ox, oy, ox, oy + size * 0.24);
          rimHi.addColorStop(0, "rgba(255, 248, 234, 0.34)");
          rimHi.addColorStop(1, "rgba(255, 248, 234, 0)");
          ctx.fillStyle = rimHi;
          ctx.fillRect(ox, oy, size, size * 0.24);
          ctx.restore();

          // 圆润浅凹内嵌实木板（无 45° 斜缝，与多棱晶体墙彻底拉开视觉语法）
          const inset = size * 0.165;
          const ix = ox + inset, iy = oy + inset, isz = size - inset * 2, ir = Math.max(4, r * 0.62);
          const panelG = ctx.createLinearGradient(ix, iy, ix + isz, iy + isz);
          panelG.addColorStop(0, "#B87E48");
          panelG.addColorStop(0.45, "#C9915A");
          panelG.addColorStop(1, "#DDA976");
          roundRect(ctx, ix, iy, isz, isz, ir);
          ctx.fillStyle = panelG; ctx.fill();

          // 凹槽内部微阴影 + 细腻哑光木板拼接肌理
          ctx.save();
          roundRect(ctx, ix, iy, isz, isz, ir);
          ctx.clip();
          const innerSh = ctx.createLinearGradient(ix, iy, ix + isz * 0.42, iy + isz * 0.42);
          innerSh.addColorStop(0, "rgba(86, 48, 16, 0.22)");
          innerSh.addColorStop(1, "rgba(86, 48, 16, 0)");
          ctx.fillStyle = innerSh;
          ctx.fillRect(ix, iy, isz, isz);

          // 三条极柔和错色实木横拼板
          ctx.fillStyle = "rgba(96, 54, 18, 0.055)";
          ctx.fillRect(ix, iy + isz * 0.34, isz, isz * 0.32);
          ctx.strokeStyle = onGoal ? "rgba(255, 236, 168, 0.42)" : "rgba(92, 52, 18, 0.17)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(ix, iy + isz * 0.34); ctx.lineTo(ix + isz, iy + isz * 0.34);
          ctx.moveTo(ix, iy + isz * 0.66); ctx.lineTo(ix + isz, iy + isz * 0.66);
          ctx.stroke();
          ctx.restore();

          // 浅凹面板边缘高光与阴刻线
          const breathe = 0.65 + 0.35 * Math.sin((elapsed || 0) * 2.8);
          roundRect(ctx, ix + 0.6, iy + 0.6, isz, isz, ir);
          ctx.strokeStyle = "rgba(255, 244, 224, 0.34)";
          ctx.lineWidth = 1;
          ctx.stroke();

          roundRect(ctx, ix, iy, isz, isz, ir);
          if (underKind === "C") {
            ctx.strokeStyle = underSuppressed ? `rgba(148, 226, 255, ${0.72 + 0.26 * breathe})` : "rgba(156, 224, 255, 0.72)";
            ctx.lineWidth = underSuppressed ? 1.65 : 1.3;
          } else if (underKind === "F") {
            ctx.strokeStyle = underSuppressed ? `rgba(255, 218, 108, ${0.76 + 0.22 * breathe})` : "rgba(255, 214, 104, 0.72)";
            ctx.lineWidth = underSuppressed ? 1.65 : 1.3;
          } else {
            ctx.strokeStyle = onGoal ? "rgba(255, 232, 152, 0.56)" : "rgba(94, 54, 18, 0.28)";
            ctx.lineWidth = 1.1;
          }
          ctx.stroke();

          // 木箱压住雪箱 C / 暖珀箱 F 时，于浅凹中心克制呈现冰花或暖珀方印（零底砖、不缩水）
          if (underKind === "C") {
            const halo = ctx.createRadialGradient(cx, cy, 1, cx, cy, isz * 0.44);
            halo.addColorStop(0, `rgba(176, 236, 255, ${underSuppressed ? 0.38 + 0.16 * breathe : 0.32})`);
            halo.addColorStop(1, "rgba(116, 206, 248, 0)");
            ctx.fillStyle = halo;
            ctx.beginPath(); ctx.arc(cx, cy, isz * 0.44, 0, Math.PI * 2); ctx.fill();
            drawSnowflakeMotif(ctx, cx, cy, isz * 0.32, "rgba(232, 250, 255, 0.96)", Math.max(1.35, ts * 0.023), 0);
          } else if (underKind === "F") {
            const fSz = isz * 0.48, fR = Math.max(3, fSz * 0.26);
            const fx = cx - fSz / 2, fy = cy - fSz / 2;
            const halo = ctx.createRadialGradient(cx, cy, 1, cx, cy, isz * 0.46);
            halo.addColorStop(0, `rgba(255, 224, 128, ${underSuppressed ? 0.44 + 0.16 * breathe : 0.34})`);
            halo.addColorStop(1, "rgba(244, 182, 54, 0)");
            ctx.fillStyle = halo;
            ctx.beginPath(); ctx.arc(cx, cy, isz * 0.46, 0, Math.PI * 2); ctx.fill();
            const fg = ctx.createRadialGradient(cx - fSz * 0.16, cy - fSz * 0.18, 1, cx, cy, fSz * 0.78);
            fg.addColorStop(0, "#FFF6C8");
            fg.addColorStop(0.55, "#F2B640");
            fg.addColorStop(1, "#C27210");
            roundRect(ctx, fx, fy, fSz, fSz, fR);
            ctx.fillStyle = fg; ctx.fill();
            ctx.strokeStyle = "rgba(255, 252, 232, 0.88)";
            ctx.lineWidth = 1.05; ctx.stroke();
          }

          roundRect(ctx, ox, oy, size, size, r);
          ctx.strokeStyle = "rgba(255, 244, 228, 0.48)"; ctx.lineWidth = 1.2; ctx.stroke();
          ctx.restore();

          if (onGoal) drawLockGoldSeam(ctx, ox, oy, size, r, elapsed);
        }

        function drawIceBox(ctx, x, y, ts, onGoal, elapsed, solidRatio = 1, scaleMult = 1, skipShadow = false, hasUnderAmber = false) {
          if (solidRatio <= 0.03) return;
          const cx = x + ts / 2, cy = y + ts / 2, size = ts * CFG.boxScale * (0.3 + 0.7 * solidRatio) * scaleMult;
          const ox = cx - size / 2, oy = cy - size / 2, r = Math.max(3, ts * 0.14 * solidRatio);
          if (!onGoal && !skipShadow) castShadowRect(ctx, ox, oy, size, size, r, ts * CFG.shadowLen * 0.7 * solidRatio, 0.16);
          ctx.save();
          ctx.globalAlpha = solidRatio;
          // R1 · 穹顶琉璃雪箱
          drawR1Shell(ctx, ox, oy, size, r, false);
          if (hasUnderAmber) {
            // 雪箱压在琥珀箱上：中心雪花化为温润琥珀金（配极克制暖金微晕）
            const breathe = 0.72 + 0.28 * Math.sin((elapsed || 0) * 2.5);
            const warmHalo = ctx.createRadialGradient(cx, cy, 1, cx, cy, size * 0.38);
            warmHalo.addColorStop(0, `rgba(255, 226, 128, ${0.46 * breathe})`);
            warmHalo.addColorStop(0.6, `rgba(244, 182, 54, ${0.16 * breathe})`);
            warmHalo.addColorStop(1, "rgba(244, 182, 54, 0)");
            ctx.fillStyle = warmHalo;
            ctx.beginPath(); ctx.arc(cx, cy, size * 0.38, 0, Math.PI * 2); ctx.fill();
            ctx.save();
            ctx.shadowColor = "rgba(224, 142, 18, 0.72)";
            ctx.shadowBlur = 5;
            drawSnowflakeMotif(ctx, cx, cy, size * 0.28, "#FFE38A", Math.max(1.65, ts * 0.030), 0);
            ctx.restore();
          } else {
            drawSnowflakeMotif(ctx, cx, cy, size * 0.27, "rgba(255, 255, 255, 0.95)", Math.max(1.4, ts * 0.025), 0);
          }

          roundRect(ctx, ox, oy, size, size, r);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.88)"; ctx.lineWidth = 1.25; ctx.stroke();
          ctx.restore();

          if (onGoal && solidRatio > 0.6) drawLockGoldSeam(ctx, ox, oy, size, r, elapsed);
        }

        function drawAmberBox(ctx, x, y, ts, solidRatio, onGoal, elapsed, scaleMult = 1, skipShadow = false, hasUnderIce = false) {
          if (solidRatio <= 0.03) return;
          const cx = x + ts / 2, cy = y + ts / 2;
          const baseSize = ts * CFG.boxScale, baseR = ts * 0.14;
          const size = baseSize * (0.3 + 0.7 * solidRatio) * scaleMult;
          const ox = cx - size / 2, oy = cy - size / 2, r = Math.max(3, baseR * solidRatio);
          if (!onGoal && !skipShadow) castShadowRect(ctx, ox, oy, size, size, r, ts * CFG.shadowLen * 0.7 * solidRatio, 0.16);
          ctx.save();
          ctx.globalAlpha = solidRatio;
          // M1 · 纯粹素珀
          drawR1Shell(ctx, ox, oy, size, r, true);
          if (hasUnderIce) {
            // 琥珀箱压在雪箱上：通透素珀中心浮现一枚剔透冰蓝雪花
            const iceHalo = ctx.createRadialGradient(cx, cy, 1, cx, cy, size * 0.36);
            iceHalo.addColorStop(0, "rgba(212, 246, 255, 0.54)");
            iceHalo.addColorStop(0.6, "rgba(116, 206, 248, 0.18)");
            iceHalo.addColorStop(1, "rgba(116, 206, 248, 0)");
            ctx.fillStyle = iceHalo;
            ctx.beginPath(); ctx.arc(cx, cy, size * 0.36, 0, Math.PI * 2); ctx.fill();
            ctx.save();
            ctx.shadowColor = "rgba(44, 146, 206, 0.55)";
            ctx.shadowBlur = 4;
            drawSnowflakeMotif(ctx, cx, cy, size * 0.27, "#EAF9FF", Math.max(1.5, ts * 0.027), 0);
            ctx.restore();
          } else {
            const innerGlow = ctx.createRadialGradient(cx, cy, 1, cx, cy, size * 0.34);
            innerGlow.addColorStop(0, "rgba(255, 250, 224, 0.34)");
            innerGlow.addColorStop(1, "rgba(255, 230, 150, 0)");
            ctx.fillStyle = innerGlow;
            ctx.beginPath(); ctx.arc(cx, cy, size * 0.34, 0, Math.PI * 2); ctx.fill();
          }

          roundRect(ctx, ox, oy, size, size, r);
          ctx.strokeStyle = "rgba(255, 248, 218, 0.84)"; ctx.lineWidth = 1.25; ctx.stroke();
          ctx.restore();

          if (onGoal && solidRatio > 0.6) drawLockGoldSeam(ctx, ox, oy, size, r, elapsed);
        }
        function drawSunTower(ctx, x, y, ts, elapsed, r = 0, c = 0, wallMask = null, rows = 0, cols = 0, isEmbedded = true) {
          const cx = x + ts / 2, cy = y + ts / 2, pulse = 1 + Math.sin(elapsed * 2.5) * 0.04;

          ctx.save();
          if (isEmbedded && wallMask) {
            drawWall(ctx, x, y, ts, r, c, wallMask, rows, cols);
          } else {
            // 空地独立太阳是光源本身：不投暗灰墙影，改为贴地一圈极柔和的暖金漫反射底光
            const pad = ts * 0.06, sz = ts - pad * 2, rad = ts * 0.14;
            const groundAura = ctx.createRadialGradient(cx, cy, sz * 0.25, cx, cy, ts * 0.66);
            groundAura.addColorStop(0, "rgba(255, 224, 132, 0.36)");
            groundAura.addColorStop(0.65, "rgba(248, 204, 96, 0.12)");
            groundAura.addColorStop(1, "rgba(248, 204, 96, 0)");
            ctx.fillStyle = groundAura;
            ctx.beginPath(); ctx.arc(cx, cy, ts * 0.66, 0, Math.PI * 2); ctx.fill();

            roundRect(ctx, x + pad, y + pad, sz, sz, rad);
            const stG = ctx.createLinearGradient(x, y, x + ts, y + ts);
            stG.addColorStop(0, CFG.wallHi);
            stG.addColorStop(0.55, CFG.wallBase);
            stG.addColorStop(1, CFG.wallRight);
            ctx.fillStyle = stG;
            ctx.fill();
            ctx.strokeStyle = CFG.isDark ? "rgba(244, 198, 92, 0.42)" : "rgba(232, 194, 112, 0.55)";
            ctx.lineWidth = 1.25;
            ctx.stroke();
          }

          const s = ts * (isEmbedded ? 0.90 : 0.88);
          const washR = s * 0.54;
          const wash = ctx.createRadialGradient(cx, cy, 2, cx, cy, washR);
          wash.addColorStop(0, "rgba(255, 238, 174, 0.56)");
          wash.addColorStop(0.55, "rgba(245, 196, 82, 0.16)");
          wash.addColorStop(1, "rgba(245, 196, 82, 0)");
          ctx.fillStyle = wash;
          ctx.beginPath(); ctx.arc(cx, cy, washR, 0, Math.PI * 2); ctx.fill();

          const glow = ctx.createRadialGradient(cx, cy, 1.5, cx, cy, s * 0.62 * pulse);
          glow.addColorStop(0, "rgba(255, 232, 146, 0.86)");
          glow.addColorStop(0.55, "rgba(236, 178, 62, 0.24)");
          glow.addColorStop(1, "rgba(236, 178, 62, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath(); ctx.arc(cx, cy, s * 0.62 * pulse, 0, Math.PI * 2); ctx.fill();

          ctx.save();
          ctx.translate(cx, cy); ctx.rotate(elapsed * 0.7);
          ctx.strokeStyle = "#DF9F32"; ctx.lineWidth = Math.max(1.5, s * 0.036);
          ctx.beginPath(); ctx.arc(0, 0, s * 0.31, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = "#E8A838";
          const dotR = Math.max(1.4, s * 0.036);
          for (let i = 0; i < 8; i++) {
            const a = (Math.PI * 2 * i) / 8;
            ctx.beginPath(); ctx.arc(Math.cos(a) * s * 0.37, Math.sin(a) * s * 0.37, dotR, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();

          const orbR = s * 0.21;
          const orbGrad = ctx.createRadialGradient(cx - 1.5, cy - 1.5, 1, cx, cy, orbR);
          orbGrad.addColorStop(0, "#FFFFFF"); orbGrad.addColorStop(0.65, "#FFF2BA"); orbGrad.addColorStop(1, "#E8A838");
          ctx.fillStyle = orbGrad;
          ctx.beginPath(); ctx.arc(cx, cy, orbR * pulse, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        function drawLantern(ctx, x, y, ts, elapsed) {
          const cx = x + ts / 2, cy = y + ts / 2, baseR = ts * CFG.toolRadius, pulse = 1 + Math.sin(elapsed * 3) * 0.05;
          castShadowCircle(ctx, cx, cy, baseR, ts * CFG.shadowLen * 0.68, 0.16);
          const halo = ctx.createRadialGradient(cx, cy, 2, cx, cy, ts * 0.54 * pulse);
          halo.addColorStop(0, "rgba(255, 232, 140, 0.68)"); halo.addColorStop(1, "rgba(255, 210, 96, 0)");
          ctx.fillStyle = halo;
          ctx.beginPath(); ctx.arc(cx, cy, ts * 0.54 * pulse, 0, Math.PI * 2); ctx.fill();

          const stoneG = ctx.createLinearGradient(cx - baseR, cy - baseR, cx + baseR, cy + baseR);
          stoneG.addColorStop(0, "#FCFBF8"); stoneG.addColorStop(0.6, "#EAE4DA"); stoneG.addColorStop(1, "#D5CEC0");
          ctx.beginPath(); ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
          ctx.fillStyle = stoneG; ctx.fill();
          ctx.strokeStyle = "rgba(176, 168, 154, 0.7)"; ctx.lineWidth = 1.2; ctx.stroke();

          ctx.beginPath(); ctx.arc(cx, cy, baseR * 0.76, 0, Math.PI * 2);
          ctx.strokeStyle = "#DDA23C"; ctx.lineWidth = 1.7; ctx.stroke();

          const coreGrad = ctx.createRadialGradient(cx - 1.5, cy - 1.5, 1, cx, cy, baseR * 0.5);
          coreGrad.addColorStop(0, "#FFFFFF"); coreGrad.addColorStop(0.65, "#FFF2B8"); coreGrad.addColorStop(1, "#E8A838");
          ctx.fillStyle = coreGrad;
          ctx.beginPath(); ctx.arc(cx, cy, baseR * 0.5 * pulse, 0, Math.PI * 2); ctx.fill();
        }

        function drawSpotlight(ctx, x, y, ts, kind, elapsed) {
          const cx = x + ts / 2, cy = y + ts / 2, baseR = ts * CFG.toolRadius;
          const ang = { ">": 0, "v": Math.PI / 2, "<": Math.PI, "^": -Math.PI / 2 }[kind] || 0;
          const pulse = 1 + Math.sin((elapsed || 0) * 2.6) * 0.04;
          castShadowCircle(ctx, cx, cy, baseR, ts * CFG.shadowLen * 0.68, 0.17);

          ctx.save();
          ctx.translate(cx, cy); ctx.rotate(ang);
          const cone = ctx.createRadialGradient(baseR * 0.35, 0, 2, baseR * 0.75, 0, ts * 0.44 * pulse);
          cone.addColorStop(0, "rgba(255, 232, 138, 0.74)");
          cone.addColorStop(0.6, "rgba(255, 214, 102, 0.20)");
          cone.addColorStop(1, "rgba(255, 214, 102, 0)");
          ctx.fillStyle = cone;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, ts * 0.44 * pulse, -0.52, 0.52); ctx.closePath(); ctx.fill();

          const shellG = ctx.createLinearGradient(-baseR, -baseR, baseR * 0.4, baseR);
          shellG.addColorStop(0, "#FCFBF8"); shellG.addColorStop(0.55, "#EAE4DA"); shellG.addColorStop(1, "#CFC7B8");
          ctx.beginPath(); ctx.arc(0, 0, baseR, 0, Math.PI * 2);
          ctx.fillStyle = shellG; ctx.fill();
          ctx.strokeStyle = "rgba(176, 168, 154, 0.72)"; ctx.lineWidth = 1.2; ctx.stroke();

          ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, baseR * 0.94, -0.56, 0.56); ctx.closePath();
          const cavityG = ctx.createLinearGradient(0, -baseR * 0.45, baseR, baseR * 0.45);
          cavityG.addColorStop(0, "#FFF7D4"); cavityG.addColorStop(0.55, "#F2C052"); cavityG.addColorStop(1, "#DC9A2D");
          ctx.fillStyle = cavityG; ctx.fill();

          ctx.beginPath(); ctx.arc(0, 0, baseR * 0.75, 0.82, Math.PI * 2 - 0.82);
          ctx.strokeStyle = "rgba(214, 162, 68, 0.78)"; ctx.lineWidth = 1.7; ctx.lineCap = "round"; ctx.stroke();

          const orbX = baseR * 0.24, orbR = baseR * 0.36 * pulse;
          const orbG = ctx.createRadialGradient(orbX - 1.5, -1.5, 1, orbX, 0, orbR);
          orbG.addColorStop(0, "#FFFFFF"); orbG.addColorStop(0.62, "#FFF2B5"); orbG.addColorStop(1, "#E5A032");
          ctx.beginPath(); ctx.arc(orbX, 0, orbR, 0, Math.PI * 2); ctx.fillStyle = orbG; ctx.fill();
          ctx.restore();
        }

        function drawMirror(ctx, x, y, ts, kind, isHit) {
          const cx = x + ts / 2, cy = y + ts / 2, baseR = ts * CFG.toolRadius;
          castShadowCircle(ctx, cx, cy, baseR, ts * CFG.shadowLen * 0.68, 0.16);
          const stoneG = ctx.createLinearGradient(cx - baseR, cy - baseR, cx + baseR, cy + baseR);
          stoneG.addColorStop(0, "#FCFBF8"); stoneG.addColorStop(0.6, "#EAE4DA"); stoneG.addColorStop(1, "#D5CEC0");
          ctx.beginPath(); ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
          ctx.fillStyle = stoneG; ctx.fill();
          ctx.strokeStyle = isHit ? "#E8A838" : "rgba(176, 168, 154, 0.7)";
          ctx.lineWidth = isHit ? 1.9 : 1.2; ctx.stroke();

          const len = baseR * 0.66;
          const x1 = kind === "\\" ? cx - len : cx + len, y1 = cy - len;
          const x2 = kind === "\\" ? cx + len : cx - len, y2 = cy + len;
          ctx.save();
          ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          ctx.strokeStyle = "#DDA23C"; ctx.lineWidth = Math.max(5.2, baseR * 0.34); ctx.stroke();
          if (isHit) { ctx.shadowColor = "rgba(185, 242, 255, 0.92)"; ctx.shadowBlur = 8; }
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          ctx.strokeStyle = isHit ? "#FFFFFF" : "#A6E2FC"; ctx.lineWidth = Math.max(2.6, baseR * 0.17); ctx.stroke();
          ctx.restore();
        }

        function drawBeams(ctx, bx, by, ts, beams, elapsed = 0) {
          if (!beams || !beams.length) return;
          const isDark = CFG.isDark;
          const breath = 1 + Math.sin(elapsed * 1.45) * 0.075;
          const baseOuterA = (isDark ? 0.36 : 0.32) * breath;
          const baseCoreA = (isDark ? 0.56 : 0.42) * breath;
          const halfOuter = ts * (isDark ? 0.29 : 0.26);
          const halfCore = ts * 0.072;

          ctx.save();
          if (isDark) ctx.globalCompositeOperation = "lighter";

          // L1 · 连续柔羽呼吸光带（支持平滑透光强度与无硬切柔羽尾端）
          beams.forEach(b => {
            const inten = typeof b.intensity === "number" ? b.intensity : 1;
            if (inten <= 0.02) return;
            const x1 = bx + (b.c1 + 0.5) * ts, y1 = by + (b.r1 + 0.5) * ts;
            const x2 = bx + (b.c2 + 0.5) * ts, y2 = by + (b.r2 + 0.5) * ts;
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.hypot(dx, dy);
            if (len < 1) return;
            const ang = Math.atan2(dy, dx);
            const outerA = baseOuterA * inten;
            const coreA = baseCoreA * inten;

            ctx.save();
            ctx.translate(x1, y1);
            ctx.rotate(ang);

            const og = ctx.createLinearGradient(0, -halfOuter, 0, halfOuter);
            og.addColorStop(0, `rgba(${CFG.beamOuterRgb}, 0)`);
            og.addColorStop(0.28, `rgba(${CFG.beamOuterRgb}, ${outerA * 0.58})`);
            og.addColorStop(0.5, `rgba(${CFG.beamOuterRgb}, ${outerA})`);
            og.addColorStop(0.72, `rgba(${CFG.beamOuterRgb}, ${outerA * 0.58})`);
            og.addColorStop(1, `rgba(${CFG.beamOuterRgb}, 0)`);

            const cg = ctx.createLinearGradient(0, -halfCore, 0, halfCore);
            cg.addColorStop(0, `rgba(${CFG.beamCoreRgb}, 0)`);
            cg.addColorStop(0.5, `rgba(${CFG.beamCoreRgb}, ${coreA})`);
            cg.addColorStop(1, `rgba(${CFG.beamCoreRgb}, 0)`);

            const needsFeather = b.endType === "blocker" || b.endType === "edge";
            if (!needsFeather) {
              ctx.fillStyle = og;
              ctx.fillRect(0, -halfOuter, len, halfOuter * 2);
              ctx.fillStyle = cg;
              ctx.fillRect(0, -halfCore, len, halfCore * 2);
            } else {
              // 主体直抵柔和收口前缘，尾端用 6 段顺滑衰减代替硬切矩形（零 destination-out 穿帮）
              const tipLen = Math.min(len, ts * (b.endType === "edge" ? 0.44 : 0.28));
              const bodyEnd = b.endType === "edge"
                ? Math.max(0, len - tipLen)
                : Math.max(0, len - tipLen * 0.52);

              if (bodyEnd > 0.5) {
                ctx.fillStyle = og;
                ctx.fillRect(0, -halfOuter, bodyEnd, halfOuter * 2);
                ctx.fillStyle = cg;
                ctx.fillRect(0, -halfCore, bodyEnd, halfCore * 2);
              }
              const steps = 6;
              const sliceW = tipLen / steps;
              for (let s = 0; s < steps; s++) {
                const a = Math.pow(1 - (s + 0.5) / steps, 1.45);
                const sx = bodyEnd + s * sliceW;
                ctx.globalAlpha = a;
                ctx.fillStyle = og;
                ctx.fillRect(sx, -halfOuter, sliceW + 0.6, halfOuter * 2);
                ctx.fillStyle = cg;
                ctx.fillRect(sx, -halfCore, sliceW + 0.6, halfCore * 2);
              }
              ctx.globalAlpha = 1;
            }
            ctx.restore();
          });

          ctx.restore();
        }

        function drawOcclusionShadows(ctx, bx, by, ts, blockers) {
          if (!blockers || !blockers.length) return;
          ctx.save();
          blockers.forEach(b => {
            const occA = typeof b.alpha === "number" ? b.alpha : 1;
            if (occA <= 0.03) return;
            const cr = typeof b.vr === "number" ? b.vr : b.r;
            const cc = typeof b.vc === "number" ? b.vc : b.c;
            const cx = bx + (cc + 0.5) * ts, cy = by + (cr + 0.5) * ts;
            const baseLen = ts * 0.9;
            const halfW = ts * (b.kind === "V" ? 0.37 : b.kind === "P" ? 0.25 : 0.31);
            const baseAlpha = (CFG.isDark ? 0.28 : 0.16) * occA;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(Math.atan2(b.dr, b.dc));

            const layers = [
              { wStart: halfW * 0.84, wEnd: halfW * 1.18, len: baseLen * 0.76, a: baseAlpha * 0.62 },
              { wStart: halfW * 0.96, wEnd: halfW * 1.38, len: baseLen * 0.92, a: baseAlpha * 0.36 },
              { wStart: halfW * 1.08, wEnd: halfW * 1.56, len: baseLen * 1.06, a: baseAlpha * 0.18 }
            ];

            layers.forEach(l => {
              const g = ctx.createLinearGradient(0, 0, l.len, 0);
              g.addColorStop(0, `rgba(${CFG.shadowRgb}, ${l.a})`);
              g.addColorStop(0.55, `rgba(${CFG.shadowRgb}, ${l.a * 0.42})`);
              g.addColorStop(1, `rgba(${CFG.shadowRgb}, 0)`);
              ctx.fillStyle = g;
              ctx.beginPath();
              ctx.moveTo(0, -l.wStart);
              ctx.lineTo(l.len, -l.wEnd);
              ctx.quadraticCurveTo(l.len + ts * 0.08, 0, l.len, l.wEnd);
              ctx.lineTo(0, l.wStart);
              ctx.closePath();
              ctx.fill();
            });

            ctx.restore();
          });
          ctx.restore();
        }

        function drawLitRims(ctx, bx, by, ts, blockers) {
          if (!blockers || !blockers.length) return;
          // 迎光面极克制光学漫反射暖晕（随遮挡平滑淡入淡出）
          ctx.save();
          blockers.forEach(b => {
            const occA = typeof b.alpha === "number" ? b.alpha : 1;
            if (occA <= 0.03) return;
            const cr = typeof b.vr === "number" ? b.vr : b.r;
            const cc = typeof b.vc === "number" ? b.vc : b.c;
            const cx = bx + (cc + 0.5) * ts, cy = by + (cr + 0.5) * ts;
            const half = b.kind === "P" ? ts * 0.27
              : (b.kind === "L" || GameEngine.SPOT_DIRS[b.kind]) ? ts * CFG.toolRadius
              : (b.kind === "V" ? ts * 0.40 : ts * CFG.boxScale * 0.48);
            const ex = cx - b.dc * half, ey = cy - b.dr * half;
            const ang = Math.atan2(b.dr, b.dc);
            const radX = ts * 0.13, radY = half * 0.82;

            ctx.save();
            ctx.translate(ex, ey);
            ctx.rotate(ang);
            ctx.scale(radX, radY);
            const g = ctx.createRadialGradient(0, 0, 0.05, 0, 0, 1);
            g.addColorStop(0, `rgba(255, 246, 206, ${(CFG.isDark ? 0.34 : 0.26) * occA})`);
            g.addColorStop(0.55, `rgba(255, 224, 134, ${(CFG.isDark ? 0.14 : 0.10) * occA})`);
            g.addColorStop(1, "rgba(255, 224, 134, 0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });
          ctx.restore();
        }

        function drawHero(ctx, x, y, ts, dir, hop, heroId = "traveler", bumpDx = 0, bumpDy = 0, elapsed = 0, pushSquash = 0, pushDr = 0, pushDc = 0) {
          const cx = x + ts / 2 + bumpDx, cy = y + ts / 2 + bumpDy;
          const breathe = 1 + Math.sin(elapsed * 2.25) * 0.022;
          const hopScale = 1 + Math.sin(hop * Math.PI) * 0.13;
          const hopLift = Math.sin(hop * Math.PI) * ts * 0.095;
          const sq = Math.sin(pushSquash * Math.PI) * 0.13;
          const sx = (pushDc !== 0 ? 1 - sq : 1 + sq * 0.65) * hopScale * breathe;
          const sy = (pushDr !== 0 ? 1 - sq : 1 + sq * 0.65) * hopScale * breathe;
          castShadowCircle(ctx, cx, cy, ts * 0.28, ts * CFG.shadowLen * 0.65 + hopLift * 0.5, 0.18);

          ctx.save();
          ctx.translate(cx, cy - hopLift);
          ctx.scale(sx, sy);

          const rOut = ts * 0.28;
          let eyeColor = "#262932";

          if (heroId === "celadon") {
            // 影青玉：宋代影青瓷外圈 + 细鎏金丝线 + 深翠玉核 + 象牙白双目
            const glazeG = ctx.createRadialGradient(-rOut * 0.25, -rOut * 0.25, rOut * 0.08, 0, 0, rOut * 1.18);
            glazeG.addColorStop(0, "#ECF7F3");
            glazeG.addColorStop(0.65, "#C8E0D9");
            glazeG.addColorStop(1, "#A4C6BE");
            ctx.beginPath(); ctx.arc(0, 0, rOut, 0, Math.PI * 2);
            ctx.fillStyle = glazeG; ctx.fill();
            ctx.strokeStyle = "#7EA49C"; ctx.lineWidth = 1.45; ctx.stroke();

            const rCore = ts * 0.205;
            const jadeG = ctx.createRadialGradient(-rCore * 0.26, -rCore * 0.26, rCore * 0.06, 0, 0, rCore * 1.2);
            jadeG.addColorStop(0, "#6CA89E");
            jadeG.addColorStop(0.55, "#407A72");
            jadeG.addColorStop(1, "#2A5854");
            ctx.beginPath(); ctx.arc(0, 0, rCore, 0, Math.PI * 2);
            ctx.fillStyle = jadeG; ctx.fill();
            ctx.strokeStyle = "rgba(232, 208, 148, 0.74)"; ctx.lineWidth = 1.2; ctx.stroke();

            // 极克制玉面弧形釉光
            ctx.beginPath();
            ctx.arc(0, 0, rCore * 0.76, Math.PI * 1.14, Math.PI * 1.47);
            ctx.strokeStyle = "rgba(235, 252, 248, 0.45)";
            ctx.lineWidth = Math.max(1.2, ts * 0.022);
            ctx.lineCap = "round";
            ctx.stroke();
            eyeColor = "#F4FCF8";
          } else if (heroId === "glacier") {
            // 霜晶琉璃：R1 同源通透冰川琉璃珠 + 底部焦散光 + 顶部月牙反光 + 冰海深蓝双目
            const iceG = ctx.createRadialGradient(-rOut * 0.24, -rOut * 0.26, rOut * 0.06, 0, 0, rOut * 1.2);
            iceG.addColorStop(0, "#E6F9FF");
            iceG.addColorStop(0.45, "#8ED7F8");
            iceG.addColorStop(0.84, "#4AA6DC");
            iceG.addColorStop(1, "#3286C0");
            ctx.beginPath(); ctx.arc(0, 0, rOut, 0, Math.PI * 2);
            ctx.fillStyle = iceG; ctx.fill();

            ctx.save();
            ctx.beginPath(); ctx.arc(0, 0, rOut, 0, Math.PI * 2); ctx.clip();
            const caustic = ctx.createRadialGradient(rOut * 0.24, rOut * 0.44, 1, rOut * 0.22, rOut * 0.40, rOut * 0.82);
            caustic.addColorStop(0, "rgba(226, 252, 255, 0.68)");
            caustic.addColorStop(0.5, "rgba(162, 234, 255, 0.22)");
            caustic.addColorStop(1, "rgba(162, 234, 255, 0)");
            ctx.fillStyle = caustic;
            ctx.fillRect(-rOut, -rOut, rOut * 2, rOut * 2);

            const rDome = ts * 0.185;
            const domeG = ctx.createRadialGradient(-rDome * 0.22, -rDome * 0.28, 1, 0, 0, rDome * 1.18);
            domeG.addColorStop(0, "rgba(255, 255, 255, 0.92)");
            domeG.addColorStop(0.62, "rgba(226, 247, 255, 0.76)");
            domeG.addColorStop(1, "rgba(168, 224, 250, 0.45)");
            ctx.beginPath(); ctx.arc(0, 0, rDome, 0, Math.PI * 2);
            ctx.fillStyle = domeG; ctx.fill();
            ctx.restore();

            ctx.beginPath(); ctx.arc(0, 0, rOut, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(238, 251, 255, 0.92)"; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, rOut + 0.5, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(72, 158, 212, 0.65)"; ctx.lineWidth = 0.85; ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, rOut * 0.76, Math.PI * 1.14, Math.PI * 1.52);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.86)";
            ctx.lineWidth = Math.max(1.4, ts * 0.026);
            ctx.lineCap = "round";
            ctx.stroke();
            eyeColor = "#184060";
          } else if (heroId === "star") {
            ctx.beginPath(); ctx.arc(0, 0, rOut, 0, Math.PI * 2);
            ctx.fillStyle = "#2E3A58"; ctx.fill();
            ctx.strokeStyle = "#F0C050"; ctx.lineWidth = 1.6; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.19, 0, Math.PI * 2);
            ctx.fillStyle = "#1E273D"; ctx.fill();
            eyeColor = "#FFE48A";
          } else {
            ctx.beginPath(); ctx.arc(0, 0, rOut, 0, Math.PI * 2);
            ctx.fillStyle = "#FCFBF8"; ctx.fill();
            ctx.strokeStyle = "#DED7CA"; ctx.lineWidth = 1.4; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.21, 0, Math.PI * 2);
            ctx.fillStyle = "#D96552"; ctx.fill();
            const headGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, ts * 0.17);
            headGrad.addColorStop(0, "#FFFFFF"); headGrad.addColorStop(1, "#EDE7DC");
            ctx.fillStyle = headGrad;
            ctx.beginPath(); ctx.arc(0, 0, ts * 0.17, 0, Math.PI * 2); ctx.fill();
            eyeColor = "#262932";
          }

          const gaze = { up: [0, -ts * 0.08], down: [0, ts * 0.08], left: [-ts * 0.08, 0], right: [ts * 0.08, 0] }[dir] || [ts * 0.08, 0];
          const perp = (dir === "up" || dir === "down") ? [[-ts * 0.055, 0], [ts * 0.055, 0]] : [[0, -ts * 0.055], [0, ts * 0.055]];
          ctx.fillStyle = eyeColor;
          perp.forEach(([px, py]) => {
            ctx.beginPath(); ctx.arc(gaze[0] + px, gaze[1] + py, Math.max(1.8, ts * 0.032), 0, Math.PI * 2); ctx.fill();
          });
          ctx.restore();
        }

        function drawGuideArrow(ctx, x, y, ts, dr, dc, elapsed) {
          const shift = Math.sin(elapsed * 4.8) * ts * 0.08;
          const alpha = 0.56 + 0.36 * (0.5 + 0.5 * Math.sin(elapsed * 4.8));
          const ang = Math.atan2(dr, dc), arm = ts * 0.13;
          ctx.save();
          ctx.translate(x + ts * 0.5 + dc * (ts * 0.46 + shift), y + ts * 0.5 + dr * (ts * 0.46 + shift));
          ctx.rotate(ang);
          ctx.strokeStyle = `rgba(229, 164, 53, ${alpha})`;
          ctx.lineWidth = Math.max(2.4, ts * 0.045);
          ctx.lineCap = "round"; ctx.lineJoin = "round";
          ctx.shadowColor = "rgba(229, 164, 53, 0.45)"; ctx.shadowBlur = 6;
          [-arm * 0.65, arm * 0.45].forEach((dx, idx) => {
            ctx.globalAlpha = idx === 0 ? alpha * 0.55 : alpha;
            ctx.beginPath();
            ctx.moveTo(dx - arm * 0.65, -arm * 0.78);
            ctx.lineTo(dx + arm * 0.35, 0);
            ctx.lineTo(dx - arm * 0.65, arm * 0.78);
            ctx.stroke();
          });
          ctx.restore();
        }

        function drawGoalRipple(ctx, x, y, ts, prog, isVictory = false, isPlatinum = false) {
          const base = ts * CFG.boxScale, grow = ts * (isVictory ? 0.44 : 0.24) * prog;
          const size = base + grow * 2, ox = x + (ts - size) / 2, oy = y + (ts - size) / 2;
          const r = ts * 0.13 + grow * 0.35;
          ctx.save();
          ctx.globalAlpha = (1 - prog) * (isVictory ? 0.88 : 0.72);
          ctx.strokeStyle = isPlatinum ? "#8ED8FF" : (isVictory ? "#FFE58A" : "#F2BC49");
          ctx.lineWidth = (isVictory ? 3 : 2.2) * (1 - prog * 0.5);
          ctx.shadowColor = isPlatinum ? "rgba(128, 212, 255, 0.85)" : "rgba(244, 186, 68, 0.7)";
          ctx.shadowBlur = 11 * (1 - prog);
          roundRect(ctx, ox, oy, size, size, r);
          ctx.stroke();

          if (isPlatinum) {
            const innerProg = Math.max(0, prog - 0.12) / 0.88;
            if (innerProg > 0) {
              const g2 = ts * 0.24 * innerProg;
              const s2 = base + g2 * 2, ox2 = x + (ts - s2) / 2, oy2 = y + (ts - s2) / 2;
              ctx.globalAlpha = (1 - innerProg) * 0.82;
              ctx.strokeStyle = "#FFE694";
              ctx.lineWidth = 2.2 * (1 - innerProg * 0.5);
              roundRect(ctx, ox2, oy2, s2, s2, ts * 0.13 + g2 * 0.35);
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        function drawWalkTarget(ctx, x, y, ts, elapsed) {
          const cx = x + ts / 2, cy = y + ts / 2, p = (elapsed * 1.4) % 1;
          ctx.save();
          ctx.beginPath(); ctx.arc(cx, cy, ts * (0.14 + p * 0.22), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(229, 164, 53, ${(1 - p) * 0.7})`;
          ctx.lineWidth = 1.8; ctx.stroke();
          ctx.restore();
        }

        function drawTouchFeedback(ctx, fb) {
          if (!fb || !fb.active) return;
          const totalDrag = Math.hypot(fb.curX - fb.downX, fb.curY - fb.downY);
          if (!fb.didSwipe && totalDrag < 10) return;
          const dx = fb.curX - fb.anchorX, dy = fb.curY - fb.anchorY;
          const dist = Math.hypot(dx, dy), maxR = 26;
          const clampedX = fb.anchorX + (dist > maxR ? (dx / dist) * maxR : dx);
          const clampedY = fb.anchorY + (dist > maxR ? (dy / dist) * maxR : dy);
          ctx.save();
          ctx.beginPath(); ctx.arc(fb.anchorX, fb.anchorY, 24, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(229, 164, 53, 0.42)"; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = "rgba(255, 243, 212, 0.22)"; ctx.fill();
          ctx.beginPath(); ctx.arc(clampedX, clampedY, 8, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(229, 164, 53, 0.78)"; ctx.fill();
          ctx.restore();
        }

        return {
          CFG, applyTheme, lerpHex, castShadowRect,
          drawIslandBase, drawWall, drawGoal, drawIceWallPool, drawAmberWallDormant, drawDormantBoxPad,
          drawIceWall, drawAmberWall,
          drawWoodBox, drawIceBox, drawAmberBox, drawSunTower, drawLantern, drawSpotlight, drawMirror,
          drawBeams, drawOcclusionShadows, drawLitRims, drawHero,
          drawGuideArrow, drawGoalRipple, drawWalkTarget, drawTouchFeedback
        };
      })();

      /* =====================================================================
         6. 本地存档（12 卷 144 关纯净版）
         ===================================================================== */
      const STORAGE_KEY = "lumenbox_v1_progress";
      const progress = {
        records: {},
        hintsLeft: 3,
        lastIdx: 0,
        themeId: "morning",
        heroId: "traveler"
      };

      function getChapterSlots(cNum) {
        const chapLvls = LEVELS.filter(l => l.chapter === cNum);
        const usedIds = new Set();
        const slots = [];
        for (let s = 1; s <= SLOTS_PER_CHAPTER; s++) {
          let lvl = chapLvls.find(l => l.slot === s && !usedIds.has(l.id));
          if (!lvl) lvl = chapLvls.find(l => !l.slot && !usedIds.has(l.id));
          if (lvl) usedIds.add(lvl.id);
          slots.push({
            chapter: cNum,
            slot: s,
            code: lvl ? lvl.code : `${cNum}-${s}`,
            level: lvl || null
          });
        }
        return slots;
      }

      function getSlotRecord(slotItem) {
        return slotItem.level ? (progress.records[slotItem.level.id] || null) : null;
      }

      function loadProgress() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            if (p && typeof p === "object") {
              if (p.records && typeof p.records === "object") progress.records = p.records;
              if (typeof p.hintsLeft === "number") progress.hintsLeft = Math.max(0, Math.min(99, p.hintsLeft));
              if (typeof p.lastIdx === "number") progress.lastIdx = p.lastIdx;
              if (typeof p.themeId === "string" && THEMES.some(t => t.id === p.themeId)) progress.themeId = p.themeId;
              if (typeof p.heroId === "string") {
                const legacyHeroMap = { bamboo: "celadon", snow: "glacier" };
                const mappedHero = legacyHeroMap[p.heroId] || p.heroId;
                if (HERO_SKINS.some(h => h.id === mappedHero)) progress.heroId = mappedHero;
              }
            }
          }
        } catch (e) {}
      }

      function saveProgress() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
      }

      function getProgressTotals() {
        let clearedMain = 0;
        let plat = 0;
        CHAPTER_ORDER.forEach(cNum => {
          getChapterSlots(cNum).forEach(s => {
            const r = getSlotRecord(s);
            if (r && (r.cleared || r.bestSteps > 0)) clearedMain++;
            if (r && r.platinum) plat++;
          });
        });
        return { clearedMain, totalMain: CHAPTER_ORDER.length * SLOTS_PER_CHAPTER, plat };
      }

      function isLevelUnlocked(lvl) {
        if (!lvl) return false;
        if (DEV_FLAGS.unlockAllLevels || URL_TEST_UNLOCK) return true;
        const pos = LEVELS.indexOf(lvl);
        if (pos <= 1) return true;
        let maxCleared = -1;
        LEVELS.forEach((l, i) => {
          const r = progress.records[l.id];
          if (r && (r.cleared || r.bestSteps > 0)) maxCleared = i;
        });
        return pos <= maxCleared + 2;
      }

      function getNextLevelIdx(curIdx) {
        const cur = LEVELS[curIdx];
        if (!cur) return -1;
        // Prefer next sequential slot inside the same chapter first, otherwise next available chapter level
        const nextIdx = curIdx + 1;
        if (nextIdx < LEVELS.length) return nextIdx;
        return -1;
      }

      /* =====================================================================
         7. 游戏主状态、场景切换、粒子与移动逻辑
         ===================================================================== */
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const appStage = document.getElementById("appStage");

      const FALLBACK_COVER_MOVES = [
        [0, 1, "right"], [0, 1, "right"],
        [0, -1, "left"], [1, 0, "down"], [0, -1, "left"], [1, 0, "down"],
        [0, 1, "right"], [0, 1, "right"], [0, 1, "right"]
      ];
      let coverDemoMoves = FALLBACK_COVER_MOVES;
      let coverDemoKey = "";

      function resolveCoverDemoMoves(staticMap, dynState, mapKey) {
        if (coverDemoKey === mapKey && coverDemoMoves.length > 0) return coverDemoMoves;
        const solved = GameEngine.solveFromState(staticMap, dynState, 30000, 150);
        if (solved && solved.solved && solved.path.length > 0) {
          coverDemoMoves = solved.path.map(mv => [mv.dr, mv.dc, mv.dir]);
        } else {
          coverDemoMoves = FALLBACK_COVER_MOVES;
        }
        coverDemoKey = mapKey;
        return coverDemoMoves;
      }

      const game = {
        inCover: true,
        levelIdx: 0,
        staticMap: null,
        dyn: null,
        light: null,
        history: [],
        steps: 0,
        won: false,
        deadlock: false,
        deadlockTimer: null,
        boardIntro: 1,
        pVis: { vr: 0, vc: 0, hop: 0, bumpDr: 0, bumpDc: 0, bumpT: 0, pushSquash: 0, pushDr: 0, pushDc: 0 },
        eVis: new Map(),
        icePhase: [],
        amberPhase: [],
        floorLitAnim: [],
        goalLockAnim: [],
        goalLockBounce: [],
        particles: [],
        ripples: [],
        clearStarTimers: [],
        hintArrow: null,
        walkQueue: [],
        walkTarget: null,
        walkTimer: 0,
        demoIdx: 0,
        demoTimer: 0,
        viewW: 800,
        viewH: 600,
        ts: 64,
        bx: 0,
        by: 0
      };

      let toastTimer = null;
      function showToast(msg, dur = 2000) {
        clearTimeout(toastTimer);
        const el = document.getElementById("hintToast");
        el.textContent = msg;
        el.classList.add("show");
        toastTimer = setTimeout(() => el.classList.remove("show"), dur);
      }

      function clearStarRevealTimers() {
        game.clearStarTimers.forEach(t => clearTimeout(t));
        game.clearStarTimers = [];
      }

      let undoHoldDelay = null, undoHoldInterval = null;
      let dpadDelay = null, dpadInterval = null, dpadActivePointerId = null;

      function stopUndoHold() {
        clearTimeout(undoHoldDelay);
        clearInterval(undoHoldInterval);
        undoHoldDelay = null;
        undoHoldInterval = null;
      }

      function stopDpadHold() {
        clearTimeout(dpadDelay);
        clearInterval(dpadInterval);
        dpadDelay = null;
        dpadInterval = null;
        dpadActivePointerId = null;
      }

      function stopAllControlHolds() {
        stopUndoHold();
        stopDpadHold();
        if (typeof touchCtrl !== "undefined" && touchCtrl && touchCtrl.cancel) touchCtrl.cancel();
      }

      function hasOpenModal() {
        return ["clearOverlay", "chaptersOverlay", "themesOverlay"].some(id => {
          const el = document.getElementById(id);
          return el && el.classList.contains("open");
        });
      }

      function closeHintPopover() {
        const pop = document.getElementById("hintPopover");
        if (pop) pop.classList.remove("open");
      }

      function cancelAutoWalk() {
        game.walkQueue = [];
        game.walkTarget = null;
        game.walkTimer = 0;
      }

      function spawnPhaseParticles(r, c, color, shape = "ray") {
        for (let i = 0; i < 7; i++) {
          const a = (Math.PI * 2 * i) / 7 + Math.random() * 0.45;
          const spd = 0.0012 + Math.random() * 0.0016;
          game.particles.push({
            r: r + 0.5, c: c + 0.5,
            vr: Math.sin(a) * spd, vc: Math.cos(a) * spd,
            rot: a, vrot: (Math.random() - 0.5) * 0.008,
            color, shape, size: 2.5 + Math.random() * 2.1, life: 460, maxLife: 460
          });
        }
      }

      function resizeCanvas() {
        const rect = appStage.getBoundingClientRect();
        const w = Math.max(260, rect.width), h = Math.max(320, rect.height);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        game.viewW = w; game.viewH = h;
        canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (!game.staticMap) return;
        const dpadOpen = document.getElementById("dpadBox").classList.contains("open");
        const padX = Math.max(22, w * 0.06);
        const padTop = game.inCover ? 156 : 74;
        const padBot = game.inCover ? 156 : (dpadOpen ? Math.min(204, Math.round(h * 0.28)) : 92);
        const availW = Math.max(180, w - padX * 2);
        const availH = Math.max(160, h - padTop - padBot);
        const ts = Math.max(30, Math.min(78, Math.floor(Math.min(availW / game.staticMap.cols, availH / game.staticMap.rows))));
        game.ts = ts;
        game.bx = Math.round((w - game.staticMap.cols * ts) / 2);
        game.by = Math.round(padTop + (availH - game.staticMap.rows * ts) / 2);
      }

      function resetCoverDemo() {
        const parsed = GameEngine.parseMap(LEVELS[0].map);
        game.staticMap = parsed.staticMap;
        game.dyn = parsed.dynState;
        resolveCoverDemoMoves(game.staticMap, game.dyn, LEVELS[0].map.join("|"));
        game.light = GameEngine.computeLighting(game.staticMap, game.dyn, true);
        game.pVis = { vr: game.dyn.player.r, vc: game.dyn.player.c, hop: 0, bumpDr: 0, bumpDc: 0, bumpT: 0, pushSquash: 0, pushDr: 0, pushDc: 0 };
        game.eVis.clear();
        game.dyn.entities.forEach(e => game.eVis.set(e.id, {
          vr: e.r, vc: e.c, hover: 0,
          phase: GameEngine.isEntitySolid(game.dyn, game.light.lit, e) ? 1 : 0
        }));
        game.icePhase = game.staticMap.iceWalls.map(w => (!game.light.lit[w.r][w.c] ? 1 : 0));
        game.amberPhase = game.staticMap.treeWalls.map(w => (game.light.lit[w.r][w.c] ? 1 : 0));
        game.floorLitAnim = Array.from({ length: game.staticMap.rows }, (_, r) =>
          Array.from({ length: game.staticMap.cols }, (_, c) => (game.light.lit[r][c] ? 1 : 0))
        );
        game.goalLockAnim = game.staticMap.goals.map(() => 0);
        game.goalLockBounce = game.staticMap.goals.map(() => 0);
        game.boardIntro = 1;
        game.demoIdx = 0;
        game.demoTimer = 0;
        game.particles = [];
        game.ripples = [];
        cancelAutoWalk();
        resizeCanvas();
      }

      function enterCover() {
        game.inCover = true;
        stopAllControlHolds();
        cancelAutoWalk();
        clearTimeout(game.deadlockTimer);
        clearStarRevealTimers();
        document.body.classList.add("in-cover");
        document.getElementById("clearOverlay").classList.remove("open");
        document.getElementById("hintPopover").classList.remove("open");
        updateCoverStats();
        resetCoverDemo();
      }

      function exitCover(targetIdx) {
        game.inCover = false;
        document.body.classList.remove("in-cover");
        loadLevel(typeof targetIdx === "number" ? targetIdx : progress.lastIdx);
      }

      function updateCoverStats() {
        const { clearedMain, totalMain, plat } = getProgressTotals();
        document.getElementById("statCleared").textContent = clearedMain;
        document.getElementById("statTotalMain").textContent = totalMain;
        document.getElementById("statPlat").textContent = plat;
        const hasProgress = Object.keys(progress.records).length > 0;
        const safeIdx = Math.max(0, Math.min(LEVELS.length - 1, progress.lastIdx));
        document.getElementById("btnStartGame").textContent = hasProgress ? `继续 ${LEVELS[safeIdx].code}` : "开始";
      }

      function loadLevel(idx) {
        const safeIdx = Math.max(0, Math.min(LEVELS.length - 1, idx));
        game.levelIdx = safeIdx;
        progress.lastIdx = safeIdx;
        saveProgress();

        stopAllControlHolds();
        clearTimeout(game.deadlockTimer);
        clearStarRevealTimers();
        cancelAutoWalk();

        const lvl = LEVELS[safeIdx];
        const parsed = GameEngine.parseMap(lvl.map);
        game.staticMap = parsed.staticMap;
        game.dyn = parsed.dynState;
        game.light = GameEngine.computeLighting(game.staticMap, game.dyn, true);
        game.history = [];
        game.steps = 0;
        game.won = false;
        game.deadlock = false;
        game.boardIntro = 0;
        game.hintArrow = null;
        game.particles = [];
        game.ripples = [];

        game.pVis = { vr: game.dyn.player.r, vc: game.dyn.player.c, hop: 0, bumpDr: 0, bumpDc: 0, bumpT: 0, pushSquash: 0, pushDr: 0, pushDc: 0 };
        game.eVis.clear();
        game.dyn.entities.forEach(e => game.eVis.set(e.id, {
          vr: e.r, vc: e.c, hover: 0,
          phase: GameEngine.isEntitySolid(game.dyn, game.light.lit, e) ? 1 : 0
        }));
        game.icePhase = game.staticMap.iceWalls.map(w =>
          (!game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c)) ? 1 : 0
        );
        game.amberPhase = game.staticMap.treeWalls.map(w =>
          (game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c)) ? 1 : 0
        );
        game.floorLitAnim = Array.from({ length: game.staticMap.rows }, (_, r) =>
          Array.from({ length: game.staticMap.cols }, (_, c) => (game.light.lit[r][c] ? 1 : 0))
        );
        game.goalLockAnim = game.staticMap.goals.map(() => 0);
        game.goalLockBounce = game.staticMap.goals.map(() => 0);

        document.getElementById("clearOverlay").classList.remove("open");
        document.getElementById("chaptersOverlay").classList.remove("open");
        document.getElementById("themesOverlay").classList.remove("open");
        document.getElementById("hintPopover").classList.remove("open");

        resizeCanvas();

        if (game.inCover) return;
        stopAllControlHolds();
        closeHintPopover();
        if (game.won) {
          audio.ensure();
          audio.undo();
          loadLevel(game.levelIdx);
          return;
        }
        if (game.steps === 0) {
          audio.ensure();
          if (game.history.length > 0) {
            showToast("已在初始位置 · 点悔棋可还原重置前", 1800);
          } else {
            showToast("已在初始位置", 1200);
          }
          return;
        }
        clearTimeout(game.deadlockTimer);
        cancelAutoWalk();
        audio.ensure();
        audio.undo();

        game.history.push({ dyn: GameEngine.cloneDyn(game.dyn), steps: game.steps });
        const parsed = GameEngine.parseMap(LEVELS[game.levelIdx].map);
        game.dyn = parsed.dynState;
        game.light = GameEngine.computeLighting(game.staticMap, game.dyn, true);
        game.steps = 0;
        game.won = false;
        game.deadlock = false;
        game.hintArrow = null;
        game.particles = [];
        game.ripples = [];
        game.boardIntro = 0.25;
        game.pVis = { vr: game.dyn.player.r, vc: game.dyn.player.c, hop: 0, bumpDr: 0, bumpDc: 0, bumpT: 0, pushSquash: 0, pushDr: 0, pushDc: 0 };
        game.eVis.clear();
        game.dyn.entities.forEach(e => game.eVis.set(e.id, {
          vr: e.r, vc: e.c, hover: 0,
          phase: GameEngine.isEntitySolid(game.dyn, game.light.lit, e) ? 1 : 0
        }));

      function countLockedGoals() {
        let cnt = 0;
        game.staticMap.goals.forEach(g => {
          const e = GameEngine.solidEntityAt(game.dyn, game.light.lit, g.r, g.c);
          if (e && GameEngine.TARGET_BOXES.has(e.kind)) cnt++;
        });
        return cnt;
      }

      function hasAnySuppression(staticMap, dyn, lit) {
        for (let i = 0; i < staticMap.iceWalls.length; i++) {
          const w = staticMap.iceWalls[i];
          if (!lit[w.r][w.c] && GameEngine.isTerrainSuppressed(dyn, lit, w.r, w.c)) return true;
        }
        for (let i = 0; i < staticMap.treeWalls.length; i++) {
          const w = staticMap.treeWalls[i];
          if (lit[w.r][w.c] && GameEngine.isTerrainSuppressed(dyn, lit, w.r, w.c)) return true;
        }
        for (let i = 0; i < dyn.entities.length; i++) {
          const e = dyn.entities[i];
          if (e.kind === "C" && !lit[e.r][e.c] && GameEngine.isEntitySuppressed(dyn, e)) return true;
          if (e.kind === "F" && lit[e.r][e.c] && GameEngine.isEntitySuppressed(dyn, e)) return true;
        }
        return false;
      }

      function scheduleDeadlockCheck() {
        clearTimeout(game.deadlockTimer);
        game.deadlock = false;
        const snapStatic = game.staticMap;
        const snapDyn = GameEngine.cloneDyn(game.dyn);
        const snapStep = game.steps;
        game.deadlockTimer = setTimeout(() => {
          if (game.inCover || game.won || game.steps !== snapStep) return;
          game.deadlock = GameEngine.checkDeadlock(snapStatic, snapDyn, 6);
          updateHUD();
        }, 85);
      }

      function move(dr, dc, dir, fromAutoWalk = false) {
        if (game.inCover || game.won || hasOpenModal()) return false;
        if (!fromAutoWalk) {
          cancelAutoWalk();
          closeHintPopover();
        }
        audio.ensure();
        game.dyn.player.dir = dir;
        game.hintArrow = null;

        if (fromAutoWalk) {
          const nr = game.dyn.player.r + dr, nc = game.dyn.player.c + dc;
          if (GameEngine.solidEntityAt(game.dyn, game.light.lit, nr, nc)) {
            cancelAutoWalk();
            return false;
          }
        }

        const prevLockedFlags = game.staticMap.goals.map(g => {
          const e = GameEngine.solidEntityAt(game.dyn, game.light.lit, g.r, g.c);
          return Boolean(e && GameEngine.TARGET_BOXES.has(e.kind));
        });
        const prevLocked = prevLockedFlags.filter(Boolean).length;
        const hadSup = hasAnySuppression(game.staticMap, game.dyn, game.light.lit);
        const prevIceSolid = game.staticMap.iceWalls.map(w => !game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c));
        const prevAmberSolid = game.staticMap.treeWalls.map(w => game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c));
        const prevBoxPhase = new Map();
        game.dyn.entities.forEach(e => {
          if (e.kind === "C" || e.kind === "F") prevBoxPhase.set(e.id, GameEngine.isEntitySolid(game.dyn, game.light.lit, e));
        });

        const res = GameEngine.stepState(game.staticMap, game.dyn, game.light.lit, dr, dc, dir);
        if (!res) {
          audio.blocked();
          game.pVis.bumpDr = dr; game.pVis.bumpDc = dc; game.pVis.bumpT = 1;
          return false;
        }

        game.history.push({ dyn: GameEngine.cloneDyn(game.dyn), steps: game.steps });
        game.dyn = res.dyn;
        game.light = GameEngine.computeLighting(game.staticMap, game.dyn, true);
        if (res.pushed) {
          game.pVis.pushSquash = 1; game.pVis.pushDr = dr; game.pVis.pushDc = dc;
          audio.push();
        } else {
          game.pVis.hop = 1;
          audio.step();
        }
        game.steps++;

        let melted = false, frozen = false;
        game.staticMap.iceWalls.forEach((w, i) => {
          const nowS = !game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c);
          if (prevIceSolid[i] !== nowS) {
            spawnPhaseParticles(w.r, w.c, nowS ? "#D8F4FF" : "#78CCF2", "ice");
            if (prevIceSolid[i] && !nowS) melted = true; else frozen = true;
          }
        });
        game.staticMap.treeWalls.forEach((w, i) => {
          const nowS = game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c);
          if (prevAmberSolid[i] !== nowS) {
            spawnPhaseParticles(w.r, w.c, nowS ? "#FFE28A" : "#E5A435", "amber");
            if (nowS) frozen = true; else melted = true;
          }
        });
        game.dyn.entities.forEach(e => {
          if (e.kind !== "C" && e.kind !== "F") return;
          const nowS = GameEngine.isEntitySolid(game.dyn, game.light.lit, e);
          if (prevBoxPhase.has(e.id) && prevBoxPhase.get(e.id) !== nowS) {
            spawnPhaseParticles(e.r, e.c, e.kind === "C" ? "#8ED8F8" : "#F5C45A", e.kind === "C" ? "ice" : "amber");
            if (nowS) frozen = true; else melted = true;
          }
        });

        const nowSup = hasAnySuppression(game.staticMap, game.dyn, game.light.lit);
        if (hadSup && !nowSup) audio.suppressPop();
        else if (melted) audio.melt();
        else if (frozen) audio.freeze();

        game.staticMap.goals.forEach((g, idx) => {
          const e = GameEngine.solidEntityAt(game.dyn, game.light.lit, g.r, g.c);
          const nowLocked = Boolean(e && GameEngine.TARGET_BOXES.has(e.kind));
          if (nowLocked && !prevLockedFlags[idx]) {
            game.goalLockBounce[idx] = 1;
            game.ripples.push({ r: g.r, c: g.c, life: 420, maxLife: 420, isVictory: false });
          }
        });

        if (GameEngine.isWon(game.staticMap, game.dyn, game.light.lit)) {
          game.won = true;
          game.deadlock = false;
          stopAllControlHolds();
          cancelAutoWalk();
          clearTimeout(game.deadlockTimer);
          updateHUD();
          onLevelCleared();
          return true;
        }

        const nowLocked = countLockedGoals();
        if (nowLocked > prevLocked) audio.lockNote(nowLocked);

        if (res.pushed) scheduleDeadlockCheck();
        else { clearTimeout(game.deadlockTimer); game.deadlock = false; }
        updateHUD();
        return true;
      }

      function undo() {
        if (game.inCover || !game.history.length || game.won || hasOpenModal()) return false;
        closeHintPopover();
        cancelAutoWalk();
        clearTimeout(game.deadlockTimer);
        audio.ensure();
        const prev = game.history.pop();
        game.dyn = prev.dyn;
        game.steps = prev.steps;
        game.light = GameEngine.computeLighting(game.staticMap, game.dyn, true);
        game.deadlock = false;
        game.hintArrow = null;
        audio.undo();
        updateHUD();
        scheduleDeadlockCheck();
        return true;
      }

          progress.hintsLeft = Math.min(5, progress.hintsLeft + 1);
