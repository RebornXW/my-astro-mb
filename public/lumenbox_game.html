      /* =====================================================================
         8. 微信同构触控实例 + 动态光路纯步行自动寻路
         ===================================================================== */
      function findDynamicWalkPath(staticMap, initDyn, targetR, targetC) {
        if (!initDyn || !initDyn.player) return null;
        const sr = initDyn.player.r, sc = initDyn.player.c;
        if (sr === targetR && sc === targetC) return [];
        const initLit = GameEngine.computeLighting(staticMap, initDyn, false).lit;
        const visited = new Set([`${sr},${sc}`]);
        const queue = [{ dyn: initDyn, lit: initLit, parent: -1, mv: null }];
        let head = 0;

        while (head < queue.length) {
          const cur = queue[head];
          for (let d = 0; d < GameEngine.DIRS4.length; d++) {
            const mv = GameEngine.DIRS4[d];
            const nr = cur.dyn.player.r + mv.dr, nc = cur.dyn.player.c + mv.dc;
            const key = `${nr},${nc}`;
            if (visited.has(key)) continue;
            if (GameEngine.solidEntityAt(cur.dyn, cur.lit, nr, nc)) continue;
            const res = GameEngine.stepState(staticMap, cur.dyn, cur.lit, mv.dr, mv.dc, mv.dir);
            if (!res || res.pushed) continue;
            visited.add(key);
            const idx = queue.length;
            queue.push({ dyn: res.dyn, lit: res.lit, parent: head, mv });
            if (nr === targetR && nc === targetC) {
              const path = [];
              let p = idx;
              while (p > 0) { path.push(queue[p].mv); p = queue[p].parent; }
              path.reverse();
              return path;
            }
          }
          head++;
        }
        return null;
      }

      const touchCtrl = TouchInputController.create({
        canAccept: () => !game.inCover && !game.won && !hasOpenModal(),
        onDirection: (dr, dc, dir) => { move(dr, dc, dir); },
        onTap: (x, y) => {
          if (!game.staticMap || !game.dyn.player) return;
          const c = Math.floor((x - game.bx) / game.ts);
          const r = Math.floor((y - game.by) / game.ts);
          if (r < 0 || r >= game.staticMap.rows || c < 0 || c >= game.staticMap.cols) return;

          const dr = r - game.dyn.player.r, dc = c - game.dyn.player.c;
          if (Math.abs(dr) + Math.abs(dc) === 1 && GameEngine.solidEntityAt(game.dyn, game.light.lit, r, c)) {
            const dir = dr === -1 ? "up" : dr === 1 ? "down" : dc === -1 ? "left" : "right";
            move(dr, dc, dir);
            return;
          }

          const path = findDynamicWalkPath(game.staticMap, game.dyn, r, c);
          if (path && path.length > 0) {
            audio.ensure();
            game.walkQueue = path;
            game.walkTarget = { r, c };
            game.walkTimer = 112;
          }
        }
      });

      /* =====================================================================
         9. 连续视觉光线追踪与主渲染循环（60fps）
         ===================================================================== */
      function computeVisualLight(staticMap, dyn, pVis, eVis, amberPhase) {
        const { rows, cols, walls, suns, treeWalls } = staticMap;
        const beams = [];
        const hitMirrors = new Set();
        const blockers = [];

        const isVisWallAt = (r, c) => r < 0 || r >= rows || c < 0 || c >= cols || walls[r][c] || suns.some(s => s.r === r && s.c === c);

        const getCellBlockers = (r, c, sourceR, sourceC, dr, dc) => {
          const list = [];
          const pr = pVis.vr, pc = pVis.vc;
          if (Math.abs(pr - r) < 0.85 && Math.abs(pc - c) < 0.85) {
            const along = (pr - sourceR) * dr + (pc - sourceC) * dc;
            const perp = Math.abs((pr - r) * dc - (pc - c) * dr);
            if (along > 0.25) {
              const alpha = Math.max(0, Math.min(1, (0.72 - perp) / 0.42));
              if (alpha > 0.03) list.push({ vr: pr, vc: pc, along, alpha, kind: "P", stopOffset: 0.24 });
            }
          }

          for (let i = 0; i < dyn.entities.length; i++) {
            const e = dyn.entities[i];
            if (e.kind === "C") continue;
            const vis = eVis.get(e.id);
            const er = vis ? vis.vr : e.r;
            const ec = vis ? vis.vc : e.c;
            if (Math.abs(er - r) >= 0.85 || Math.abs(ec - c) >= 0.85) continue;
            if (e.kind === "F" && GameEngine.isEntitySuppressed(dyn, e)) continue;

            const along = (er - sourceR) * dr + (ec - sourceC) * dc;
            if (along <= 0.25) continue;
            const perp = Math.abs((er - r) * dc - (ec - c) * dr);

            if (e.kind === "\\" || e.kind === "/") {
              const alpha = Math.max(0, Math.min(1, (0.68 - perp) / 0.40));
              if (alpha > 0.03) {
                list.push({
                  vr: er, vc: ec, along, alpha, kind: e.kind, stopOffset: 0,
                  isMirror: true, mirrorId: e.id, mirrorKind: e.kind
                });
              }
            } else {
              const phaseA = e.kind === "F" ? (vis ? vis.phase : 1) : 1;
              const geomA = Math.max(0, Math.min(1, (0.76 - perp) / 0.44));
              const alpha = phaseA * geomA;
              if (alpha > 0.03) {
                const stopOff = (e.kind === "L" || GameEngine.SPOT_DIRS[e.kind]) ? 0.28 : 0.34;
                list.push({ vr: er, vc: ec, along, alpha, kind: e.kind, stopOffset: stopOff });
              }
            }
          }

          const twIdx = treeWalls.findIndex(w => w.r === r && w.c === c);
          if (twIdx >= 0) {
            const along = (r - sourceR) * dr + (c - sourceC) * dc;
            const phaseA = amberPhase ? (amberPhase[twIdx] ?? 1) : 1;
            if (along > 0.25 && phaseA > 0.03) {
              list.push({ vr: r, vc: c, along, alpha: phaseA, kind: "V", stopOffset: 0.38 });
            }
          }

          list.sort((a, b) => a.along - b.along);
          return list;
        };

        function traceVis(sr, sc, dr, dc, depth, intensity) {
          if (depth > 14 || intensity <= 0.02) return;
          let r = Math.round(sr) + dr;
          let c = Math.round(sc) + dc;
          let curR = sr, curC = sc;
          let rem = intensity;

          while (r >= 0 && r < rows && c >= 0 && c < cols) {
            if (isVisWallAt(r, c)) {
              const endR = r - dr * 0.44;
              const endC = c - dc * 0.44;
              if ((endR - curR) * dr + (endC - curC) * dc > 0.02) {
                beams.push({ r1: curR, c1: curC, r2: endR, c2: endC, endType: "wall", intensity: rem });
              }
              return;
            }

            const cellObs = getCellBlockers(r, c, sr, sc, dr, dc);
            for (let i = 0; i < cellObs.length; i++) {
              const ob = cellObs[i];
              const hitR = ob.vr - dr * ob.stopOffset;
              const hitC = ob.vc - dc * ob.stopOffset;
              const passA = rem * ob.alpha;
              if (passA <= 0.02) continue;

              if ((hitR - curR) * dr + (hitC - curC) * dc > 0.01) {
                beams.push({
                  r1: curR, c1: curC, r2: hitR, c2: hitC,
                  endType: ob.isMirror ? "mirror" : "blocker",
                  intensity: passA
                });
              }

              if (ob.isMirror) {
                hitMirrors.add(ob.mirrorId);
                const ndr = ob.mirrorKind === "\\" ? dc : -dc;
                const ndc = ob.mirrorKind === "\\" ? dr : -dr;
                traceVis(ob.vr, ob.vc, ndr, ndc, depth + 1, passA);
              } else {
                blockers.push({ r, c, vr: ob.vr, vc: ob.vc, dr, dc, kind: ob.kind, alpha: passA });
              }

              rem *= (1 - ob.alpha);
              if (rem <= 0.02) return;
            }

            r += dr;
            c += dc;
          }

          const edgeR = r - dr * 0.5;
          const edgeC = c - dc * 0.5;
          if ((edgeR - curR) * dr + (edgeC - curC) * dc > 0.02) {
            beams.push({ r1: curR, c1: curC, r2: edgeR, c2: edgeC, endType: "edge", intensity: rem });
          }
        }

        for (let i = 0; i < suns.length; i++) {
          const s = suns[i];
          for (let d = 0; d < 4; d++) traceVis(s.r, s.c, GameEngine.DIRS4[d].dr, GameEngine.DIRS4[d].dc, 0, 1);
        }
        for (let i = 0; i < dyn.entities.length; i++) {
          const e = dyn.entities[i];
          const vis = eVis.get(e.id);
          const er = vis ? vis.vr : e.r;
          const ec = vis ? vis.vc : e.c;
          if (e.kind === "L") {
            for (let d = 0; d < 4; d++) traceVis(er, ec, GameEngine.DIRS4[d].dr, GameEngine.DIRS4[d].dc, 0, 1);
          } else if (GameEngine.SPOT_DIRS[e.kind]) {
            const [sdr, sdc] = GameEngine.SPOT_DIRS[e.kind];
            traceVis(er, ec, sdr, sdc, 0, 1);
          }
        }

        return { beams, hitMirrors, blockers };
      }

      let elapsed = 0, lastTs = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(50, now - lastTs);
        lastTs = now;
        elapsed += dt * 0.001;
        const lerp = Math.min(1, dt * 0.017);

        if (game.inCover && game.staticMap) {
          game.demoTimer += dt;
          const interval = game.demoIdx >= coverDemoMoves.length ? 1800 : 420;
          if (game.demoTimer >= interval) {
            game.demoTimer = 0;
            if (game.demoIdx >= coverDemoMoves.length) {
              resetCoverDemo();
            } else {
              const prevIceSolid = game.staticMap.iceWalls.map(w =>
                !game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c)
              );
              const prevLockedFlags = game.staticMap.goals.map(gl => {
                const ent = GameEngine.solidEntityAt(game.dyn, game.light.lit, gl.r, gl.c);
                return Boolean(ent && GameEngine.TARGET_BOXES.has(ent.kind));
              });
              const [dr, dc, dir] = coverDemoMoves[game.demoIdx++];
              const res = GameEngine.stepState(game.staticMap, game.dyn, game.light.lit, dr, dc, dir);
              if (res) {
                game.dyn = res.dyn;
                game.light = GameEngine.computeLighting(game.staticMap, game.dyn, true);
                if (res.pushed) {
                  game.pVis.pushSquash = 1; game.pVis.pushDr = dr; game.pVis.pushDc = dc;
                } else {
                  game.pVis.hop = 1;
                }
                game.staticMap.iceWalls.forEach((w, idx) => {
                  const nowS = !game.light.lit[w.r][w.c] && !GameEngine.isTerrainSuppressed(game.dyn, game.light.lit, w.r, w.c);
                  if (prevIceSolid[idx] !== nowS) {
                    spawnPhaseParticles(w.r, w.c, nowS ? "#D8F4FF" : "#78CCF2", "ice");
                  }
                });
                const demoWon = GameEngine.isWon(game.staticMap, game.dyn, game.light.lit);
                game.staticMap.goals.forEach((gl, idx) => {
                  const ent = GameEngine.solidEntityAt(game.dyn, game.light.lit, gl.r, gl.c);
                  const nowLocked = Boolean(ent && GameEngine.TARGET_BOXES.has(ent.kind));
                  if (nowLocked && !prevLockedFlags[idx]) {
                    game.goalLockBounce[idx] = 1;
                    game.ripples.push({ r: gl.r, c: gl.c, life: demoWon ? 720 : 420, maxLife: demoWon ? 720 : 420, isVictory: demoWon, isPlatinum: demoWon });
                    if (demoWon) spawnPhaseParticles(gl.r, gl.c, "#9CE0FF", "ray");
                  }
                });
              }
            }
          }
        } else if (game.walkQueue.length > 0 && !game.won) {
          game.walkTimer += dt;
          if (game.walkTimer >= 112) {
            game.walkTimer = 0;
            const nextMv = game.walkQueue.shift();
            const ok = move(nextMv.dr, nextMv.dc, nextMv.dir, true);
            if (!ok || game.walkQueue.length === 0) game.walkTarget = null;
          }
        }

        ctx.clearRect(0, 0, game.viewW, game.viewH);
        if (!game.staticMap || !game.dyn || !game.light) return;

        const { rows, cols, walls, suns, iceWalls, treeWalls, goals } = game.staticMap;
        const { lit } = game.light;
        const ts = game.ts, bx = game.bx, by = game.by;

        // 提前推进主角与实体的连续滑动位置，用于计算无硬切实时光路
        game.pVis.vr += (game.dyn.player.r - game.pVis.vr) * lerp;
        game.pVis.vc += (game.dyn.player.c - game.pVis.vc) * lerp;
        game.pVis.hop = Math.max(0, game.pVis.hop - dt * 0.0068);
        game.pVis.pushSquash = Math.max(0, game.pVis.pushSquash - dt * 0.0072);
        game.pVis.bumpT = Math.max(0, game.pVis.bumpT - dt * 0.006);

        game.dyn.entities.forEach(e => {
          let vis = game.eVis.get(e.id);
          if (!vis) {
            vis = { vr: e.r, vc: e.c, hover: 0, phase: GameEngine.isEntitySolid(game.dyn, lit, e) ? 1 : 0 };
            game.eVis.set(e.id, vis);
          }
          vis.vr += (e.r - vis.vr) * lerp;
          vis.vc += (e.c - vis.vc) * lerp;
          const solid = GameEngine.isEntitySolid(game.dyn, lit, e);
          vis.phase += ((solid ? 1 : 0) - vis.phase) * Math.min(1, dt * 0.015);
          const isAdj = !game.inCover && solid && (Math.abs(game.dyn.player.r - e.r) + Math.abs(game.dyn.player.c - e.c) === 1);
          vis.hover += ((isAdj ? 1 : 0) - vis.hover) * Math.min(1, dt * 0.012);
        });

        const phaseLerp = Math.min(1, dt * 0.015);
        iceWalls.forEach((w, idx) => {
          const sup = GameEngine.isTerrainSuppressed(game.dyn, lit, w.r, w.c);
          const solid = !lit[w.r][w.c] && !sup;
          game.icePhase[idx] += ((solid ? 1 : 0) - game.icePhase[idx]) * phaseLerp;
        });
        treeWalls.forEach((w, idx) => {
          const sup = GameEngine.isTerrainSuppressed(game.dyn, lit, w.r, w.c);
          const solid = lit[w.r][w.c] && !sup;
          game.amberPhase[idx] += ((solid ? 1 : 0) - game.amberPhase[idx]) * phaseLerp;
        });

        const visLight = computeVisualLight(game.staticMap, game.dyn, game.pVis, game.eVis, game.amberPhase);
        const { beams, hitMirrors, blockers } = visLight;

        if (game.boardIntro < 1) game.boardIntro = Math.min(1, game.boardIntro + dt * 0.0056);
        const introEase = 1 - Math.pow(1 - game.boardIntro, 3);

        ctx.save();
        if (game.boardIntro < 1) {
          const cx = bx + (cols * ts) / 2, cy = by + (rows * ts) / 2;
          const sc = 0.96 + 0.04 * introEase;
          ctx.globalAlpha = introEase;
          ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
        }

        Assets2D.drawIslandBase(ctx, bx, by, cols * ts, rows * ts, ts);

        const isSunEmbedded = (r, c) => (
          (r > 0 && walls[r - 1][c]) ||
          (r < rows - 1 && walls[r + 1][c]) ||
          (c > 0 && walls[r][c - 1]) ||
          (c < cols - 1 && walls[r][c + 1])
        );
        const wallMask = walls.map((row, r) => row.map((v, c) => v || suns.some(s => s.r === r && s.c === c && isSunEmbedded(r, c))));

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = bx + c * ts, y = by + r * ts;
            const targetLit = lit[r][c] ? 1 : 0;
            game.floorLitAnim[r][c] += (targetLit - game.floorLitAnim[r][c]) * lerp;
            const f = game.floorLitAnim[r][c];
            const baseHex = (r + c) % 2 === 0 ? Assets2D.CFG.floorA : Assets2D.CFG.floorB;
            ctx.fillStyle = wallMask[r][c]
              ? Assets2D.CFG.wallBase
              : (f > 0.5 ? Assets2D.lerpHex(baseHex, Assets2D.CFG.floorLit, (f - 0.5) * 1.15) : Assets2D.lerpHex(Assets2D.CFG.floorShadow, baseHex, f * 2));
            ctx.fillRect(x, y, ts, ts);
            if (!wallMask[r][c]) {
              ctx.strokeStyle = Assets2D.CFG.floorGrid;
              ctx.lineWidth = 1;
              ctx.strokeRect(x + 0.5, y + 0.5, ts - 1, ts - 1);
            }
          }
        }

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (wallMask[r][c]) {
              Assets2D.castShadowRect(ctx, bx + c * ts, by + r * ts, ts, ts, 2, ts * Assets2D.CFG.shadowLen, Assets2D.CFG.isDark ? 0.3 : 0.15);
            }
          }
        }

        goals.forEach((g, idx) => {
          const e = GameEngine.solidEntityAt(game.dyn, lit, g.r, g.c);
          const locked = Boolean(e && GameEngine.TARGET_BOXES.has(e.kind));
          game.goalLockAnim[idx] += ((locked ? 1 : 0) - game.goalLockAnim[idx]) * Math.min(1, dt * 0.012);
          game.goalLockBounce[idx] = Math.max(0, (game.goalLockBounce[idx] || 0) - dt * 0.0055);
          Assets2D.drawGoal(ctx, bx + g.c * ts, by + g.r * ts, ts, game.goalLockAnim[idx], elapsed);
        });

        if (game.walkTarget) Assets2D.drawWalkTarget(ctx, bx + game.walkTarget.c * ts, by + game.walkTarget.r * ts, ts, elapsed);

        iceWalls.forEach((w, idx) => {
          const sup = GameEngine.isTerrainSuppressed(game.dyn, lit, w.r, w.c);
          if (game.icePhase[idx] < 0.97) {
            Assets2D.drawIceWallPool(ctx, bx + w.c * ts, by + w.r * ts, ts, !lit[w.r][w.c] && sup, elapsed, idx, 1 - game.icePhase[idx]);
          }
        });

        treeWalls.forEach((w, idx) => {
          const sup = GameEngine.isTerrainSuppressed(game.dyn, lit, w.r, w.c);
          if (game.amberPhase[idx] < 0.97) {
            Assets2D.drawAmberWallDormant(ctx, bx + w.c * ts, by + w.r * ts, ts, lit[w.r][w.c] && sup, elapsed, 1 - game.amberPhase[idx]);
          }
        });

        // 虚化/压制可变箱（C/F）底层表现（无上层实箱/封存墙时清晰呈现）
        game.dyn.entities.forEach(e => {
          const vis = game.eVis.get(e.id);
          const solid = GameEngine.isEntitySolid(game.dyn, lit, e);
          if (solid || vis.phase >= 0.97) return;
          if (e.kind !== "C" && e.kind !== "F") return;

          const hasSolidBoxOnTop = game.dyn.entities.some(o =>
            o.id !== e.id && o.r === e.r && o.c === e.c &&
            (o.kind === "B" || o.kind === "C" || o.kind === "F") &&
            GameEngine.isEntitySolid(game.dyn, lit, o)
          );
          const sealedByIce = e.kind === "F" && iceWalls.some((w, idx) => w.r === e.r && w.c === e.c && (game.icePhase[idx] || 0) > 0.25);
          const sealedByAmber = e.kind === "C" && treeWalls.some((w, idx) => w.r === e.r && w.c === e.c && (game.amberPhase[idx] || 0) > 0.25);
          if (hasSolidBoxOnTop || sealedByIce || sealedByAmber) return;

          const underRoundTool = game.dyn.entities.some(o =>
            o.id !== e.id && o.r === e.r && o.c === e.c &&
            (o.kind === "L" || o.kind === "\\" || o.kind === "/" || Boolean(GameEngine.SPOT_DIRS[o.kind]))
          );
          const isSup = (e.kind === "C" && !lit[e.r][e.c]) || (e.kind === "F" && lit[e.r][e.c]);
          Assets2D.drawDormantBoxPad(ctx, bx + vis.vc * ts, by + vis.vr * ts, ts, e.kind, isSup, elapsed, e.id, underRoundTool, 1 - vis.phase);
        });

        Assets2D.drawBeams(ctx, bx, by, ts, beams, elapsed);
        Assets2D.drawOcclusionShadows(ctx, bx, by, ts, blockers);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (walls[r][c]) Assets2D.drawWall(ctx, bx + c * ts, by + r * ts, ts, r, c, wallMask, rows, cols);
          }
        }
        suns.forEach(s => Assets2D.drawSunTower(ctx, bx + s.c * ts, by + s.r * ts, ts, elapsed, s.r, s.c, wallMask, rows, cols, isSunEmbedded(s.r, s.c)));

        iceWalls.forEach((w, idx) => {
          const ph = game.icePhase[idx] || 0;
          if (ph > 0.03) {
            const sealedF = game.dyn.entities.some(e => e.r === w.r && e.c === w.c && e.kind === "F");
            Assets2D.drawIceWall(ctx, bx + w.c * ts, by + w.r * ts, ts, ph, sealedF ? 1 : 0);
          }
        });
        treeWalls.forEach((w, idx) => {
          const ph = game.amberPhase[idx] || 0;
          if (ph > 0.03) {
            const sealedC = game.dyn.entities.some(e => e.r === w.r && e.c === w.c && e.kind === "C");
            Assets2D.drawAmberWall(ctx, bx + w.c * ts, by + w.r * ts, ts, ph, sealedC ? 1 : 0);
          }
        });

        game.dyn.entities.forEach(e => {
          const vis = game.eVis.get(e.id);
          const solid = GameEngine.isEntitySolid(game.dyn, lit, e);
          if (!solid && vis.phase <= 0.03) return;
          const x = bx + vis.vc * ts, y = by + vis.vr * ts;
          const goalIdx = goals.findIndex(g => g.r === e.r && g.c === e.c);
          const onGoal = goalIdx >= 0;
          const bounceVal = onGoal ? (game.goalLockBounce[goalIdx] || 0) : 0;
          const lockScale = 1 - Math.sin(bounceVal * Math.PI) * 0.075;

          const underBox = solid
            ? game.dyn.entities.find(o => o.id !== e.id && o.r === e.r && o.c === e.c && (o.kind === "C" || o.kind === "F"))
            : null;
          const isSup = Boolean(underBox && ((underBox.kind === "C" && !lit[e.r][e.c]) || (underBox.kind === "F" && lit[e.r][e.c])));

          if (e.kind === "B") {
            Assets2D.drawWoodBox(ctx, x, y, ts, onGoal, elapsed, lockScale, false, underBox ? underBox.kind : null, isSup);
          } else if (e.kind === "C") {
            Assets2D.drawIceBox(ctx, x, y, ts, onGoal && solid, elapsed, vis.phase, lockScale, false, Boolean(underBox && underBox.kind === "F"));
          } else if (e.kind === "F" && vis.phase > 0.03) {
            Assets2D.drawAmberBox(ctx, x, y, ts, vis.phase, onGoal && solid, elapsed, lockScale, false, Boolean(underBox && underBox.kind === "C"));
          } else if (e.kind === "L") {
            Assets2D.drawLantern(ctx, x, y, ts, elapsed);
          } else if (GameEngine.SPOT_DIRS[e.kind]) {
            Assets2D.drawSpotlight(ctx, x, y, ts, e.kind, elapsed);
          } else if (e.kind === "\\" || e.kind === "/") {
            Assets2D.drawMirror(ctx, x, y, ts, e.kind, hitMirrors.has(e.id));
          }
        });

        for (let i = game.ripples.length - 1; i >= 0; i--) {
          const rp = game.ripples[i];
          rp.life -= dt;
          if (rp.life <= 0) { game.ripples.splice(i, 1); continue; }
          Assets2D.drawGoalRipple(ctx, bx + rp.c * ts, by + rp.r * ts, ts, 1 - rp.life / rp.maxLife, rp.isVictory, rp.isPlatinum);
        }

        const bumpMag = Math.sin(game.pVis.bumpT * Math.PI) * ts * 0.11;
        Assets2D.drawHero(
          ctx, bx + game.pVis.vc * ts, by + game.pVis.vr * ts, ts,
          game.dyn.player.dir, game.pVis.hop, progress.heroId,
          game.pVis.bumpDc * bumpMag, game.pVis.bumpDr * bumpMag,
          elapsed, game.pVis.pushSquash, game.pVis.pushDr, game.pVis.pushDc
        );

        Assets2D.drawLitRims(ctx, bx, by, ts, blockers);

        for (let i = game.particles.length - 1; i >= 0; i--) {
          const p = game.particles[i];
          p.life -= dt;
          if (p.life <= 0) { game.particles.splice(i, 1); continue; }
          p.r += p.vr * dt; p.c += p.vc * dt;
          if (p.vrot) p.rot = (p.rot || 0) + p.vrot * dt;
          const alpha = p.life / p.maxLife;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(bx + p.c * ts, by + p.r * ts, p.size * (0.5 + 0.5 * alpha), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (game.hintArrow && now < game.hintArrow.expireAt) {
          Assets2D.drawGuideArrow(ctx, bx + game.dyn.player.c * ts, by + game.dyn.player.r * ts, ts, game.hintArrow.dr, game.hintArrow.dc, elapsed);
        }

        ctx.restore();

        if (!game.inCover && !game.won && touchCtrl.state.active) {
          Assets2D.drawTouchFeedback(ctx, touchCtrl.state);
        }
      }

      /* =====================================================================
         10. HUD、选关弹窗、外观弹窗与自定义导入
         ===================================================================== */
      function updateHUD() {
        const lvl = LEVELS[game.levelIdx];
        document.getElementById("hudLevelCode").textContent = lvl.code;
        const badgeEl = document.getElementById("hudLevelBadge");
        const rec = progress.records[lvl.id];
        if (badgeEl) {
          badgeEl.innerHTML = rec && (rec.cleared || rec.bestSteps > 0)
            ? (rec.platinum ? UI_SVGS.platMini : UI_SVGS.goldMini)
            : "";
        }
        const stepEl = document.getElementById("stepBadge");
        if (rec) {
          const opt = GameEngine.getOptimalSteps(lvl);
          stepEl.innerHTML = opt ? `${game.steps} <span class="opt-sub">/ 最优 ${opt}</span>` : `${game.steps} 步`;
        } else {
          stepEl.textContent = `${game.steps} 步`;
        }
        document.getElementById("hintBadge").textContent = progress.hintsLeft;
        const undoBtn = document.getElementById("btnUndo");
        undoBtn.disabled = game.history.length === 0 || game.won;
        undoBtn.classList.toggle("deadlock-alert", game.deadlock && !undoBtn.disabled);
      }

      const chapterUI = { activeChap: 1, filterGaps: false };

      function buildSundialSVG(slots, isDark) {
        const n = Math.max(1, slots.length);
        const cx = 54, cy = 54, rOuter = 44, rOrbit = 29.5;
        const ringBase = isDark ? "rgba(182,208,245,0.18)" : "rgba(128,122,114,0.18)";
        let arcs = "", petals = "", dots = "";

        const clearedCnt = slots.filter(s => {
          const r = getSlotRecord(s);
          return Boolean(r && (r.cleared || r.bestSteps > 0));
        }).length;
        const allCleared = clearedCnt === n;
        const allPlat = slots.every(s => {
          const r = getSlotRecord(s);
          return Boolean(r && r.platinum);
        });

        for (let i = 0; i < n; i++) {
          const rec = getSlotRecord(slots[i]);
          const nextRec = getSlotRecord(slots[(i + 1) % n]);
          const cleared = Boolean(rec && (rec.cleared || rec.bestSteps > 0));
          const plat = Boolean(rec && rec.platinum);
          const nextPlat = Boolean(nextRec && nextRec.platinum);

          const a1 = (Math.PI * 2 * i) / n - Math.PI / 2;
          const a2 = (Math.PI * 2 * (i + 1)) / n - Math.PI / 2;
          const cos = Math.cos(a1), sin = Math.sin(a1);

          // 1) 外围十二时辰星环连线（保留备受好评的星环结构，优化冰川蓝通透渐变）
          if (n > 1 && plat && nextPlat) {
            const x1 = cx + Math.cos(a1) * rOuter, y1 = cy + Math.sin(a1) * rOuter;
            const x2 = cx + Math.cos(a2) * rOuter, y2 = cy + Math.sin(a2) * rOuter;
            arcs += `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${rOuter} ${rOuter} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="rgba(76,180,242,0.28)" stroke-width="5.6" stroke-linecap="round"/>`;
            arcs += `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${rOuter} ${rOuter} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="url(#dialArcGrad)" stroke-width="2.1" stroke-linecap="round"/>`;
          }

          // 2) 全新内部「光棱星冕」：12 枚纤细菱形折射光针（主/次交替长度，告别死板直线）
          const isCardinal = i % 3 === 0;
          const rIn = 15.5;
          const rTip = plat ? (isCardinal ? 36.2 : 33.4) : (cleared ? (isCardinal ? 33.6 : 30.8) : (isCardinal ? 25.5 : 23.2));
          const halfW = cleared ? (isCardinal ? 2.15 : 1.6) : 1.05;
          const px = -sin * halfW, py = cos * halfW;
          const rMidP = (rIn + rTip) * 0.46;
          const bx = cx + cos * rIn, by = cy + sin * rIn;
          const mx1 = cx + cos * rMidP + px, my1 = cy + sin * rMidP + py;
          const mx2 = cx + cos * rMidP - px, my2 = cy + sin * rMidP - py;
          const tx = cx + cos * rTip, ty = cy + sin * rTip;
          const fillCol = cleared
            ? (plat ? "url(#dialRayPlat)" : "url(#dialRayGold)")
            : (isDark ? "rgba(164,186,218,0.18)" : "rgba(148,140,128,0.18)");
          petals += `<polygon points="${bx.toFixed(1)},${by.toFixed(1)} ${mx1.toFixed(1)},${my1.toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)} ${mx2.toFixed(1)},${my2.toFixed(1)}" fill="${fillCol}"/>`;

          // 3) 外环 12 枚星点

        // 中心光核随进度演化：未开(静谧星核) -> 推进/全通(香槟日冕) -> 12/12 圆满(冰珀双生星冕)
        const haloFill = allPlat

          ? "rgba(255,236,172,0.85)"
          : (clearedCnt > 0 ? "rgba(255,222,138,0.68)" : (isDark ? "rgba(160,180,214,0.2)" : "rgba(156,148,136,0.22)"));

        return `<svg width="108" height="108" viewBox="0 0 108 108" fill="none">
          <defs>
            <linearGradient id="dialArcGrad" x1="12" y1="12" x2="96" y2="96" gradientUnits="userSpaceOnUse">

              <stop offset="100%" stop-color="#6AC4F6"/>
            </linearGradient>
            <radialGradient id="dialCoreHaloGold" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(255,226,136,0.52)"/>
              <stop offset="100%" stop-color="rgba(255,226,136,0)"/>
            </radialGradient>
            <radialGradient id="dialCoreHaloPlat" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(122,212,255,0.58)"/>
              <stop offset="55%" stop-color="rgba(255,226,144,0.26)"/>
              <stop offset="100%" stop-color="rgba(122,212,255,0)"/>
            </radialGradient>
            <linearGradient id="dialStarGold" x1="38" y1="38" x2="70" y2="70" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFF5CA"/>
              <stop offset="55%" stop-color="#F2B642"/>
              <stop offset="100%" stop-color="#C9801C"/>
            </linearGradient>
            <linearGradient id="dialStarPlat" x1="36" y1="36" x2="72" y2="72" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#F0FBFF"/>
              <stop offset="50%" stop-color="#6BC6F6"/>
              <stop offset="100%" stop-color="#EBA836"/>
            </linearGradient>
          </defs>
          ${allPlat ? `<circle cx="54" cy="54" r="49" stroke="rgba(104,198,248,0.44)" stroke-width="1.15" stroke-dasharray="3 4"/>` : ""}
          <circle cx="54" cy="54" r="${rOuter}" stroke="${ringBase}" stroke-width="1.1" stroke-dasharray="2.4 3.4"/>
          <g class="dial-orbit-spin">
            <circle cx="54" cy="54" r="${rOrbit}" stroke="${ringBase}" stroke-width="0.9" stroke-dasharray="5 4"/>

            <circle cx="54" cy="${54 + rOrbit}" r="1.4" fill="${allPlat ? "#72CCF8" : "#E6AA3E"}" opacity="0.72"/>

            <path d="M54 44.5 Q54 54 63.5 54 Q54 54 54 63.5 Q54 54 44.5 54 Q54 54 54 44.5 Z" transform="rotate(45 54 54)" fill="${starSubFill}"/>
            <path d="M54 41.2 Q54 54 66.8 54 Q54 54 54 66.8 Q54 54 41.2 54 Q54 54 54 41.2 Z" fill="${starMainFill}"/>

      function renderChaptersModal(syncToCurrentLevel = false) {
        const chapNums = [...CHAPTER_ORDER];

        if (syncToCurrentLevel && !game.inCover && LEVELS[game.levelIdx]) {
          chapterUI.activeChap = LEVELS[game.levelIdx].chapter;
          chapterUI.filterGaps = false;
        }
        if (!chapNums.includes(chapterUI.activeChap)) {
          chapterUI.activeChap = 1;
        }

        const cIdx = chapNums.indexOf(chapterUI.activeChap);
        const cNum = chapNums[cIdx];
        const slots = getChapterSlots(cNum);
        const isDark = Boolean(Assets2D.CFG.isDark);

        const { clearedMain, totalMain } = getProgressTotals();
        document.getElementById("chapTotalPill").innerHTML = `✦ <b>${clearedMain}</b>/${totalMain}`;

        const dotsRoot = document.getElementById("chapDots");
        dotsRoot.innerHTML = chapNums.map(num => {
          const sList = getChapterSlots(num);
          const isFull = sList.length > 0 && sList.every(s => Boolean(getSlotRecord(s) && getSlotRecord(s).platinum));
          const title = CHAPTER_META[num] ? CHAPTER_META[num].title : `第 ${num} 卷`;
          return `<button class="chap-dot ${num === cNum ? "active" : ""} ${isFull ? "perfected" : ""}" data-cnum="${num}" title="${title}" aria-label="${title}"></button>`;
        }).join("");
        dotsRoot.querySelectorAll(".chap-dot").forEach(btn => {
          btn.addEventListener("click", () => {
            chapterUI.activeChap = Number(btn.dataset.cnum);
            chapterUI.filterGaps = false;
            renderChaptersModal(false);
          });
        });

        const meta = CHAPTER_META[cNum] || CHAPTER_META[1];
        const clrCnt = slots.filter(s => {
          const r = getSlotRecord(s);
          return Boolean(r && (r.cleared || r.bestSteps > 0));
        }).length;
        const platCnt = slots.filter(s => {
          const r = getSlotRecord(s);
          return Boolean(r && r.platinum);
        }).length;
        const gapCnt = Math.max(0, clrCnt - platCnt);
        if (gapCnt === 0) chapterUI.filterGaps = false;
        const isPerfected = slots.length > 0 && platCnt === slots.length;

        const rewardTarget = meta.rewardReqPlat || 12;
        const rewardUnlocked = platCnt >= rewardTarget;

        const album = document.getElementById("chapAlbumCard");
        album.className = "chap-album-card" + (isPerfected ? " perfected" : "");
        album.style.background = isDark ? meta.bgNight : meta.bgDay;
        album.style.setProperty("--album-aura", isDark ? (meta.auraNight || "rgba(104,186,242,0.24)") : (meta.auraDay || "rgba(255,224,154,0.45)"));
        album.innerHTML = `
          <div class="chap-nav-row">
            <button class="chap-arrow" id="btnPrevChap" ${cIdx <= 0 ? "disabled" : ""}>‹</button>
            <div class="chap-center-title">
              <span class="chap-idx-num">${meta.numStr}</span>
              <span class="chap-name-big">${meta.shortName}</span>
            </div>
            <button class="chap-arrow" id="btnNextChap" ${cIdx >= chapNums.length - 1 ? "disabled" : ""}>›</button>
          </div>

          <div class="dial-stage-center">
            <div class="dial-svg-wrap ${chapterUI.filterGaps ? "gap-active" : ""}" id="dialFocusTrigger" title="${gapCnt > 0 ? "轻触星环聚焦未极简关卡" : "十二时辰星环"}">
              ${buildSundialSVG(slots, isDark)}
            </div>
          </div>

          <div class="chap-meta-bar">
            <div class="chap-counts">
              <span class="chap-count-chip">${UI_SVGS.goldMini}<b>${clrCnt}</b>/${slots.length}</span>
              <span class="chap-count-chip">${UI_SVGS.platMini}<b>${platCnt}</b>/${slots.length}</span>
            </div>
            <div class="chap-reward-mini ${rewardUnlocked ? "unlocked" : ""}">
              <span class="reward-dot" style="background:${meta.rewardSwatch};"></span>
              <span class="reward-mini-label">${meta.rewardName}</span>
              ${rewardUnlocked ? "<span>✦</span>" : ""}
            </div>
          </div>
        `;

        const prevBtn = document.getElementById("btnPrevChap");
        const nextBtn = document.getElementById("btnNextChap");
        if (prevBtn) prevBtn.addEventListener("click", () => {
          if (cIdx > 0) { chapterUI.activeChap = chapNums[cIdx - 1]; chapterUI.filterGaps = false; renderChaptersModal(false); }
        });
        if (nextBtn) nextBtn.addEventListener("click", () => {
          if (cIdx < chapNums.length - 1) { chapterUI.activeChap = chapNums[cIdx + 1]; chapterUI.filterGaps = false; renderChaptersModal(false); }
        });

        const dialTrigger = document.getElementById("dialFocusTrigger");
        if (dialTrigger) dialTrigger.addEventListener("click", () => {
          if (gapCnt > 0) {
            chapterUI.filterGaps = !chapterUI.filterGaps;
            renderChaptersModal(false);
            if (chapterUI.filterGaps) showToast(`已高亮 ${gapCnt} 处未极简关卡`, 1500);
          }
        });

        const grid = document.getElementById("chapBrickGrid");
        grid.className = "brick-grid cols-4" + (chapterUI.filterGaps ? " filter-gaps" : "");
        grid.innerHTML = "";

        const nextMainTarget = LEVELS.find(l => isLevelUnlocked(l) && !progress.records[l.id]);

        slots.forEach(s => {
          const l = s.level;
          const idx = l ? LEVELS.indexOf(l) : -1;
          const rec = getSlotRecord(s);
          const isCleared = Boolean(rec && (rec.cleared || rec.bestSteps > 0));
          const isPlat = Boolean(rec && rec.platinum);
          const isReserved = !l;
          const unlocked = l ? isLevelUnlocked(l) : false;
          const isCur = Boolean(l && ((!game.inCover && idx === game.levelIdx) || (game.inCover && nextMainTarget && nextMainTarget.id === l.id)));

          const card = document.createElement("div");
          card.className = "brick-card"
            + (isPlat ? " plat" : (isCleared ? " cleared" : ""))
            + (isReserved ? " reserved" : "")
            + (!isReserved && isCur && unlocked ? " current" : "")
            + (!isReserved && !unlocked ? " locked" : "");

          let mark = "";
          if (isPlat) mark = UI_SVGS.platMini;
          else if (isCleared) mark = UI_SVGS.goldMini;
          else if (isReserved) mark = `<span class="reserved-dot" title="待收录关卡"></span>`;
          else if (!unlocked) mark = UI_SVGS.lock;
          else if (isCur) mark = `<span class="current-pulse"></span>`;

          card.innerHTML = `<div class="brick-num">${s.code}</div><div class="brick-mark">${mark}</div>`;

          card.addEventListener("click", () => {
            if (!l) {
              showToast(`「${s.code}」敬请期待`);
              return;
            }
            if (!unlocked) { showToast("先通关前面关卡即可解锁"); return; }
            exitCover(idx);
          });
          grid.appendChild(card);
        });
      }

      function renderThemesModal() {
        const { clearedMain, plat } = getProgressTotals();
        const forceUnlockSkins = DEV_FLAGS.unlockAllSkins || URL_TEST_UNLOCK;
        const envGrid = document.getElementById("envSkinGrid");
        envGrid.innerHTML = "";
        THEMES.forEach(th => {
          const unlocked = forceUnlockSkins || (clearedMain >= th.reqCleared && plat >= th.reqPlat);
          const card = document.createElement("div");
          card.className = "skin-card" + (progress.themeId === th.id ? " active" : "") + (!unlocked ? " locked" : "");
          card.innerHTML = `
            <div class="theme-swatch" style="background:${th.swatch};"></div>
            <div class="skin-name">${th.name}</div>
            <div class="skin-req">${unlocked ? (progress.themeId === th.id ? "使用中" : "点击启用") : UI_SVGS.lock + " " + th.reqText}</div>
          `;
          card.addEventListener("click", () => {
            if (!unlocked) { showToast(`需 ${th.reqText} 解锁`); return; }
            progress.themeId = th.id;
            saveProgress();
            Assets2D.applyTheme(th.id);
            renderThemesModal();
          });
          envGrid.appendChild(card);
        });

        const heroGrid = document.getElementById("heroSkinGrid");
        heroGrid.innerHTML = "";
        HERO_SKINS.forEach(hs => {
          const unlocked = forceUnlockSkins || (clearedMain >= hs.reqCleared && plat >= hs.reqPlat);
          const card = document.createElement("div");
          card.className = "skin-card" + (progress.heroId === hs.id ? " active" : "") + (!unlocked ? " locked" : "");
          card.innerHTML = `
            <canvas class="hero-preview-cvs" width="112" height="112"></canvas>
            <div class="skin-name">${hs.name}</div>
            <div class="skin-req">${unlocked ? (progress.heroId === hs.id ? "使用中" : "点击启用") : UI_SVGS.lock + " " + hs.reqText}</div>
          `;
          const pCtx = card.querySelector("canvas").getContext("2d");
          pCtx.clearRect(0, 0, 112, 112);
          Assets2D.drawHero(pCtx, 12, 12, 88, "right", 0, hs.id);
          card.addEventListener("click", () => {
            if (!unlocked) { showToast(`需 ${hs.reqText} 解锁`); return; }
            progress.heroId = hs.id;
            saveProgress();
            renderThemesModal();
          });
          heroGrid.appendChild(card);
        });
      }

      /* =====================================================================
         11. 事件绑定与移动端自动竖屏适配
         ===================================================================== */
      function detectMobile() {
        const isMob = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger/i.test(navigator.userAgent) ||
          (window.matchMedia && window.matchMedia("(pointer: coarse)").matches && window.innerWidth <= 820);
        document.body.classList.toggle("is-mobile", isMob);
        if (isMob) document.body.classList.remove("mobile-preview");
      }

      document.getElementById("btnMobileToggle").addEventListener("click", e => {
        e.currentTarget.blur();
        stopAllControlHolds();
        const on = document.body.classList.toggle("mobile-preview");
        document.getElementById("mobileToggleText").textContent = on ? "全屏模式" : "手机竖屏";
        resizeCanvas();
        setTimeout(resizeCanvas, 310);
      });

      if (typeof ResizeObserver !== "undefined") {
        const stageRO = new ResizeObserver(() => resizeCanvas());
        stageRO.observe(appStage);
      }

      document.getElementById("btnStartGame").addEventListener("click", () => { audio.ensure(); exitCover(); });
      document.getElementById("btnCoverChapters").addEventListener("click", () => { renderChaptersModal(false); document.getElementById("chaptersOverlay").classList.add("open"); });
      document.getElementById("btnCoverThemes").addEventListener("click", () => { renderThemesModal(); document.getElementById("themesOverlay").classList.add("open"); });
      document.getElementById("btnHome").addEventListener("click", enterCover);
      document.getElementById("btnOpenChapters").addEventListener("click", () => { renderChaptersModal(true); document.getElementById("chaptersOverlay").classList.add("open"); });
      document.getElementById("btnThemes").addEventListener("click", () => { renderThemesModal(); document.getElementById("themesOverlay").classList.add("open"); });
      document.getElementById("btnCloseChapters").addEventListener("click", () => document.getElementById("chaptersOverlay").classList.remove("open"));
      document.getElementById("btnCloseThemes").addEventListener("click", () => document.getElementById("themesOverlay").classList.remove("open"));

      ["chaptersOverlay", "themesOverlay"].forEach(id => {
        const ov = document.getElementById(id);
        ov.addEventListener("click", e => { if (e.target === ov) ov.classList.remove("open"); });
      });

      document.getElementById("skinTabEnv").addEventListener("click", () => {
        document.getElementById("skinTabEnv").classList.add("active");
        document.getElementById("skinTabHero").classList.remove("active");
        document.getElementById("envSkinGrid").style.display = "grid";
        document.getElementById("heroSkinGrid").style.display = "none";
      });
      document.getElementById("skinTabHero").addEventListener("click", () => {
        document.getElementById("skinTabHero").classList.add("active");
        document.getElementById("skinTabEnv").classList.remove("active");
        document.getElementById("heroSkinGrid").style.display = "grid";
        document.getElementById("envSkinGrid").style.display = "none";
      });

      document.getElementById("btnClearReplay").addEventListener("click", () => {
        loadLevel(game.levelIdx);
      });
      document.getElementById("btnNextLevel").addEventListener("click", () => {
        const nextIdx = getNextLevelIdx(game.levelIdx);
        if (nextIdx >= 0) {
          loadLevel(nextIdx);
        } else {
          document.getElementById("clearOverlay").classList.remove("open");
          renderChaptersModal(true);
          document.getElementById("chaptersOverlay").classList.add("open");
        }
      });

      // 长按连续悔棋（仅主键触发、防右键菜单、窗口失焦/抬起必停）
      const btnUndo = document.getElementById("btnUndo");
      btnUndo.addEventListener("contextmenu", e => e.preventDefault());
      btnUndo.addEventListener("pointerdown", e => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        if (btnUndo.disabled || game.inCover) return;
        e.preventDefault();
        stopDpadHold();
        stopUndoHold();
        if (!undo()) return;
        undoHoldDelay = setTimeout(() => {
          undoHoldInterval = setInterval(() => { if (!undo()) stopUndoHold(); }, 125);
        }, 340);
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach(ev => btnUndo.addEventListener(ev, stopUndoHold));

      document.getElementById("btnReset").addEventListener("click", e => {
        e.currentTarget.blur();
        restartLevelWithUndo();
      });
      document.getElementById("btnSound").addEventListener("click", e => {
        e.currentTarget.blur();
        audio.muted = !audio.muted;
        e.currentTarget.style.opacity = audio.muted ? "0.45" : "1";
        document.getElementById("icoSound").innerHTML = audio.muted ? UI_SVGS.soundOff : UI_SVGS.soundOn;
      });
      document.getElementById("btnToggleDpad").addEventListener("click", e => {
        e.currentTarget.blur();
        stopDpadHold();
        const isOpen = document.getElementById("dpadBox").classList.toggle("open");
        e.currentTarget.classList.toggle("active", isOpen);
        closeHintPopover();
        resizeCanvas();
      });

      document.getElementById("btnHint").addEventListener("click", () => {
        const pop = document.getElementById("hintPopover");
        document.getElementById("hintPopText").textContent = LEVELS[game.levelIdx].hint || "观察光路与占格压制关系。";
        pop.classList.toggle("open");
      });
      document.getElementById("btnCloseHint").addEventListener("click", () => document.getElementById("hintPopover").classList.remove("open"));
      document.getElementById("btnBfsStep").addEventListener("click", () => {
        if (progress.hintsLeft <= 0) { showToast("指引次数已用完，通关新关卡可自动补给"); return; }
        const res = GameEngine.findNextBestMoveEx(game.staticMap, game.dyn);
        if (res.status === "deadlock") {
          game.deadlock = true; updateHUD();
          document.getElementById("hintPopover").classList.remove("open");
          showToast("当前已走入死角，建议先点悔棋退回");
          return;
        }
        if (res.status === "timeout" || !res.move) {
          document.getElementById("hintPopover").classList.remove("open");
          showToast("当前局面较复杂，建议结合思路提示或悔棋微调", 2400);
          return;
        }
        const mv = res.move;
        progress.hintsLeft--; saveProgress(); updateHUD();
        game.hintArrow = { dr: mv.dr, dc: mv.dc, expireAt: performance.now() + 3400 };
        document.getElementById("hintPopover").classList.remove("open");
        showToast(`建议方向：${mv.sym}`);
      });

      document.getElementById("btnShareScore").addEventListener("click", () => {
        const lvl = LEVELS[game.levelIdx];
        const opt = GameEngine.getOptimalSteps(lvl);
        const text = `我在《光影推箱 · LumenBox》第 ${lvl.code} 关用 ${game.steps} 步通关${opt && game.steps <= opt ? "（达成理论最优！）" : ""}，来挑战看看！`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast("战绩文案已复制")).catch(() => {
            const ta = document.createElement("textarea");
            ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select();
            try { document.execCommand("copy"); showToast("战绩文案已复制"); } catch (e) {}
            document.body.removeChild(ta);
          });
        } else {
          const ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); showToast("战绩文案已复制"); } catch (e) {}
          document.body.removeChild(ta);
        }
      });

      // 方向键支持长按连走（支持 pointer capture、撞墙/通关自动停、防长按菜单与失焦卡键）
      document.querySelectorAll(".dpad-btn").forEach(btn => {
        const dir = btn.dataset.dir;
        const mapDir = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
        const [dr, dc] = mapDir[dir];
        btn.addEventListener("contextmenu", e => e.preventDefault());
        btn.addEventListener("pointerdown", e => {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          if (game.inCover || game.won || hasOpenModal()) return;
          e.preventDefault();
          stopUndoHold();
          stopDpadHold();
          dpadActivePointerId = e.pointerId;
          try { btn.setPointerCapture(e.pointerId); } catch (err) {}
          const moved = move(dr, dc, dir);
          if (!moved || game.won) return;
          dpadDelay = setTimeout(() => {
            dpadInterval = setInterval(() => {
              if (!move(dr, dc, dir) || game.won) stopDpadHold();
            }, 140);
          }, 290);
        });
        const releaseThis = e => {
          if (dpadActivePointerId === null || e.pointerId === dpadActivePointerId) stopDpadHold();
        };
        ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => btn.addEventListener(ev, releaseThis));
      });

      window.addEventListener("pointerup", () => { stopUndoHold(); stopDpadHold(); });
      window.addEventListener("pointercancel", () => { stopUndoHold(); stopDpadHold(); });
      window.addEventListener("blur", stopAllControlHolds);

      // 画布触控与鼠标指针接入 TouchInputController
      canvas.addEventListener("pointerdown", e => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        closeHintPopover();
        const rect = canvas.getBoundingClientRect();
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        touchCtrl.onStart(e.clientX - rect.left, e.clientY - rect.top, e.pointerId);
      });
      canvas.addEventListener("pointermove", e => {
        const rect = canvas.getBoundingClientRect();
        touchCtrl.onMove(e.clientX - rect.left, e.clientY - rect.top, e.pointerId);
      });
      canvas.addEventListener("pointerup", e => {
        const rect = canvas.getBoundingClientRect();
        touchCtrl.onEnd(e.clientX - rect.left, e.clientY - rect.top, e.pointerId);
      });
      canvas.addEventListener("pointercancel", () => touchCtrl.cancel());

      window.addEventListener("keydown", e => {
        if (document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
        if (e.key === "Escape") {
          ["chaptersOverlay", "themesOverlay"].forEach(id => document.getElementById(id).classList.remove("open"));
          closeHintPopover();
          return;
        }
        if (document.getElementById("clearOverlay").classList.contains("open")) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.getElementById("btnNextLevel").click(); }
          return;
        }
        if (game.inCover || hasOpenModal()) return;
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") { e.preventDefault(); move(-1, 0, "up"); }
        else if (k === "arrowdown" || k === "s") { e.preventDefault(); move(1, 0, "down"); }
        else if (k === "arrowleft" || k === "a") { e.preventDefault(); move(0, -1, "left"); }
        else if (k === "arrowright" || k === "d") { e.preventDefault(); move(0, 1, "right"); }
        else if (k === "z") { e.preventDefault(); undo(); }
        else if (k === "r") { e.preventDefault(); restartLevelWithUndo(); }
      });

      window.addEventListener("resize", () => { detectMobile(); resizeCanvas(); });

      window.onload = function () {
        detectMobile();
        loadProgress();
        Assets2D.applyTheme(progress.themeId);
        enterCover();
        requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
</html>
